paths:
  environment_dir: ../artifacts/toolgen-reality-openalex-run
  schema_dir: ../schemas
  output_root: ../runs/taskgen

llm:
  # 普通阶段使用 API；Step 3 合并审查与执行，使用工具隔离的 Codex CLI。
  backend: api
  model: gpt-5.6-terra
  # review、管线和评测使用独立配置，不影响当前对话。
  codex_home: ~/.codex-task-eval
  # API 后端使用同一服务及独立 auth.json；密钥不进入配置或运行产物。
  base_url: http://47.237.200.112:8080/v1
  api_key_file: ~/.codex-task-eval/auth.json
  timeout_seconds: 600
  # 模型请求并发数。
  max_concurrency: 4
  # API 返回长度上限；实际用量以调用结果为准。
  # 仅 backend=api 时使用；Codex CLI 没有该参数，backend=codex 时此项无效。
  max_tokens: 81920
graph: {}
planning:
  # 初始试验值；实现后依据三个正式环境的有效率和候选质量调整。
  sample_count: 10000
  keep_top_count: 10
  # 自然采样后筛选整个链的长度，不在上限强制停止，不使用越界链兜底。
  min_chain_length: 12
  max_chain_length: 30
  termination_tau: 0.4
  length_reward_alpha: 1.0
  max_tool_visits: 2
  random_seed: 42
  # 初选 30 条生成核心目标，整批语义去重后全部送 Step 3；执行后最多保留 10 条。
  review_count: 30
  edge_sampling_probabilities:
    "1": 0.2
    "2": 0.3
    "3": 0.5
  diversity_lambda: 10
execution:
  max_concurrency: 4
  agent_max_tool_calls: 100
  retry_count: 3
  tool_result_max_bytes: 65536
  # 工具可能包含慢速扫描；仍由子进程提供可强制终止的硬上限。
  tool_timeout_seconds: 300
  # internal.code 属于上游产物而非本流水线审计过的代码；超时只约束时间，
  # 磁盘和内存上限用于挡住写满磁盘或耗尽内存的工具。
  tool_max_write_bytes: 268435456
  tool_max_memory_bytes: 2147483648
cost: {}
