[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-world-mini"
version = "0.1.0"
description = "A compact reproduction of the Agent-World environment construction pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["openai>=1.0"]

[project.scripts]
agent-world-mini = "agent_world_mini.run_pipeline:main"

[tool.setuptools.packages.find]
include = ["agent_world_mini*"]

[tool.setuptools.package-data]
agent_world_mini = ["seed_gen/*.json", "schemas/*.json", "schemas/*.md"]
