<text x="1307.00" y="362" font-family="Droid Sans Fallback" font-size="18" font-weight="normal" fill="#27343b">据真实结果生成参考答案</text>
<text x="1307.00" y="395" font-family="Droid Sans Fallback" font-size="18" font-weight="normal" fill="#27343b">按任务划定资源修改边界</text>
