ven without it, an identical scan fired while one is still running is auto-deduped."},"thinking_budget":{"enum":["fast","balanced","thorough"],"type":"string","default":"balanced","description":"Agent-side polling control. A full editorial workflow is structurally 15-20 tool calls (scan → poll → poll → poll → pick → poll → pick → poll → read). Use this to tune how many of those calls collapse into single waits.\n  • fast: scan blocks briefly (up to ~45s, under the tool-call timeout) for CP1 and returns the stories inline when they land in time. One call instead of N polls. Cheaper agent tokens, smaller cognitive surface. If CP1 isn't ready by the cap it still returns the session_id (status=discovering) — just poll niche_session_state from there; the run is never lost. Pick when you just want stories and the user is waiting.\n  • balanced (default): scan returns immediately with session_id; agent polls niche_session_state (with wait+since_status long-poll). Today's behavior.\n  • thorough: same as balanced. Reserved for future per-stage depth tuning when cost-per-run instrumentation has enough data to defend a deeper budget."},"target_platforms":{"type":"array","items":{"type":"string"},"description":"DEPRECATED — flat platform list, superseded by target_outputs. Legacy values (linkedin / linkedin_carousel / twitter / longform / instagram) still coerce automatically into target_outputs cells via the back-compat mapper. Prefer target_outputs for new callers."},"profile_overrides":{"type":"object","description":"Optional — deep-merge these overrides onto the persisted profile for this run only. Use case: same brand, different register for a specific piece (e.g. product-launch operator voice over editorial Sage). Requires brand_id."}}},"description_zh":"Niche (nicheangle.com) 故事发现：找到值得撰写的故事，然后起草并发布其中的平台原生社交内容（LinkedIn、X 线程、Instagram、时事通讯）。这是故事发现，而不是内容生成：Niche 读取主要来源，将信号从噪音中分离出来，并将其聚集到具有来源的排名故事板中 - 这是任何写作之前的编辑情报步骤。返回一个session_id + 初始状态；使用 session_id 轮询niche_session_state，直到状态为“cp1_awaiting_story”以读取石板。\n\n品牌配置文件：传递“brand_id”将此运行绑定到持久的品牌配置文件（通过niche_brand_profile_set设置）。配置文件的语音、词典、框架、通道配置和验证器会覆盖每个下游阶段的线程。将“profile_overrides”与“brand_id”一起传递，将一次性偏差深度合并到持久配置文件上（记录在会话中，而不是存储）。有效配置文件在扫描时进行快照 - 对持久配置文件的后续更新不会影响正在进行的运行。"},{"name":"niche_draft_direct","description":"Draft the creator's OWN take or product straight into posts — NO research scan, no story/angle picks. Use this for product-led / bring-your-own-content work: a specific thing to say ('new walnut dining table, live edge, $2,800') or a page to repurpose. The signal pipeline (niche_signal_scan) is for 'what's worth writing about my niche'; THIS is for 'write this exact thing.'\n\nProvide AT LEAST ONE OF: `take` (what to say) / `source_url` / `source_text` (the last two repurpose an existing page). Async: returns a session_id in \u003c2s; poll niche_session_state(wait:30, wait_until:'checkpoint') to cp3_awaiting_review/complete, then read outputs[]. Pass `brand_id` to bind the creator's voice + offer + CTA so the draft sounds like them and pitches their wares (set those first via niche_brand_profile_set).","inputSchema":{"type":"object","properties":{"take":{"type":"string","description":"What the post should say — the creator's own message/product. Required unless a source is given."},"image":{"type":"string","description":"Produce an image in the same run when the user wants one: 'photo' = generated AI image (paid ~30 cr/cell), 'card' = free brand card. Omit for text-only."},"brand_id":{"type":"string","description":"Bind this brand's voice + offer + CTA. Omit for the default brand."},"source_url":{"type":"string","description":"Optional page to repurpose — fetches and extracts the page's readable text. Use to turn an essay/landing page into platform posts."},"source_text":{"type":"string","description":"Optional pasted source text to repurpose (alternative to source_url)."},"source_title":{"type":"string","description":"Optional title for the pasted/fetched source."},"target_outputs":{"type":"array","items":{"type":"string"},"description":"Cells to draft, e.g. ['linkedin:text_post','x:thread','instagram:image_post']. Bare platforms (linkedin/x/instagram) coerce automatically. Defaults to ['linkedin']."}}},"description_zh":"将创作者自己的观点或产品直接起草到帖子中——无需研究扫描，无需选择故事/角度。将其用于以产品为主导/自带内容的工作：要说的具体内容（“新胡桃木餐桌，活边，2,800 美元”）或要重新调整用途的页面。信号管道（niche_signal_scan）用于“关于我的利基值得写什么”；这是“写出这个确切的东西”。\n\n至少提供以下一项：“take”（说什么）/“source_url”/“source_text”（最后两项重新利用现有页面）。异步：\u003c2s内返回session_id；轮询niche_session_state(wait:30, wait_until:'checkpoint') 到cp3_awaiting_review/complete，然后读取outputs[]。通过“brand_id”来绑定创建者的声音+报价+CTA，这样草稿听起来像他们并推销他们的商品（首先通过niche_brand_profile_set设置这些）。"},{"name":"niche_intelligence_query","description":"Niche (nicheangle.com) research and analysis: answer an ANALYST-shaped question over fresh-scanned sources and get an intelligence answer as the deliverable — not a single post. Use for: 'the 10 biggest developments in X this week', 'what's emerging before it goes mainstream', 'where is investment activity rising', 'find 3 non-obvious narratives to publish on LinkedIn'. The answer is the ranked slate PLUS engine-GROUNDED narratives or patterns: every narrative cites real slate stories and is fact-verified by a second pass (no source → no narrative). This uses the same engine as the Niche web app, so both surfaces return the identical grounded answer — do NOT synthesize your own narratives over the slate; present these.\n\nNON-BLOCKING: returns a `session_id` immediately (\u003c2s). Poll niche_session_state every ~3-5s. At status == cp1_awaiting_story the ranked slate (`stories[]`) is ready — present it right away. Synthesis fills in a few seconds AFTER the slate: if you requested it, keep polling while `synthesis_pending == true`; once false, `synthesis[]` holds the grounded narratives (or `synthesis_shortfall_note`). With synthesis:'none', `synthesis` stays null and `synthesis_pending` is false at cp1 — stop there. To turn a narrative into a post, pick its supporting story id and call niche_angle_propose — no new scan needed. Pass brand_id to thread a brand profile.","inputSchema":{"type":"object","properties":{"lens":{"enum":["mainstream","emerging","investment"],"type":"string","description":"Ranking posture. 'mainstream' (default) = authority-weighted. 'emerging' = INVERTS saturation to surface low-coverage, pre-mainstream signal. 'investment' = lifts stories carrying funding/raise/round/term-sheet markers."},"count":{"type":"integer","maximum":15,"minimum":3,"description":"How many developments / narratives to return (3-15). Default ~5-10."},"window":{"type":"string","description":"Recency window: '24h' | 'week' | 'month' | 'quarter' | 'year'. 'this week' → 'week'. Overrides the niche's default recency. A strong bias by default; pair with recency_strict for a hard cutoff."},"subject":{"type":"string","maxLength":200,"minLength":2,"description":"The subject/space to investigate (2-200 chars). Specific is better."},"brand_id":{"type":"string","description":"Optional brand profile to bind (set via niche_brand_profile_set)."},"platform":{"type":"string","description":"Optional publish target (linkedin / x / instagram) — shapes each narrative's publish_hook."},"synthesis":{"enum":["none","narratives","patterns"],"type":"string","description":"'narratives' = N non-obvious publishable threads across the slate. 'patterns' = the named movement (pairs with lens:'investment'). 'none' (default) = ranked slate only, no synthesis."},"recency_strict":{"type":"boolean","description":"When true, `window` is a HARD cutoff (out-of-window sources dropped before clustering) so 'nothing older than yesterday' is exact. Default false (bias only). Strict returns fewer, higher-confidence stories; use when precision matters more than breadth."},"source_quality":{"enum":["strict","balanced","broad"],"type":"string","default":"balanced","description":"Source-quality filter (niche-relative). 'strict' drops uncorroborated single-source silos that aren't primary/official or a niche authority — high-trust answers only. 'balanced' (default) down-weights weak sources without dropping. 'broad' surfaces everything (incl. low-coverage emerging clusters), authority as a tiebreaker only."},"target_outputs":{"type":"array","items":{"type":"string"},"description":"Optional — the draft cells produced IF you later draft a narrative into content (same cell list as niche_signal_scan, e.g. ['linkedin:image_post', 'x:thread']). WITHOUT this, a draft defaults to a single 'long_form_article'. Set it when you know the surfaces you want, so niche_draft_create yields them directly instead of needing niche_add_output after."},"idempotency_key":{"type":"string","description":"Optional. Stable key so a retry reuses the original run instead of billing a second; an identical query fired while one is still running is auto-deduped regardless."}}},"description_zh":"利基 (nicheangle.com) 研究和分析：通过新扫描的资源回答分析师提出的问题，并获得情报答案作为可交付成果 - 而不是单个帖子。用于：“本周 X 领域的 10 个最大发展”、“在成为主流之前正在出现什么”、“投资活动在哪里上升”、“找到 3 个不明显的叙述在 LinkedIn 上发布”。答案是排名板岩加上引擎扎根的叙述或模式：每个叙述都引用真实的板岩故事，并通过第二遍进行事实验证（无来源→无叙述）。它使用与 Niche Web 应用程序相同的引擎，因此两个表面都会返回相同的接地答案 - 不要在石板上综合您自己的叙述；呈现这些。\n\n非阻塞：立即返回“session_id”（\u003c2s）。每 3-5 秒轮询一次niche_session_state。在 status == cp1_awaiting_story 时，排名板岩 (`stories[]`) 已准备就绪 - 立即呈现。合成在石板后几秒钟填充：如果您请求它，请在“synthesis_pending == true”时继续轮询；一旦为假，“synthesis[]”就会保留有根据的叙述（或“synthesis_shortfall_note”）。使用 Synthesis:'none' 时，`synthesis` 保持为 null，并且 `synthesis_pending` 在 cp1 处为 false — 到此为止。要将叙述变成帖子，请选择其支持故事 ID 并调用niche_angle_propose——无需新扫描。传递brand_id以线程化品牌配置文件。"},{"name":"niche_session_state","description":"Universal poll endpoint — read the FULL current state of a session. Returns status, ranked stories, picked story_id, generated angles, picked angle_id, draft outputs (with trust fields), and an elicitation hint for whatever decision is next. Call this whenever you need to check progress; it's safe and cheap.\n\nEach story includes title, summary, headline_candidate (the post-shaped headline distinct from the cluster title), recency_score, relevance_score, freshness_label, and the publication_breakdown of contributing outlets (provenance). Each story also carries a recommended_story_id + recommendation_reason before a pick. Each draft output's trust data lives under `outputs[i].trust.*` (verifier_blocked_reason, source_faithfulness_score, source_ungrounded_claims, source_diversity_passed, source_recency_passed, source_distinct_count, plus a flags[] array with explicit severity + source_grounding_map). The output top level does NOT mirror these — read them from `.trust`.\n\nResponse also includes `phase` (high-level: scanning / drafting / filed / spiked / awaiting), `phase_message` (rotating gerund — Reading 337 signals…), `phase_hint` (one-line agent-facing tooltip with a typical timing band — Clustering — usually 8-15s, no action needed). The full 17-status state machine is enumerated under `status_glossary` so you can introspect what every state means without discovering it experimentally. For a TERMINAL run, read `outcome` (complete / expired / interrupted / cancelled / failed) rather than the raw `status` — a `failed` status is usually an expired walk-away (a slate was produced) or a refunded interruption, not a real error.\n\nBEST LOOP (do this): kick off work, then ONE niche_session_state(wait:30, wait_until:'checkpoint') per stage — it sleeps through the noisy transient statuses (clustering, ranking, generating_*) and wakes ONLY at the next actionable stop (cpN_awaiting_* / complete / failed), or when an async render settles. So a full run is one wait per checkpoint, not 2-3 wakes per stage. (`wait_for` is an accepted alias for `wait_until`.) The older `wait` + `since_status` long-poll (wait_until:'change', wakes on ANY status change) still works for back-compat, but prefer 'checkpoint'. Each status' `actionable` flag in `status_glossary[]` tells you which states a 'checkpoint' wait wakes for. Do NOT poll every few seconds without `wait` — that's what trips a 429.\n\nAlias: niche_story_search (legacy name, supported for back-compat — the new name reflects the actual job).\n\nResponse shape is sparse by default: after a story is picked, only the picked story is returned (not all candidates); same for angles. Set include_unpicked=true to get the full candidate set — useful when revising to a different story or angle. A `sparse_mode` field in the response reports how many items were dropped.","inputSchema":{"type":"object","properties":{"view":{"enum":["status","full"],"type":"string","default":"full","description":"`status` (lean): a few-hundred-byte control envelope — status, phase, picked ids, `content_versions` (per-section change counters), `counts`, `output_ids`, cost, next_step. Use this for the poll LOOP. `full` (default): the complete state with stories/angles/outputs. Fetch `full` once when a content_version moves, vs re-shipping the haystack every poll. Pairs with wait + since_status."},"wait":{"type":"integer","default":0,"maximum":30,"minimum":0,"description":"Long-poll for up to N seconds (0-30) waiting for the session state to change. Returns immediately if the state already differs from `since_status` (or if the session is awaiting a checkpoint / complete / failed). Drops agent token burn from N polls to 1 wait. Default 0 (no wait, behave as before)."},"wait_for":{"enum":["change","checkpoint","render","synthesis"],"type":"string","description":"Alias for `wait_until` (same values + semantics). Use either; if both are set, `wait_until` wins. An unrecognized value is REJECTED (not silently ignored), and it only takes effect with `wait` \u003e 0."},"session_id":{"type":"string","description":"session_id from niche_signal_scan."},"wait_until":{"enum":["change","checkpoint","render","synthesis"],"type":"string","default":"change","description":"What the `wait` long-poll resolves on. `change` (default): any status change vs since_status, a reached checkpoint, OR a status-less change (synthesis fill / render completion / new output). `checkpoint`: ONLY an actionable checkpoint (cpN_awaiting_* / complete / failed) — skips the noisy intermediate cpN_generating → generating_* transitions, so you get one wake per checkpoint. `render`: a reel/image render marker settles (done|failed) — use this after niche_render_reel / niche_render_image_card, since a render leaves status unchanged and won't wake a `change` wait on status alone. Works on a session ALREADY at complete (the normal case; renders are post-completion add-ons) — the wait holds on the render marker, not the session status. `synthesis`: a niche_intelligence_query's synthesis lands (narratives OR a shortfall_note) — synthesis filling is not a status change, so block on THIS in one call instead of busy-polling."},"since_status":{"type":"string","description":"Used with `wait` (wait_until='change'). The status the caller last saw — the wait returns as soon as session.status differs. If unset, any state-change event wakes the wait. NOTE the pipeline has paired vocab: a transient `cpN_generating` (checkpoint about to produce) and a `generating_*` work status (e.g. cp2_generating → generating_angles). To skip both and wake only at the next actionable stop, use wait_until='checkpoint' rather than chasing since_status through the intermediates."},"include_unpicked":{"type":"boolean","default":false,"description":"When true, return the full candidate set even after picks have been made. Default false (sparse — only the picked story / angle come back). Only meaningful with view='full'; ignored in view='status' (the lean envelope never carries the candidate slate)."},"include_status_glossary":{"type":"boolean","default":false,"description":"When true, response includes `status_glossary[]` — the full 17-status state-machine descriptor list with phase + hint + `actionable` (whether a wait_until='checkpoint' wakes for it) per status. Useful on the first call of an agent session so the agent caches the full map; leave false on subsequent polls. Default false."}}},"description_zh":"通用轮询端点 — 读取会话的完整当前状态。返回状态、排名故事、选择的 Story_id、生成的角度、选择的angle_id、草稿输出（带有信任字段）以及下一步决策的启发提示。每当您需要检查进度时调用此函数；它既安全又便宜。\n\n每个故事都包含标题、摘要、headline_candidate（与集群标题不同的后形标题）、recency_score、relevance_score、freshness_label 和贡献渠道的 Publication_breakdown（出处）。每个故事在选择之前还带有Recommended_story_id +Recommendation_reason。每个草稿输出的信任数据都位于“outputs[i].trust.*”下（verifier_blocked_reason、source_faithativity_score、source_ungrounded_claims、source_diversity_passed、source_recency_passed、source_distinct_count，加上具有显式严重性的 flags[] 数组 + source_grounding_map）。输出顶层并不反映这些——从“.trust”读取它们。\n\n响应还包括“phase”（高级：扫描/起草/归档/尖峰/等待）、“phase_message”（旋转动名词 - 读取 337 个信号……）、“phase_hint”（面向代理的单行工具提示，具有典型的计时带 - 集群 - 通常为 8-15 秒，无需执行任何操作）。完整的 17 状态状态机在“status_glossary”下枚举，因此您可以内省每个状态的含义，而无需通过实验发现它。对于终端运行，读取“结果”（完成/过期/中断/取消/失败）而不是原始“状态”——“失败”状态通常是过期的离开（生成了一个石板）或退款的中断，而不是真正的错误。\n\n最佳循环（执行此操作）：开始工作，然后每个阶段有一个niche_session_state(wait:30, wait_until:'checkpoint') - 它会在嘈杂的瞬态状态（集群、排名、生成_*）中休眠，并仅在下一个可操作停止时（cpN_awaiting_* /完成/失败）或异步渲染稳定时唤醒。因此，完整运行是每个检查点一次等待，而不是每个阶段 2-3 次唤醒。 （`wait_for` 是 `wait_until` 的可接受的别名。）旧的 `wait` + `since_status` 长轮询（wait_until：'change'，在任何状态更改时唤醒）仍然适用于向后兼容，但更喜欢'检查点'。 “status_glossary[]”中的每个状态“可操作”标志告诉您哪个状态“检查点”等待被唤醒。不要在没有“wait”的情况下每隔几秒轮询一次——这就是 429 错误的原因。\n\n别名：niche_story_search（旧名称，支持向后兼容 - 新名称反映实际工作）。\n\n默认情况下，响应形状是稀疏的：选择故事后，仅返回选择的故事（不是所有候选故事）；角度也一样。设置 include_unpicked=true 以获得完整的候选集——在修改到不同的故事或角度时很有用。响应中的“sparse_mode”字段报告有多少项目被丢弃。"},{"name":"niche_angle_propose","description":"Niche content angles: pick a story from the discovery slate and surface the strongest angles worth publishing — the editorial-judgment step that turns a development into a piece. Returns five angles[], each with frame, hook, tension, cta_direction, and cta_variants (swap palette). niche_session_state then carries an angle_recommendation (recommended_angle_id + reasoning); when a brand profile is bound it is brand-fit-scored, otherwise recommended_angle_id is null with recommendation_basis='default_ordering' (no fake pick). Returns immediately with status=cp2_generating; poll niche_session_state until angles[] is populated.\n\nCUSTOM FRAMING (provenance-preserving): to draft YOUR OWN angle on this researched story — not one of the proposed five — pass `custom_framing` (after the story is locked + angles are ready). The framing is shaped onto the REAL story and drafted on THIS session, so the trust block keeps the story's actual sources. Use this instead of niche_draft_direct when you have a researched story in hand — draft_direct seeds a synthetic 1-source session and drops the provenance.","inputSchema":{"type":"object","properties":{"story_id":{"type":"string","description":"id from niche_session_state.stories[].id"},"session_id":{"type":"string"},"custom_framing":{"type":"string","description":"Optional. Your own angle in a sentence ('the contrarian take: X is overhyped because Y'). When set, drafts THAT angle on the real story (provenance preserved) instead of returning the proposed five. Requires the story locked + angles ready (cp2_awaiting_angle)."}}},"description_zh":"利基内容角度：从发现的石板中挑选一个故事，并提出最值得发表的最强角度——将发展转化为作品的编辑判断步骤。返回五个角度[]，每个角度都有框架、钩子、张力、cta_direction 和 cta_variants（交换调色板）。 niche_session_state然后携带一个angle_recommendation（recommished_angle_id+reasoning）；当品牌简介被绑定时，它是品牌适合度评分的，否则recommended_angle_id为空，并且recommendation_basis ='default_ordering'（没有假选择）。立即返回，status=cp2_generateing；轮询niche_session_state，直到填充angles[]。\n\n自定义框架（保留出处）：针对这个研究的故事起草您自己的角度（不是提议的五个角度之一），通过“custom_framing”（故事锁定+角度准备好后）。该框架是根据真实故事塑造的，并在本次会议上起草，因此信任块保留了故事的实际来源。当您手头有一个研究过的故事时，请使用它来代替niche_draft_direct——draft_direct 播种一个合成的单源会话并删除出处。"},{"name":"niche_draft_create","description":"Niche draft content: lock the chosen angle and turn it into platform-native social drafts — LinkedIn post, X thread, Instagram, newsletter/long-form — ready to review and publish (the downstream payoff once the story + angle are decided). Returns immediately with status=cp3_generating; poll niche_session_state until outputs[] is populated. Each output carries its trust data NESTED under `outputs[i].trust` — `source_faithfulness_score`, `source_ungrounded_claims[]`, `source_diversity_passed`, `source_recency_passed`, `overall_severity`, a severity-tagged `flags[]`, and `verifier_blocked_reason`/`verifier_blocked_claim` when a fabrication was refused. (No top-level `verifier_audit` field — read `outputs[i].trust`.)","inputSchema":{"type":"object","properties":{"angle_id":{"type":"string","description":"id from niche_angle_propose.angles[].id"},"session_id":{"type":"string"}}},"description_zh":"利基草稿内容：锁定所选角度并将其转化为平台原生社交草稿 - LinkedIn 帖子、X 线程、Instagram、时事通讯/长格式 - 准备审查和发布（一旦故事 + 角度确定，下游回报）。立即返回，status=cp3_generateing；轮询niche_session_state，直到outputs[]被填充。每个输出都在“outputs[i].trust”下携带嵌套的信任数据——“source_faithativity_score”、“source_ungrounded_claims[]”、“source_diversity_passed”、“source_recency_passed”、“overall_severity”、带有严重性标记的“flags[]”和“verifier_blocked_reason”/“verifier_blocked_claim”（当伪造被拒绝时）。 （没有顶级“verifier_audit”字段 - 读取“outputs[i].trust”。）"},{"name":"niche_draft_revise","description":"YOU write the new caption/fields and pass them in — this does NOT rewrite from an instruction (unlike a chat 'make it punchier'). To change the copy, supply the new copy as `caption`. Applies the values you pass to a specific output. Accepts any subset of the output's fields — caption, hashtags, or partial script updates (hook / body / cta / hook_tweet / body_tweets / title / subtitle / pull_quote / cover_slide / slides / cta_slide / alt_text). Pass `apply_hook_variant_index` to splice an existing hook_variants[N] into the live hook in one move without rewriting the rest. If you pass no editable field (or values identical to the current draft) it changes nothing and returns `status:'no_change'` naming the params that edit content. Angle / story changes still go back through niche_angle_propose — they invalidate the verifier trust block and need fresh generation.\n\nResponse includes a `diff[]` array listing every field that changed (`{field, before, after}`) so agents can show users the delta rather than the full new payload.","inputSchema":{"type":"object","properties":{"caption":{"type":"string","description":"Replace the full caption (legacy field; same effect as setting `script.body` for LinkedIn, `script.caption` for Instagram)."},"hashtags":{"type":"array","items":{"type":"string"},"description":"Replace the hashtag list. Sanitized server-side (whitespace stripped, non-alphanumerics removed, case-insensitive dedup)."},"output_id":{"type":"string"},"slide_patches":{"type":"array","items":{"type":"object","required":["index"],"properties":{"body":{"type":"string"},"index":{"type":"integer","minimum":0},"headline":{"type":"string"}}},"description":"linkedin_carousel only — patch individual slides by index without resending the whole slides[] array. Each entry: {index, headline?, body?}. Out-of-bounds index errors; passing slide_patches on a non-carousel output errors."},"script_updates":{"type":"object","description":"Partial updates to the output.script JSON. Shallow-merged — keys present here REPLACE the matching fields, keys absent are preserved. Available fields depend on platform: linkedin {hook, body, cta, structure}; twitter {hook_tweet, body_tweets[], landing_tweet, single_tweet}; longform {title, subtitle, body, pull_quote}; instagram {hook, caption, alt_text}; linkedin_carousel {cover_slide, slides[], cta_slide}."},"apply_hook_variant_index":{"type":"integer","minimum":0,"description":"Splice an existing hook_variants[N] into the live hook. 0-indexed. Cheaper than rewriting the caption by hand. Errors if the index is out of bounds."}}},"description_zh":"您编写新的标题/字段并将其传入 - 这不会根据指令进行重写（与聊天“使其更加有力”不同）。要更改副本，请提供新副本作为“caption”。将您传递的值应用于特定输出。接受输出字段的任何子集 - 标题、主题标签或部分脚本更新（hook / body / cta / hook_tweet / body_tweets / title / subtitle / pull_quote / cover_slide / sliders / cta_slide / alt_text）。传递 `apply_hook_variant_index` 将现有的 hook_variants[N] 一次性拼接到实时钩子中，而无需重写其余部分。如果您传递没有可编辑字段（或与当前草稿相同的值），则不会更改任何内容并返回“status:'no_change'”，命名编辑内容的参数。角度/故事的变化仍然通过niche_angle_propose返回——它们使验证者信任块失效并需要新的生成。\n\n响应包括一个“diff[]”数组，列出了每个已更改的字段（“{field, before, after}”），因此代理可以向用户显示增量而不是完整的新有效负载。"},{"name":"niche_draft_publish","description":"Publish a single output to its platform. Defaults to dry_run=true — returns the would-publish payload + any verifier blocks WITHOUT actually filing. Set dry_run=false AND provide an idempotency_key to commit. The commit is the ONLY irreversible action in the workflow; the agent should present the dry-run preview to the human and only commit on explicit go-ahead. Verifier-blocked outputs refuse to publish even with dry_run=false; clear the block on the row first. When the target social isn't linked, returns status='not_connected' + a `connect_url` instead of publishing — send the user to connect once, then retry.","inputSchema":{"type":"object","properties":{"dry_run":{"type":"boolean","default":true},"platform":{"type":"string","description":"Accepts either:\n  • cell string — the platform×content_type the run produced (linkedin:text_post, linkedin:image_post, linkedin:carousel, x:single_tweet, x:thread, x:image_post, instagram:image_post, instagram:carousel) — preferred for new code\n  • legacy family name — linkedin, linkedin_carousel, twitter, instagram — coerces to the registered default cell for that family (e.g. linkedin → linkedin:text_post)\nReels (linkedin:reel / x:reel / instagram:reel) and long_form_article have no in-app publish path today — reels get a download URL, long-form ships as Markdown for paste-to-Substack."},"session_id":{"type":"string"},"idempotency_key":{"type":"string","description":"Required when dry_run=false. Same key returns the prior result without re-publishing."},"acknowledge_surfaced":{"type":"boolean","default":false,"description":"Required true to commit when the dry-run surfaced claims/flags worth a human look (the dry-run's next_step names them). Affirms the agent showed the human the surfaced items and got go-ahead. Ignored when nothing was surfaced. Default false."}}},"description_zh":"将单个输出发布到其平台。默认为 dry_run=true — 返回将要发布的有效负载 + 任何未实际归档的验证程序块。设置 dry_run=false 并提供要提交的 idempotency_key。提交是工作流程中唯一不可逆的操作；代理应该向人类展示试运行预览，并且只承诺明确的继续。即使 dry_run=false，验证者阻止的输出也拒绝发布；首先清除该行上的块。当目标社交未链接时，返回 status='not_connected' + a `connect_url` 而不是发布 - 发送用户连接一次，然后重试。"},{"name":"niche_brand_profile_set","description":"Set (or update) the persisted brand profile for a brand the user manages. The profile is a structured JSON document that's load-bearing across every pipeline stage — voice rules, banned terms, canonical vocabulary, framing allowlist, channel config, compliance disclosures, verifier overrides.\n\nUse this when:\n- The agent has derived a brand profile from a repo / docs and   wants to persist it so future runs inherit the rules.\n- An update to voice rules / banned terms needs to land before the   next run.\n\nREQUIRED sections: `identity` and `voice` (a profile with no voice is rejected — it's what drives the generic-fallback drafts). A profile saved before this requirement is grandfathered: a re-set that omits voice gets a default voice stub auto-added rather than rejected, so legacy profiles aren't stranded.\n\nValidation: tiered lints (error / warn / info). `error` lints REFUSE the set entirely. `warn` lints accept-with-note. The response always includes `lints[]` so the caller sees ambient warnings. `conflicts[]` surfaces BrandKit-locked field collisions — the BrandKit wins on those paths and the profile values are dropped from storage.\n\nv1 ships persisted scope only; session and inline_overrides scopes are per-call constructs (passed alongside other tool arguments). brand_id is unique-per-user — re-setting the same brand_id replaces the prior profile.","inputSchema":{"type":"object","properties":{"profile":{"type":"object","description":"The brand profile JSON. Schema sections (each drives a pipeline stage): identity (who the brand is), audience (who it's for), voice (register/rhythm/lexicon rules the copy obeys), lexicon (canonical_terms + banned_terms the verifier enforces), framing (frame slugs from Niche's editorial taxonomy; pass `allowed` and/or `blocked` as lists of slugs. The set is closed — an unrecognized frame REJECTS the set and the error returns the valid slugs, so nothing is silently dropped), structure (default article shapes), offers (what the creator SELLS — {product, what_it_is, proof_point?, cta, link}; lands signal-led posts on the offer), verifier_overrides (truthfulness thresholds), channels (per-platform config), source_quality (trusted/blocked domains), compliance (required disclosures), metadata. Fill the load-bearing ones (identity / voice / lexicon / framing / verifier_overrides) for a strong v1; the rest are optional. A malformed set returns a `template` of the full schema with inline field docs in the error response — no separate discovery call needed."},"brand_id":{"type":"string","maxLength":64,"minLength":1,"description":"Unique-per-user identifier for this brand (e.g. 'acme', 'acme-blog'). Stored as a string; lowercase / kebab-case recommended."},"schema_version":{"type":"string","default":"1.0","description":"Profile schema version. Defaults to '1.0'."}}},"description_zh":"设置（或更新）用户管理的品牌的持久品牌配置文件。该配置文件是一个结构化的 JSON 文档，可承载每个管道阶段 — 语音规则、禁止术语、规范词汇、框架允许列表、通道配置、合规性披露、验证者覆盖。\n\n在以下情况下使用此功能：\n- 代理从存储库/文档中获取了品牌简介，并希望保留它，以便将来的运行继承规则。\n- 语音规则/禁止术语的更新需要在下一次运行之前落地。\n\n必需部分：“身份”和“声音”（没有声音的配置文件将被拒绝 - 这是驱动通用后备草案的原因）。在此要求之前保存的配置文件将不受限制：省略语音的重新设置会自动添加而不是拒绝默认语音存根，因此旧配置文件不会陷入困境。\n\n验证：分层 lint（错误/警告/信息）。 `error` lints 完全拒绝该集合。 `warn` lints Accept-with-note。响应始终包含“lints[]”，以便调用者看到环境警告。 `conflicts[]` 表面 BrandKit 锁定的字段冲突 — BrandKit 在这些路径上获胜，并且配置文件值将从存储中删除。\n\nv1 仅提供持久范围； session 和 inline_overrides 范围是每次调用构造（与其他工具参数一起传递）。每个用户的brand_id都是唯一的——重新设置相同的brand_id会替换之前的配置文件。"},{"name":"niche_list_sessions","description":"Enumerate the user's recent sessions. Returns id, niche_input, status, `outcome`, target_platforms, picked story/angle ids, and created/updated_at for each. Use this when the session_id has been lost (across agent invocations, hours of work, etc.) or to find an in-flight session to resume. Returns newest-first.\n\nJudge a terminal run by `outcome`, NOT raw `status`: a `failed` status is usually a walk-away, not an error. outcome ∈ {complete, expired (a slate was produced but nobody picked — re-open + choose), interrupted (a restart ended it; credits refunded — just re-run), cancelled (stopped on purpose), failed (a real error — see error_message), running}. (`status_filter` still matches the raw status value.)","inputSchema":{"type":"object","properties":{"limit":{"type":"integer","default":25,"maximum":100,"minimum":1,"description":"Max sessions to return (default 25, max 100)."},"status_filter":{"type":"string","description":"Optional status filter — e.g. 'cp1_awaiting_story', 'cp3_awaiting_review', 'complete', 'failed'. Omit for all."}}},"description_zh":"枚举用户最近的会话。返回 id、niche_input、status、`outcome`、target_platforms、选择的故事/角度 ID 以及每个的创建/更新位置。当 session_id 丢失（跨代理调用、工作时间等）或查找正在进行的会话以恢复时，请使用此选项。返回最新的优先。\n\n通过“结果”而不是原始的“状态”来判断终端运行：“失败”状态通常是一种离开状态，而不是错误。结果 ∈ {完成，过期（生成了一个石板，但没有人选择 - 重新打开 + 选择），中断（重新启动结束了它；积分退款 - 只是重新运行），取消（故意停止），失败（真正的错误 - 参见 error_message），运行}。 （“status_filter”仍然与原始状态值匹配。）"},{"name":"niche_brand_kit_ingest","description":"Auto-populate the user's BrandKit (palette / fonts / tagline / logo / wordmark / boilerplate / voice notes) from files OR a URL OR pasted text. By default ADDITIVE — fills empty fields, leaves populated ones alone. Idempotent: re-running the same inputs doesn't double-write.\n\nOVERWRITE RULE (important): if the target brand kit ALREADY has an identity (a tagline/boilerplate/voice for a DIFFERENT brand), do NOT silently overwrite it. First ASK the user whether to replace it. If the account supports multiple brand profiles, prefer creating a SEPARATE brand instead — pass a new `brand_id` slug + `brand_name` rather than clobbering the existing one. Only pass `replace=true` once the user has confirmed they want this brand re-learned from the new source.\n\nUse when the agent has brand assets in scope (a working directory with logos / press-kit / brand-guide PDFs, the user's portfolio or Substack URL, pasted boilerplate copy) and wants to populate Niche's BrandKit so future signal_scan + content_generation stages inherit the brand context. Agent-side equivalent of the web /brand-kit ingest surface — same backend engine.\n\nASYNC + POLL — a URL or multi-file ingest runs in the background, so this call returns FAST with {ingest_id, status:'ingesting'}. Then poll niche_brand_kit_ingest_status(ingest_id) until status is 'done' — that response carries the populated BrandKit, the ingest report (detected[] / skipped[] / errors[]), and a diff[] of changed fields. (Loop: ingest → poll status until done/failed; same pattern as niche_signal_scan → niche_session_state.) Do NOT re-call ingest while one is running — a duplicate of the same inputs attaches to the in-flight job. URL ingest also fills voice primitives when the page has post-shaped text (Substack/blog/X). If a URL is slow or thin to scrape, the visual fields may land before the voice pass completes; when the report flags this, paste the page's About/homepage copy via `text=` to complete the brand voice.","inputSchema":{"type":"object","properties":{"text":{"type":"string","description":"Optional URL (homepage, Substack, portfolio, LinkedIn) OR a paste of brand text (tagline + boilerplate + voice notes). URL takes precedence when both look URL-shaped."},"files":{"type":"array","items":{"type":"object","required":["name","mime_type","data_base64"],"properties":{"name":{"type":"string"},"mime_type":{"type":"string"},"data_base64":{"type":"string"}}},"description":"Files to ingest (logos, brand-guide PDFs, screenshots, color swatches, headshots). Each entry: {name, mime_type, data_base64}. The engine classifies each via vision and routes to logo/wordmark/headshot/brand-guide/color-swatch slots."},"replace":{"type":"boolean","description":"Default false (additive — fill empty fields only). Set true ONLY after the user confirms they want an already-populated brand RE-LEARNED from this source; it overwrites the detected identity fields. Never set true to silently clobber a different brand's kit — create a new brand_id instead."},"brand_id":{"type":"string","description":"Which brand slot to ingest into. OMIT for the default brand. Pass a slug (e.g. 'acme') to target/create a SEPARATE brand kit — do this when the default kit already belongs to another brand, so you don't merge two brands into one. If the account isn't entitled to additional brands, the call returns a clear error explaining what's needed."},"brand_name":{"type":"string","description":"Optional display name when creating a new brand_id slot (e.g. 'Acme Co')."}}},"description_zh":"从文件或 URL 或粘贴的文本自动填充用户的 BrandKit（调色板/字体/标语/徽标/字标/样板/语音注释）。默认情况下 ADDITIVE — 填充空字段，保留已填充的字段。幂等：重新运行相同的输入不会重复写入。\n\n覆盖规则（重要）：如果目标品牌套件已经有一个标识（不同品牌的标语/样板/声音），请不要默默地覆盖它。首先询问用户是否更换。如果帐户支持多个品牌配置文件，则更愿意创建一个单独的品牌 - 传递新的“brand_id”slug +“brand_name”，而不是破坏现有的品牌。仅当用户确认他们希望从新来源重新学习该品牌时才传递“replace=true”。\n\n当代理在范围内拥有品牌资产（包含徽标/新闻套件/品牌指南 PDF、用户的投资组合或 Substack URL、粘贴的样板副本的工作目录）并希望填充 Niche 的 BrandKit 以便未来的 signal_scan + content_ Generation 阶段继承品牌上下文时使用。代理端相当于网络/品牌套件摄取表面——相同的后端引擎。\n\nASYNC + POLL — URL 或多文件摄取在后台运行，因此此调用会快速返回 {ingest_id, status:'ingesting'}。然后轮询niche_brand_kit_ingest_status(ingest_id)，直到状态为“完成”——该响应携带填充的BrandKit、摄取报告（检测到的[] /跳过的[] /错误[]）以及更改字段的差异[]。 （循环：摄取→轮询状态，直到完成/失败；与niche_signal_scan→niche_session_state相同的模式。）不要在运行时重新调用摄取——相同输入的副本会附加到正在进行的作业。当页面具有帖子形状文本 (Substack/blog/X) 时，URL 摄取也会填充语音原语。如果 URL 的抓取速度很慢或很薄弱，则视野可能会在语音传递完成之前就着陆；当报告标记此情况时，通过“text=”粘贴页面的“关于/主页”副本以完成品牌声音。"},{"name":"niche_brand_kit_ingest_status","description":"Poll the result of an async niche_brand_kit_ingest. Pass the `ingest_id` it returned. status: 'ingesting' (keep polling) | 'done' (response carries the full kit + detected[]/skipped[]/errors[]/diff[]/left_unchanged_because_populated[]) | 'failed' (error + failed_step; the kit was NOT written). The marker expires 30 min after the ingest starts.","inputSchema":{"type":"object","properties":{"ingest_id":{"type":"string","description":"The ingest_id returned by niche_brand_kit_ingest."}}},"description_zh":"轮询异步niche_brand_kit_ingest的结果。传递它返回的“ingest_id”。状态：“正在摄取”（继续轮询）| '完成'（响应携带完整套件+检测到的[]/跳过的[]/错误[]/差异[]/left_unchanged_because_populated[]）| “失败”（错误 + failed_step；套件未编写）。标记在摄取开始 30 分钟后过期。"},{"name":"niche_voice_profile_ingest","description":"Extract voice primitives (register / sentence rhythm / lexicon preferences / punctuation habits) from post-shaped text and persist onto the user's VoiceProfile. The voice primitives thread into content_generation prompts so generated copy matches the user's actual writing voice.\n\nTwo input shapes: pass `posts` (list of pre-collected text snippets, ≥80 chars each) or pass `url` (we scrape post-shaped snippets from the page — Substack / Medium / blog / X profile). Inline posts win when both are given. Inline post-shaped snippets need to be the user's OWN writing — not press articles or marketing copy.\n\nReturns the extracted primitives + a diff of what changed on the stored VoiceProfile.","inputSchema":{"type":"object","properties":{"url":{"type":"string","description":"URL to scrape post-shaped text from. Substack / Medium / blog homepages work best; X / LinkedIn profile pages supported but yield less per-snippet text."},"posts":{"type":"array","items":{"type":"string"},"description":"Post-shaped text snippets the user wrote. ≥80 chars each; 3-10 snippets is the sweet spot for primitives extraction."},"brand_id":{"type":"string","description":"Which brand's voice to ingest into. Voice is brand-scoped: omit for the default brand, or pass a brand_id (from niche_brand_profile_get) to set up THAT brand's voice without touching another brand's. A brand with no voice of its own falls back to the default voice at generation time."},"archetype":{"type":"string","default":"agent_ingest","description":"Optional label for how the profile was acquired — tags the VoiceProfile.archetype field. Defaults to 'agent_ingest'."},"overwrite":{"type":"boolean","default":false,"description":"Whether to replace an existing VoiceProfile. Default false — first run wins, subsequent runs are no-ops unless explicitly opted in, so an automated re-run does not overwrite a hand-curated voice."}}},"description_zh":"从后形文本中提取语音原语（语域/句子节奏/词汇偏好/标点符号习惯）并保留到用户的 VoiceProfile 中。语音原语穿入 content_ Generation 提示中，因此生成的副本与用户的实际书写语音相匹配。\n\n两种输入形状：传递“posts”（预先收集的文本片段列表，每个≥80个字符）或传递“url”（我们从页面中抓取帖子形状的片段 - Substack / Medium / blog / X profile）。当两者都给出时，内嵌帖子获胜。内联帖子形状的片段必须是用户自己的写作，而不是新闻文章或营销文案。\n\n返回提取的原语+存储的 VoiceProfile 上更改内容的差异。"},{"name":"niche_brand_profile_get","description":"Read-back tool: verify what's actually persisted for a brand profile WITHOUT re-setting it. Use after niche_brand_profile_set to confirm the schema landed as expected; use mid-session to double-check the active profile a run is bound to; use before niche_brand_profile_set when an agent is about to write a partial update and wants to inspect the current shape first.\n\nPass `brand_id` to read one profile; omit it to list all (brand_id, updated_at) summaries. Returns the full profile JSON + schema_version + created/updated timestamps + a brand_kit_sync_status hint reflecting whether the profile's mirrored fields are in lock-step with BrandKit.\n\nLets an agent introspect the active profile shape instead of inferring it from prior set calls.","inputSchema":{"type":"object","properties":{"brand_id":{"type":"string","description":"Brand identifier to read. Omit to list all."},"include_test":{"type":"boolean","description":"When listing (no brand_id), include internal test/QA brand slots. Default false — they are hidden so the listing shows only real brands."}}},"description_zh":"回读工具：验证品牌档案实际保留的内容，而无需重新设置。在niche_brand_profile_set之后使用来确认模式按预期落地；使用中间会话来仔细检查运行绑定到的活动配置文件；当代理即将编写部分更新并希望首先检查当前形状时，请在niche_brand_profile_set之前使用。\n\n通过 `brand_id` 读取一份个人资料；省略它以列出所有（brand_id，updated_at）摘要。返回完整的配置文件 JSON + schema_version + 创建/更新的时间戳 + Brand_kit_sync_status 提示，反映配置文件的镜像字段是否与 BrandKit 同步。\n\n让代理内省活动的配置文件形状，而不是从之前的设置呼叫中推断出来。"},{"name":"niche_brand_kit_guided_setup","description":"Return a structured question chain the agent walks the user through to populate the BrandKit + VoiceProfile + (optionally) BrandProfile. Each entry carries an `intent` describing what the answer is FOR (so the agent paraphrases in its own voice based on the conversation it's already having) plus a `prompt_hint` fallback for agents that relay tools verbatim.\n\nUse this when the agent is helping a new user set up Niche and wants a predictable, brand-aware Q\u0026A sequence instead of improvising. Tiered by impact:\n  - Tier 0 (primary): URL ingest — fills 70-90% in one ask.\n  - Tier 1 (gap_fill): only the fields URL ingest didn't fill.\n  - Tier 2 (discipline): opt-in guardrails (topics off, banned     terms, competitor stance).\n  - Tier 3 (no_url): full fallback for users without a site.\n\nPer-question `applies_to_field` tells the agent where the answer writes (via niche_brand_kit_update or niche_brand_profile_set). `is_already_set` is computed from the user's current BrandKit + BrandProfile state so the agent skips questions already answered.\n\nReturns the FULL chain in one call — the agent inspects state, decides flow, and asks in any order (or skips entirely if the user volunteered the answer earlier in the conversation).","inputSchema":{"type":"object","properties":{"brand_id":{"type":"string","description":"Optional — if set, also reads the persisted BrandProfile for that brand_id so questions whose answers live in the profile (banned_terms, framing.allowed, etc.) get their is_already_set computed against profile state too."},"include_filled":{"type":"boolean","default":false,"description":"If true, return ALL questions including those already answered. Default false — agent only sees the gaps."}}},"description_zh":"返回一个结构化问题链，代理引导用户完成该问题以填充 BrandKit + VoiceProfile +（可选）BrandProfile。每个条目都带有一个“意图”，描述答案的含义（因此代理会根据其已经进行的对话用自己的声音进行解释），以及逐字中继工具的代理的“prompt_hint”后备。\n\n当代理帮助新用户设置 Niche 并希望获得可预测的、品牌意识的问答序列而不是即兴发挥时，请使用此选项。按影响力分级：\n  - 第 0 层（主要）：URL 提取 — 在一次询问中完成 70-90%。\n  - 第 1 层 (gap_fill)：仅 URL 摄取字段未填充。\n  - 第 2 层（纪律）：选择加入护栏（主题关闭、禁止术语、竞争对手立场）。\n  - 第 3 层 (no_url)：没有网站的用户的完全后备。\n\n每个问题“applies_to_field”告诉代理答案写在哪里（通过niche_brand_kit_update或niche_brand_profile_set）。 `is_already_set` 是根据用户当前的 BrandKit + BrandProfile 状态计算得出的，因此代理会跳过已回答的问题。\n\n在一次调用中返回完整的链——代理检查状态，决定流程，并以任何顺序询问（或者如果用户在对话早期自愿回答，则完全跳过）。"},{"name":"niche_brand_kit_update","description":"Set specific BrandKit fields by name. The write path for the structured fields (tagline / boilerplate / voice_notes / forbidden_phrases / signature_phrases / endcard preferences / video voice preference / colors / fonts) without going through the ingest engine. Use after niche_brand_kit_ingest fills the easy stuff, or to commit values the user answered through niche_brand_kit_guided_setup.\n\nOnly fields you pass are touched — fields you omit stay at their current value. Lists REPLACE the current value (not append). Response includes a diff[] of fields that changed and the full updated kit.","inputSchema":{"type":"object","properties":{"accent":{"type":"string"},"tagline":{"type":"string","description":"Brand tagline (5-12 words)."},"brand_id":{"type":"string","description":"Which brand slot to update. Omit for default; pass a slug to target a specific brand kit (for multi-brand accounts)."},"cta_text":{"type":"string","description":"One-line call to action appended to generated posts, e.g. 'DM to commission'."},"logo_url":{"type":"string"},"brand_name":{"type":"string","description":"Display name when creating a new brand_id slot."},"primary_bg":{"type":"string","description":"Primary background color (#rrggbb)."},"boilerplate":{"type":"string","description":"Brand boilerplate (one paragraph, ≤350 chars)."},"voice_notes":{"type":["string","array"],"items":{"type":"string"},"description":"Voice direction in plain prose. A string OR a list of strings (the guided-setup text_list form) — a list is joined server-side."},"external_url":{"type":"string","description":"Canonical brand URL (homepage)."},"headshot_url":{"type":"string"},"secondary_bg":{"type":"string"},"text_primary":{"type":"string"},"wordmark_url":{"type":"string"},"text_secondary":{"type":"string"},"body_font_family":{"type":"string"},"endcard_template":{"enum":["classic","bold_center"],"type":"string"},"forbidden_phrases":{"type":"array","items":{"type":"string"},"description":"Phrases never to use in generated copy. Max 16; trimmed beyond."},"signature_phrases":{"type":"array","items":{"type":"string"},"description":"Phrases the brand uses. Max 16."},"endcard_outro_text":{"type":"string"},"headline_font_family":{"type":"string"},"video_voice_preference":{"enum":["auto","male","female"],"type":"string"},"endcard_mark_preference":{"enum":["auto","logo","wordmark","headshot","text_only"],"type":"string"}}},"description_zh":"按名称设置特定的 BrandKit 字段。结构化字段（标语/样板/语音注释/禁止短语/签名短语/结束卡首选项/视频语音首选项/颜色/字体）的写入路径，无需通过摄取引擎。在niche_brand_kit_ingest填充简单的内容后使用，或者提交用户通过niche_brand_kit_guided_setup回答的值。\n\n只有您传递的字段才会被触及 - 您省略的字段将保持其当前值。列表替换当前值（不追加）。响应包括已更改字段的 diff[] 以及完整更新的套件。"},{"name":"niche_render_image_card","description":"Render a visual onto a CP3 post — or, with scope='recomposite', EDIT THE TEXT on an existing image for FREE (same background, new words/color/size — NEVER re-render just to change text, that costs ~30cr and swaps the art under the user). scope='restore' brings back the prior image from history, also free. House rule: presentation changes never route through generation.\n\nFor a NEW render (scope='full', the default) you MUST pick `background` — there is NO default, on purpose: the two modes differ sharply in cost + result, and a wrong guess either burns credits or returns a flat color when you wanted a picture.\n\n• background='photo' — a GENERATED AI/photographic image made for the story, with your headline composited over it. This is the actual picture. The output's script keeps `bg_url` — the CLEAN generated background retained separately from the composited card; it powers FREE text/color/size re-composites + restore (no regen). ~30 credits, ~30-90s, ASYNC: returns status='rendering_image_card'; poll niche_session_state (`image_render.status`: rendering → done, static_urls land on the output / failed, credits refunded). Don't re-call on a perceived hang (a second call no-ops while one is in-flight).\n\n• background='brand_color' — a FREE, instant flat BRAND CARD: your headline on the brand's solid color with logo + wordmark. No image generation, no credits, milliseconds. SYNCHRONOUS: the card is in outputs[] right away.\n\n`headline` sets the bold header for either mode (defaults to the post's card_headline; auto-fits, never truncated). Idempotent: a prior render is replaced. Errors: render_not_ready if pre-CP3; render_not_configured (photo) if no image-gen key; render_card_unavailable if brand_color but the piece has no card-bearing platform.","inputSchema":{"type":"object","properties":{"cell":{"type":"string","description":"Optional — render at the canvas size for this cell:\n  • linkedin:image_post → 1200×627 (1.91:1 landscape)\n  • x:image_post → 1200×675 (16:9 landscape)\n  • instagram:image_post → 1080×1350 (4:5 portrait)\n  • linkedin:carousel / instagram:carousel → 1080×1080 (cover slide)\nWhen omitted: 1080×1080 universal-square asset stored under platform='image_card' (shared across all image cells)."},"scope":{"enum":["full","recomposite","restore"],"type":"string","description":"'full' (default): render a NEW visual (background required). 'recomposite': FREE text edit on the EXISTING image — new headline/subhead/color/size composited over the retained background, pixels otherwise identical, synchronous, 0 credits. THE path for wording iteration; never pay a re-render to change words. 'restore': bring back the prior image from history, free."},"subhead":{"type":"string","description":"scope='recomposite' only: the smaller line under the header. Omit to keep the current one; pass '' to clear it."},"headline":{"type":"string","description":"The BOLD HEADER words — works for BOTH backgrounds. Defaults to the post's `card_headline` (the short, sized-for-the-box line). Pass this to force exact text, e.g. a brand name leading it ('Anthropic drew a line…'). It auto-fits the box and is never truncated."},"font_size":{"type":"string","description":"scope='recomposite' only: 'bigger'/'smaller'/'reset' — steps the headline size from its current value (compounds). The response's font_changed/font_at_limit say whether it actually moved."},"background":{"enum":["photo","brand_color"],"type":"string","description":"REQUIRED for scope='full' (ignored otherwise) — what's behind the text. 'photo' = a GENERATED AI/photographic image (the actual picture; ~30 credits, ~30-90s, async). 'brand_color' = a FREE, instant flat brand card (no AI image). No default: choose deliberately."},"session_id":{"type":"string","description":"Session UUID that's reached cp3_awaiting_review or complete."},"text_color":{"type":"string","description":"scope='recomposite' only: text color — a name ('blue') or hex ('#ec4899')."},"estimate_only":{"type":"boolean","default":false,"description":"If true, return {credit_cost} WITHOUT rendering or spending. Use to learn the cost before committing."}}},"description_zh":"将视觉效果渲染到 CP3 帖子上 — 或者，使用scope='recomposite'，免费编辑现有图像上的文本（相同背景、新单词/颜色/大小 — 切勿仅为了更改文本而重新渲染，这会花费约 30cr 并交换用户下的艺术）。 scope='restore' 从历史记录中恢复之前的图像，也是免费的。内部规则：演示文稿的更改永远不会通过代际传递。\n\n对于新的渲染（scope='full'，默认值），你必须选择“背景”——故意没有默认值：两种模式在成本+结果上差异很大，错误的猜测要么会消耗积分，要么在你想要图片时返回平坦的颜色。\n\n•background='photo' — 为故事制作的生成的人工智能/摄影图像，上面合成了您的标题。这是真实的图片。输出的脚本保留“bg_url”——与合成卡分开保留的 CLEAN 生成背景；它支持免费的文本/颜色/大小重新合成+恢复（无再生）。 ~30 个积分，~30-90 秒，异步：返回 status='rendering_image_card'；轮询niche_session_state（`image_render.status`：渲染→完成，static_urls 登陆输出/失败，积分退款）。不要在感知到挂起时重新呼叫（当一个呼叫在飞行中时第二次呼叫无操作）。\n\n• background='brand_color' — 免费、即时的平面品牌卡：带有徽标+文字标记的品牌纯色标题。没有图像生成，没有片尾字幕，只有毫秒。同步：卡立即位于输出[]中。\n\n`headline` 为任一模式设置粗体标题（默认为帖子的 card_headline；自动调整，永不截断）。幂等：先前的渲染被替换。错误：如果是 CP3 之前的版本，则 render_not_ready； render_not_configured（照片）如果没有图像生成密钥； render_card_unavailable 如果brand_color但该作品没有承载平台。"},{"name":"niche_render_reel","description":"Render a 9:16 vertical reel for a session that's reached CP3: a per-beat script (typically 4-7 beats) becomes stills + voiceover + motion + caption overlays + an endcard, composited into one video (~30-120s).\n\nscope='recomposite' re-renders an EXISTING reel's presentation for FREE from its kept footage — captions on/off, caption_sync_mode, endcard words — same beats, same voiceover, 0 credits (house rule: presentation changes never route through generation). NEVER pay a full re-render just to flip captions or fix the endcard line. scope='endcard' is the same free door narrowed to the endcard only; scope='beat:N' re-rolls ONE shot's image (same script, fresh take, optional beat_direction steer) for a small honest charge and reuses everything else.\n\nHEADS-UP before spending: reels are DOWNLOAD-ONLY for now (direct Instagram publishing is pending platform approval) — the user posts the file themselves. Set that expectation before the render.\n\nIdempotent on the video platform: any prior render is replaced.\n\nToggles: `captions_enabled` (default true) overlays the per-beat caption text on each still; `music_enabled` (default false) mixes background music behind the voiceover; `tone` shapes the script — `default` | `punchy` | `direct` | `reflective`; `caption_sync_mode` (default 'phrase' — captions track the voiceover in lockstep) — 'phrase' reveals captions phrase-by-phrase in lockstep with the spoken words (text taken from the VO). Phrase mode adds NO extra credits (it reuses timestamps already fetched). Ignored when captions_enabled is false.\n\nErrors: 503 if the render backend isn't configured; 400 if pre-CP3; 422 if the script came back unusable.\n\nCost: standard tier = ~350 credits (one still per non-endcard beat + voiceover + composite). Premium opt-in is a separate path.","inputSchema":{"type":"object","properties":{"cell":{"type":"string","description":"Optional — cell to tag the rendered Output row (linkedin:reel / x:reel / instagram:reel). All v1 reels are 9:16 1080×1920 universal so cell only affects bookkeeping, not pixels. When omitted: stored under platform='video' (shared across all reel cells)."},"tone":{"enum":["default","punchy","direct","reflective"],"type":"string","description":"Script tone hint. Default 'default'."},"scope":{"type":"string","description":"'full' (default): render a NEW reel (script + stills + voiceover, ~350 credits). 'recomposite': FREE re-render of the EXISTING reel from its kept footage — captions on/off, caption_sync_mode, endcard_text/endcard_outro — same beats, same voiceover, 0 credits, async like full. 'endcard': FREE endcard-only re-render (endcard_text/endcard_outro; captions untouched — use 'recomposite' for those). 'beat:N': re-roll shot N's image (1-based) — same script brief, one fresh image (~15 credits); steer it with beat_direction; everything else (other shots, voiceover, captions, endcard) is reused. Generation changes (tone, voiceover words, music) still need scope='full'. Reels rendered before footage-keeping shipped can't use the partial scopes (the error says so)."},"session_id":{"type":"string","description":"Session UUID that's reached cp3_awaiting_review or complete."},"endcard_text":{"type":"string","description":"scope='recomposite'/'endcard' only: the big endcard words (replaces the brand stamp text). Omit to keep the current endcard."},"endcard_outro":{"type":"string","description":"scope='recomposite'/'endcard' only: the smaller endcard line under the mark. Omit to keep the current one; pass '' to clear it."},"estimate_only":{"type":"boolean","default":false,"description":"If true, return {credit_cost} WITHOUT rendering or spending. Use to learn the cost before committing."},"music_enabled":{"type":"boolean","description":"Mix ElevenLabs music behind the VO. Default false."},"beat_direction":{"type":"string","description":"scope='beat:N' only: optional plain-language steer for the re-rolled shot ('warmer light, no people'). Omit for a fresh take on the same brief."},"captions_enabled":{"type":"boolean","description":"Overlay caption text on each beat. Default true. With scope='recomposite': omit to keep the reel's current setting."},"caption_sync_mode":{"enum":["beat","phrase"],"type":"string","description":"How captions track the voiceover. 'beat' (default): each beat's caption shows for that beat's spoken window. 'phrase': the caption reveals phrase-by-phrase in lockstep with the spoken words (caption text is taken from the spoken VO). Ignored when captions_enabled is false. No extra cost."}}},"description_zh":"为达到 CP3 的会话渲染 9:16 垂直卷轴：每节拍脚本（通常为 4-7 节拍）变为剧照 + 画外音 + 动作 + 字幕叠加 + 结束卡，合成为一个视频（约 30-120 秒）。\n\nscope='recomposite' 从保留的素材中免费重新渲染现有卷轴的演示文稿 — 字幕开/关、caption_sync_mode、endcard 单词 — 相同的节拍、相同的画外音、0 积分（内部规则：演示文稿更改永远不会通过生成传递）。切勿仅仅为了翻转字幕或修复尾卡线而支付完整的重新渲染费用。 scope='endcard' 是相同的自由门，仅缩小到结束卡； scope='beat:N' 重新滚动一个镜头的图像（相同的脚本、新鲜的镜头、可选的beat_direction 转向），并重复使用其他所有内容。\n\n消费前请注意：卷轴目前仅供下载（Instagram 直接发布正在等待平台批准）——用户自己发布文件。在渲染之前设置该期望。\n\n视频平台上的幂等：任何先前的渲染都会被替换。\n\n切换：“captions_enabled”（默认 true）在每个静止图像上覆盖每节拍的字幕文本； `music_enabled`（默认 false）混合画外音后面的背景音乐； `tone` 塑造脚本 — `default` | '有力' | `直接` | “反思”； “caption_sync_mode”（默认“短语”——字幕以同步方式跟踪画外音）——“短语”以与口语单词（取自旁白的文本）同步的方式逐短语地显示字幕。短语模式不会增加额外的积分（它重复使用已获取的时间戳）。当 Captions_enabled 为 false 时被忽略。\n\n错误：如果未配置渲染后端，则为 503； CP3 之前为 400； 422 如果脚本返回时无法使用。\n\n成本：标准层 = ~350 个积分（每个非最终卡节拍 + 画外音 + 合成）。高级选择加入是一条单独的路径。"},{"name":"niche_session_revert","description":"Revert a session back to an earlier checkpoint. Use when the user (or you) decided the picked story / angle isn't the right one and you want to re-pick without starting a new scan.\n\n  to='story' → cancels current generation, returns to CP1_AWAITING_STORY with the same ranked stories list. Clears selected_story_id + selected_angle_id.\n  to='angle' → returns to CP2_AWAITING_ANGLE with the same angles list. Clears selected_angle_id only.\n\nIdempotent: reverting a session already at the target checkpoint returns the current state unchanged.\n\nSAFETY: reverting a finished run (cp3/complete) discards its paid-for drafts. The first call returns status='confirm_discard' with the count instead of reverting; pass acknowledge_discard=true to actually proceed. Credits: the discarded drafts are NOT refunded (the generation already ran), and re-picking re-runs + re-charges content generation — revert to change direction, not to reclaim spend.","inputSchema":{"type":"object","properties":{"to":{"enum":["story","angle"],"type":"string"},"session_id":{"type":"string"},"acknowledge_discard":{"type":"boolean","description":"Required to revert a cp3/complete session — confirms you accept discarding its finished, paid-for drafts."}}},"description_zh":"将会话恢复到较早的检查点。当用户（或您）认为所选择的故事/角度不正确并且您想要重新选择而不开始新的扫描时使用。\n\n  to='story' → 取消当前生成，返回到具有相同排名故事列表的 CP1_AWAITING_STORY。清除 selected_story_id + selected_angle_id。\n  to='angle' → 返回到具有相同角度列表的 CP2_AWAITING_ANGLE。仅清除 selected_angle_id。\n\n幂等：恢复已在目标检查点的会话将返回当前状态不变。\n\n安全：恢复已完成的运行（cp3/完整）会丢弃其付费草稿。第一次调用返回 status='confirm_discard' 和计数而不是恢复；通过acknowledge_discard=true 来实际继续。积分：丢弃的草稿不予退还（生成已经运行），并且重新选择重新运行+重新收费内容生成 - 恢复为改变方向，而不是回收支出。"},{"name":"niche_session_cancel","description":"Cancel a running session. Marks status=failed with an error_message ('cancelled by user' or the caller's reason), and stops the in-flight orchestrator if any.\n\nUsed when you want to free a slot under the concurrent-session cap WITHOUT deleting the session (history + audit trail preserved). Use the REST DELETE endpoint if you want a hard archive cleanup that also wipes outputs.\n\nIdempotent: cancelling a completed / already-failed session returns its current state unchanged.\n\nCredits: the UNUSED hold is released; work already committed (e.g. the discovery for a story you picked) stays charged — cancelling does not refund committed work. A pre-CP1 cancel (nothing committed yet) is effectively free. A full refund is reserved for an actual run FAILURE.","inputSchema":{"type":"object","properties":{"reason":{"type":"string","description":"Optional — surfaced as session.error_message."},"session_id":{"type":"string"}}},"description_zh":"取消正在运行的会话。将 status=failed 标记为 error_message（“被用户取消”或调用者的原因），并停止运行中的协调器（如果有）。\n\n当您想要释放并发会话上限下的插槽而不删除会话（保留历史记录+审计跟踪）时使用。如果您想要进行硬存档清理并擦除输出，请使用 REST DELETE 端点。\n\n幂等：取消已完成/已经失败的会话将返回其当前状态不变。\n\n积分：未使用的持有被释放；已提交的工作（例如，您选择的故事的发现）仍需付费 - 取消不会退还已提交的工作。 CP1 之前的取消（尚未提交任何内容）实际上是免费的。如果实际运行失败，我们将全额退款。"},{"name":"niche_session_export","description":"Export a session as a structured calendar artifact preserving session_id + per-story story_id traceability. Use after a niche_signal_scan when you want a METADATA-RICH CONTENT BACKLOG instead of running individual pieces end-to-end. Outputs a standard editorial-calendar shape suitable for content-backlog and planning workflows.\n\nTwo formats:\n  • markdown — human-readable + agent-citable. Session metadata at top (session_id + niche + scan timestamp + brand_profile_active state). Then a card per story with title, headline_candidate, summary, recency_score, publication_breakdown, source_breakdown, and EMPTY slots for the user to fill (Frame, Hook, Article-shape, Ship Order). Followed by a 'recommended ship order' section and cross-cutting notes.\n  • json — structured shape ready to pipe to other tools or load into a notebook. Same data, machine-shaped.\n\nPreserves story_id + session_id traceability so you can come back in N weeks and re-run niche_angle_propose / niche_draft_create against the same stories with the same brand profile bound. The artifact is the entry point to a calendar-builder workflow.","inputSchema":{"type":"object","properties":{"format":{"enum":["markdown","json"],"type":"string","default":"markdown","description":"Output shape. Default markdown."},"session_id":{"type":"string"}}},"description_zh":"将会话导出为结构化日历工件，保留 session_id + 每个故事的 Story_id 可追溯性。当您想要元数据丰富的内容储备而不是端到端运行各个片段时，请在niche_signal_scan之后使用。输出适合内容积压和规划工作流程的标准编辑日历形状。\n\n两种格式：\n  • markdown — 人类可读+代理可引用。顶部的会话元数据（session_id + 利基 + 扫描时间戳 + Brand_profile_active 状态）。然后每个故事有一张卡片，其中包含标题、标题候选、摘要、近期得分、出版物细分、来源细分和供用户填写的空槽（框架、挂钩、文章形状、发货订单）。接下来是“推荐的发货顺序”部分和横切注释。\n  • json — 结构化形状，可通过管道传输到其他工具或加载到笔记本中。相同的数据，机器形状。\n\n保留 Story_id + session_id 可追溯性，以便您可以在 N 周内返回并针对具有相同品牌配置文件绑定的相同故事重新运行niche_angle_propose/niche_draft_create。该工件是日历构建器工作流程的入口点。"},{"name":"niche_add_output","description":"Add an output cell to a session that's already reached CP3. Use this when the user picked a small initial cell set, previewed the drafts, and now wants another surface — e.g. session started with linkedin:text_post, user wants to add instagram:carousel too.\n\nText-only cells (linkedin:text_post, x:thread, long_form_article, etc.): generates text via the matching generator if it hasn't run yet, then creates the Output row. This call BLOCKS synchronously ~20-30s when it must run a new generator family (no status to poll); it returns fast when that family already generated. Idempotent — if the cell is already on the session, returns the existing Output unchanged.\n\nAsset cells (linkedin:image_post, x:reel, instagram:image_post, etc.): creates the text Output row; image-bearing cells AUTO-ATTACH a free branded card (static_urls populated without an explicit render — swap it anytime), while video/reel assets are never auto-rendered. The response's next_step says exactly what to call for more: niche_render_image_card (cell + an explicit background: 'photo' or 'brand_color') or niche_render_reel (cell). The response's copy_lineage says whether this cell drafted FRESH text or shares its generator family's existing copy.\n\nErrors: 400 if session is pre-CP3; 422 if cell is invalid.","inputSchema":{"type":"object","properties":{"cell":{"type":"string","description":"Cell to add. Must be one of the valid cells (see niche_signal_scan's target_outputs for the list)."},"session_id":{"type":"string"}}},"description_zh":"将输出单元添加到已达到 CP3 的会话。当用户选择一个小的初始单元格集、预览草稿并且现在想要另一个表面时使用此选项 - 例如会话以 linkedin:text_post 开始，用户也想添加 instagram:carousel。\n\n纯文本单元格（linkedin:text_post、x:thread、long_form_article 等）：如果匹配生成器尚未运行，则通过匹配生成器生成文本，然后创建输出行。当它必须运行新的生成器系列时（没有要轮询的状态），此调用会同步阻塞约 20-30 秒；当该家庭已经生成时，它会快速返回。幂等 — 如果单元已在会话中，则返回现有输出不变。\n\n资源单元（linkedin:image_post、x:reel、instagram:image_post 等）：创建文本输出行；图像承载单元自动附加一张免费品牌卡（静态网址填充没有显式渲染 - 随时交换），而视频/卷轴资产永远不会自动渲染。响应的 next_step 准确说明了需要更多内容：niche_render_image_card（单元格+明确的背景：“照片”或“品牌颜色”）或niche_render_reel（单元格）。响应的 copy_lineage 表示该单元格是否起草了 FRESH 文本或共享其生成器系列的现有副本。\n\n错误：如果会话是 CP3 之前的，则为 400； 422 如果单元格无效。"},{"name":"niche_reuse_asset","description":"Copy an image that ALREADY exists on one output onto another cell — instant + FREE (no regen, no credits). Use this when the user wants 'the same image' on a second surface ('use the LinkedIn image on X', 'same picture on the newsletter') instead of niche_render_image_card (which generates a NEW image and costs credits).\n\nBoth cells must already exist on the session (add the target via niche_add_output first if needed) and the source must have a rendered image. Copies the source's static_urls onto the target so it publishes with that image. Idempotent: source==target is a no-op.","inputSchema":{"type":"object","properties":{"to_cell":{"type":"string","description":"Cell to copy the image ONTO (e.g. 'x:image_post')."},"from_cell":{"type":"string","description":"Cell that HAS the image (e.g. 'linkedin:image_post')."},"session_id":{"type":"string"}}},"description_zh":"将一个输出上已存在的图像复制到另一个单元上 - 即时 + 免费（无需重新生成，无积分）。当用户想要在第二个表面上使用“相同的图像”（“在 X 上使用 LinkedIn 图像”、“时事通讯上的相同图片”）而不是niche_render_image_card（生成新图像并花费积分）时，请使用此选项。\n\n两个单元格必须已存在于会话中（如果需要，首先通过niche_add_output 添加目标），并且源必须具有渲染图像。将源的 static_url 复制到目标，以便它与该图像一起发布。幂等：source==target 是无操作。"},{"name":"niche_attach_image","description":"Attach a USER-SUPPLIED photo to a post — the creator's OWN image (a product shot, their actual work) as the post's visual, instead of an AI-generated image (niche_render_image_card photo, paid) or a flat brand card. FREE — no image-gen spend. For a visual-product maker the real piece IS the sale.\n\nPass the cell + the image as base64 ({mime_type, data_base64}). The cell's output must already exist (use niche_add_output first if needed). Sets it as the post's image; publishes with the caption. Undo-able (the prior image is kept in history).","inputSchema":{"type":"object","properties":{"cell":{"type":"string","description":"Post cell to attach onto (e.g. 'linkedin:image_post', 'x:image_post', 'instagram:image_post')."},"image":{"type":"object","required":["mime_type","data_base64"],"properties":{"name":{"type":"string"},"mime_type":{"type":"string"},"data_base64":{"type":"string"}},"description":"The photo: {mime_type, data_base64} (+ optional name). Max 8MB."},"session_id":{"type":"string"}}},"description_zh":"将用户提供的照片附加到帖子中 - 创建者自己的图像（产品照片、他们的实际作品）作为帖子的视觉效果，而不是 AI 生成的图像（niche_render_image_card 照片，付费）或平面品牌卡。免费——无需图像生成费用。对于视觉产品制造商来说，真正的部分是销售。\n\n将单元格 + 图像作为 base64 ({mime_type, data_base64}) 传递。单元格的输出必须已经存在（如果需要，请首先使用niche_add_output）。将其设置为帖子的图片；发布时附有标题。可撤消（先前的图像保留在历史中）。"},{"name":"niche_whoami","description":"One safe read-only call that orients an agent: WHO it is (the authenticated account, plan, and credit balance), WHAT the server is (version, endpoint, transport, live tool count), the CAPABILITY MAP (every tool grouped into functional bands — discover / decide / draft / render / publish / brand / session — plus the recommended flow), and the BRAND STATE (whether a brand profile / kit / voice will shape output, so the agent knows BEFORE a run whether drafts will read personalized or as neutral commentary). Call this first to plan a session and to check credits before spending.","inputSchema":{"type":"object","properties":{}},"description_zh":"一个安全的只读调用可以引导代理：它是谁（经过身份验证的帐户、计划和信用余额）、服务器是什么（版本、端点、传输、实时工具数量）、功能图（每个工具分为功能带 - 发现/决定/草稿/渲染/发布/品牌/会话 - 加上推荐的流程）以及品牌状态（品牌简介/套件/声音是否会影响输出，因此代理在运行之前知道是否草稿将阅读个性化或中立评论）。首先调用它来计划会话并在消费前检查积分。"}],"init_ref_tasks":[],"others":{"source_metadata":{"source_id":"1afb1937-01f4-465d-81f9-7d0aa4e6f27c","qualified_name":"sailquery/niche","display_name":"Niche","namespace":"sailquery","slug":"niche","verified":true,"use_count":3238,"remote":true,"is_deployed":true,"unlisted":false,"inactive":false,"created_at":"2026-06-14T15:21:59.636Z","homepage":"https://nicheangle.com","by_smithery":false,"owner":"org_01KV3AXKTC3VM4DH6TRXZZEWQX","score":null,"deployment_url":"https://niche--sailquery.run.tools","connections":[{"type":"http","deployment_url":"https://niche--sailquery.run.tools","config_schema":{}}],"resources":[{"name":"Editorial context","uri":"niche://context/06d926bb-6c44-4496-8bd9-79a4e819c827","description":"One compact read: positioning, voice, dislikes, off-topics, platform preferences, and recent winning angles. Pull this first to reason about the user before calling tools.","mimeType":"application/json"},{"name":"Editorial memory","uri":"niche://memory/06d926bb-6c44-4496-8bd9-79a4e819c827","description":"The last 10 runs: niche, picked story, status, dates.","mimeType":"application/json"},{"name":"Brand voice","uri":"niche://brand_voice/06d926bb-6c44-4496-8bd9-79a4e819c827","description":"Voice archetype, tone, avoid list, signature phrases.","mimeType":"application/json"},{"name":"Brand kit","uri":"niche://brand_kit/06d926bb-6c44-4496-8bd9-79a4e819c827","description":"Colors, tagline, boilerplate, marks. Drives content_generation + render templates.","mimeType":"application/json"},{"name":"Published history","uri":"niche://published_history/06d926bb-6c44-4496-8bd9-79a4e819c827","description":"Last 25 published outputs across platforms, with provenance.","mimeType":"application/json"},{"name":"Module entitlements","uri":"niche://module_entitlements/06d926bb-6c44-4496-8bd9-79a4e819c827","description":"Which paid module signal sources the user owns + plan tier.","mimeType":"application/json"}]},"data_directions":["Official company newsrooms, product announcements, changelogs, engineering blogs, and press releases","Government publications, regulatory notices, legislation, enforcement actions, and public-agency datasets","Corporate filings, investor-relations materials, earnings releases, shareholder letters, and transaction disclosures","Academic papers, preprints, conference proceedings, patents, and institutional research releases","Industry-association publications, standards bodies, market reports, surveys, and trade-journal coverage","Verified executive, researcher, founder, and institutional posts on public social platforms","Public podcasts, interviews, conference talks, webinars, transcripts, and expert commentary","Creator-owned websites, newsletters, blogs, portfolios, product pages, and archived posts used for repurposing or voice analysis","Public trend signals such as funding activity, hiring patterns, product launches, partnerships, acquisitions, and geographic investment shifts","Platform-specific content examples and engagement patterns that can inform LinkedIn posts, X threads, Instagram carousels, newsletters, and long-form articles","Brand-owned public assets such as logos, typography, color systems, taglines, boilerplate, style guides, and compliance disclosures","Source metadata needed for editorial trust, including publication date, author, canonical URL, source type, corroboration, recency, and provenance"],"organization_status":"agent_organized"}},{"global_id":"smithery_sidneybissoli_medical_terminologies_mcp_10","schema_version":"1.0","environment":{"basic_info":{"source":"smithery","url":"https://smithery.ai/servers/sidneybissoli/medical-terminologies-mcp","name":"sidneybissoli/medical-terminologies-mcp","index":10},"description":"An open-source medical terminology research and interoperability service for searching, resolving, validating, classifying, and cross-referencing clinical concepts and codes. It supports diagnoses, laboratory observations, medications, literature indexing, drug classes, and Brazilian Portuguese disease coding across ICD-11, ICD-10/CID-10, SNOMED CT, LOINC, RxNorm, MeSH, ATC, and NDC. Typical workflows include code lookup, hierarchy navigation, terminology validation, ICD-10-to-ICD-11 migration, drug ingredient and class analysis, panel or answer-set inspection, multilingual concept discovery, and version-aware terminology research. Some cross-terminology mappings—especially LOINC-to-SNOMED CT—require licensed or authenticated external datasets and may only return acquisition guidance.","description_zh":"这是一个开源的医学术语研究与互操作服务，用于搜索、解析、验证、分类和交叉引用临床概念与编码。它支持诊断、实验室观察、药物、文献索引、药物类别，以及巴西葡萄牙语疾病编码，覆盖 ICD-11、ICD-10/CID-10、SNOMED CT、LOINC、RxNorm、MeSH、ATC 和 NDC。典型工作流包括代码查询、层级导航、术语验证、ICD-10 到 ICD-11 的迁移、药物成分和类别分析、面板或答案集检查、多语言概念发现，以及面向版本的术语研究。部分术语间映射（尤其是 LOINC 到 SNOMED CT）需要获得许可或经过认证的外部数据集，可能只能返回数据获取指南。","domain":{"level1":"general","level2":null,"level3":null}},"init_ref_tools":[{"name":"icd11_search","description":"Search for medical conditions, diseases, and health problems in ICD-11 (International Classification of Diseases, 11th Revision).\n\nUse this tool to:\n- Find ICD-11 codes for diagnoses\n- Search for diseases by name or keyword\n- Look up conditions in multiple languages\n\nReturns matching entities with codes, titles, and relevance scores.","inputSchema":{"type":"object","properties":{"query":{"type":"string","minLength":1,"description":"Search text (disease name, symptom, or keyword)"},"language":{"enum":["en","es","pt","fr","de","it","zh","ja","ar","ru"],"type":"string","default":"en","description":"Language code (default: en)"},"max_results":{"type":"integer","default":25,"maximum":100,"minimum":1,"description":"Maximum number of results (1-100). Default: 25"}}},"outputSchema":{"type":"object","properties":{"query":{"type":"string"},"entities":{"type":"array","items":{"type":"object","required":["code","title","score","uri","is_leaf","matching_pvs"],"properties":{"uri":{"type":"string"},"code":{"type":["string","null"]},"score":{"type":"number"},"title":{"type":"string"},"is_leaf":{"type":"boolean"},"matching_pvs":{"type":"array","items":{"type":"object","required":["property_id","label","score"],"properties":{"label":{"type":"string"},"score":{"type":"number"},"important":{"type":"boolean"},"property_id":{"type":"string"}},"additionalProperties":false}}},"additionalProperties":false}},"total_count":{"type":"integer"}},"required":["query","total_count","entities"]},"description_zh":"在 ICD-11（国际疾病分类，第 11 版）中搜索医疗状况、疾病和健康问题。\n\n使用此工具可以：\n- 查找 ICD-11 代码进行诊断\n- 按名称或关键字搜索疾病\n- 以多种语言查找条件\n\n返回具有代码、标题和相关性分数的匹配实体。"},{"name":"icd11_lookup","description":"Get detailed information about a specific ICD-11 entity by code or URI.\n\nUse this tool to:\n- Get the full definition of a disease\n- Retrieve coding notes and exclusions\n- Get the official title and synonyms\n\nProvide either an ICD-11 code (e.g., \"BA00\") or a full foundation URI.","inputSchema":{"type":"object","properties":{"uri":{"type":"string","format":"uri","description":"Full ICD-11 foundation URI"},"code":{"type":"string","minLength":1,"description":"ICD-11 code (e.g., \"BA00\", \"1A00\")"},"language":{"enum":["en","es","pt","fr","de","it","zh","ja","ar","ru"],"type":"string","default":"en","description":"Language code (default: en)"}}},"outputSchema":{"type":"object","properties":{"uri":{"type":"string"},"code":{"type":["string","null"]},"title":{"type":"string"},"block_id":{"type":["string","null"]},"class_kind":{"type":["string","null"]},"code_range":{"type":["string","null"]},"definition":{"type":["string","null"]},"exclusions":{"type":"array","items":{"type":"object","required":["uri","label"],"properties":{"uri":{"type":"string"},"label":{"type":"string"}},"additionalProperties":false}},"inclusions":{"type":"array","items":{"type":"object","required":["uri","label"],"properties":{"uri":{"type":"string"},"label":{"type":"string"}},"additionalProperties":false}},"browser_url":{"type":["string","null"]},"coding_note":{"type":["string","null"]},"index_terms":{"type":"array","items":{"type":"object","required":["uri","label"],"properties":{"uri":{"type":"string"},"label":{"type":"string"}},"additionalProperties":false}},"long_definition":{"type":["string","null"]},"diagnostic_criteria":{"type":["string","null"]}},"required":["code","code_range","uri","title","class_kind","block_id","definition","long_definition","diagnostic_criteria","coding_note","exclusions","inclusions","index_terms","browser_url"]},"description_zh":"通过代码或 URI 获取有关特定 ICD-11 实体的详细信息。\n\n使用此工具可以：\n- 获得疾病的完整定义\n- 检索编码注释和排除项\n- 获取官方标题和同义词\n\n提供 ICD-11 代码（例如“BA00”）或完整的基础 URI。"},{"name":"icd11_hierarchy","description":"Navigate the ICD-11 hierarchy to find parent or child entities.\n\nUse this tool to:\n- Find broader categories (parents) of a condition\n- Find specific subtypes (children) of a condition\n- Understand the classification structure\n\nDirection 'parents' returns ancestor categories, 'children' returns subcategories.","inputSchema":{"type":"object","properties":{"code":{"type":"string","minLength":1,"description":"ICD-11 code to get hierarchy for"},"direction":{"enum":["parents","children"],"type":"string","description":"Direction: \"parents\" for ancestors, \"children\" for subtypes"}}},"outputSchema":{"type":"object","properties":{"code":{"type":"string"},"entities":{"type":"array","items":{"type":"object","required":["code","code_range","title","uri"],"properties":{"uri":{"type":"string"},"code":{"type":["string","null"]},"title":{"type":"string"},"code_range":{"type":["string","null"]}},"additionalProperties":false}},"direction":{"enum":["parents","children"],"type":"string"}},"required":["code","direction","entities"]},"description_zh":"浏览 ICD-11 层次结构以查找父实体或子实体。\n\n使用此工具可以：\n- 查找更广泛的病症类别（父级）\n- 查找病症的特定子类型（子类型）\n- 了解分类结构\n\n方向“parents”返回祖先类别，“children”返回子类别。"},{"name":"icd11_chapters","description":"List all ICD-11 chapters (top-level categories).\n\nUse this tool to:\n- Get an overview of ICD-11 structure\n- Find which chapter covers a body system or condition type\n- Navigate to specific disease categories\n\nICD-11 has 28 chapters covering all areas of medicine.","inputSchema":{"type":"object","properties":{"language":{"enum":["en","es","pt","fr","de","it","zh","ja","ar","ru"],"type":"string","default":"en","description":"Language code (default: en)"}}},"outputSchema":{"type":"object","properties":{"chapters":{"type":"array","items":{"type":"object","required":["number","uri","code","code_range","title","error"],"properties":{"uri":{"type":"string"},"code":{"type":["string","null"]},"error":{"type":["string","null"]},"title":{"type":["string","null"]},"number":{"type":"integer"},"code_range":{"type":["string","null"]}},"additionalProperties":false}}},"required":["chapters"]},"description_zh":"列出 ICD-11 的所有章节（顶级类别）。\n\n使用此工具可以：\n- 了解 ICD-11 结构的概述\n- 查找涵盖身体系统或状况类型的章节\n- 导航至特定疾病类别\n\nICD-11 有 28 章，涵盖医学的所有领域。"},{"name":"icd11_postcoordination","description":"Get postcoordination information for an ICD-11 code.\n\nUse this tool to:\n- Find available axes for building composite codes\n- Check required vs optional postcoordination\n- Understand code extension possibilities\n\nPostcoordination allows adding severity, laterality, anatomy, etc.","inputSchema":{"type":"object","properties":{"code":{"type":"string","minLength":1,"description":"ICD-11 code to get postcoordination info for"}}},"outputSchema":{"type":"object","properties":{"axes":{"type":"array","items":{"type":"object","required":["axis_name","required","allow_multiple","value_count"],"properties":{"required":{"type":"boolean"},"axis_name":{"type":"string"},"value_count":{"anyOf":[{"type":"integer"},{"type":"null"}]},"allow_multiple":{"type":"boolean"}},"additionalProperties":false}},"code":{"type":"string"}},"required":["code","axes"]},"description_zh":"获取 ICD-11 代码的后协调信息。\n\n使用此工具可以：\n- 查找构建复合材料规范的可用轴\n- 检查必需与可选的后协调\n- 了解代码扩展的可能性\n\n后协调允许增加严重性、偏侧性、解剖学等。"},{"name":"loinc_search","description":"Search for laboratory tests, clinical observations, and measurements in LOINC (Logical Observation Identifiers Names and Codes).\n\nUse this tool to:\n- Find LOINC codes for lab tests (e.g., \"glucose\", \"hemoglobin\")\n- Search for clinical measurements and vital signs\n- Look up diagnostic observations\n\nReturns matching LOINC codes with names, components, and properties.","inputSchema":{"type":"object","properties":{"query":{"type":"string","minLength":1,"description":"Search term (test name, keyword, or partial LOINC code)"},"max_results":{"type":"integer","default":25,"maximum":100,"minimum":1,"description":"Maximum number of results (1-100). Default: 25"}}},"outputSchema":{"type":"object","properties":{"items":{"type":"array","items":{"type":"object","required":["loinc_num","long_common_name","short_name","component","property","time_aspect","system","scale_type","method_type","class","status"],"properties":{"class":{"type":"string"},"status":{"type":"string"},"system":{"type":"string"},"property":{"type":"string"},"component":{"type":"string"},"loinc_num":{"type":"string"},"scale_type":{"type":"string"},"short_name":{"type":"string"},"method_type":{"type":"string"},"time_aspect":{"type":"string"},"long_common_name":{"type":"string"}},"additionalProperties":false}},"query":{"type":"string"},"shown_count":{"type":"integer"},"total_count":{"type":"integer"}},"required":["query","total_count","shown_count","items"]},"description_zh":"在 LOINC（逻辑观察标识符名称和代码）中搜索实验室测试、临床观察和测量结果。\n\n使用此工具可以：\n- 查找实验室测试的 LOINC 代码（例如“葡萄糖”、“血红蛋白”）\
