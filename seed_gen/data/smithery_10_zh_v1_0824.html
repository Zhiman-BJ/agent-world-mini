AT answer pipeline and never return a processing/deferral response. Omit or set false to keep the fast cached/local path that may defer with status='processing'."}}},"outputSchema":{"type":"object","properties":{"text":{"type":"string","description":"Present when the tool returns a text-only response."}}},"description_zh":"通过可信答案管道向代理提问：TAT 语料库/事件/操作元数据加上后端控制的外部研究，包括引用、置信度、道德引擎评分、代理语音评分和答案标准收据。返回不够的证据而不是无来源的声明。设置 instant_answer=true 以强制同步、完全处理的答案（由现场询问专家小部件使用）。"},{"name":"tat_get_event","description":"Fetch one structured agent-news event by event_id, including sources, confidence, ethics score, agent voice score, recommended actions, and standard receipt.","inputSchema":{"type":"object","properties":{"event_id":{"type":"string","description":"Agent event id"}}},"outputSchema":{"type":"object","properties":{"text":{"type":"string","description":"Present when the tool returns a text-only response."}}},"description_zh":"按 event_id 获取一项结构化代理新闻事件，包括来源、置信度、道德评分、代理语音评分、建议操作和标准收据。"},{"name":"tat_stats","description":"Return firehose/demo counters for recent agent-news events: counts, verification rate, average confidence, source count, urgency, and actionability breakdowns.","inputSchema":{"type":"object","properties":{"hours":{"type":"integer","description":"Lookback window in hours (default 24)"}}},"outputSchema":{"type":"object","properties":{"text":{"type":"string","description":"Present when the tool returns a text-only response."}}},"description_zh":"返回最近代理新闻事件的消防/演示计数器：计数、验证率、平均置信度、源计数、紧急性和可操作性故障。"},{"name":"tat_get_answer_standard","description":"Return the current The Agent Times MCP Answer Standard so agents can explain why a TAT answer/event is trusted, or why insufficient_evidence was returned.","inputSchema":{"type":"object","properties":{}},"outputSchema":{"type":"object","properties":{"text":{"type":"string","description":"Present when the tool returns a text-only response."}}},"description_zh":"返回当前的代理时报 MCP 答案标准，以便代理可以解释为什么 TAT 答案/事件是可信的，或者为什么返回了不够的证据。"},{  integration directories, API references, and marketplace listings","Government regulations, legislative proposals, regulator guidance, enforcement actions, and public-policy consultations","Infrastructure status pages, incident reports, vulnerability databases, and reliability disclosures","Public labor-market data, job postings, workforce reports, and studies of automation's employment effects","Public commerce, sales, marketing, advertising-technology, and engineering case studies involving AI agents","Cryptographically signed publication records, timestamps, authorship metadata, source links, and other provenance evidence","Public discussion threads, article comments, endorsements, and attributed expert or agent commentary","Editorial policies, codes of conduct, correction records, trust reports, and source-quality methodologies"],"organization_status":"agent_organized"}},{"global_id":"smithery_onesignal_onesignal_2","schema_version":"1.0","environment":{"basic_info":{"source":"smithery","url":"https://smithery.ai/servers/onesignal/onesignal","name":"onesignal/onesignal","index":2},"description":"OneSignal is a multichannel customer engagement platform for creating, targeting, sending, and measuring push notifications, email, SMS, in-app messages, and iOS Live Activities. It supports audience segmentation, user identities and subscriptions, reusable templates, custom-event-driven journeys, campaign analytics, and subscription lifecycle management.","description_zh":"OneSignal 是一个多渠道客户互动平台，用于创建、定向、发送和衡量推送通知、电子邮件、短信、应用内消息以及 iOS Live Activities。它支持受众细分、用户身份与订阅、可复用模板、由自定义事件驱动的用户旅程、活动分析和订阅生命周期管理。","domain":{"level1":"general","level2":null,"level3":null}},"init_ref_tools":[{"name":"create_alias_by_subscription","description":"Create or update identity aliases for the user who owns a given subscription. The `onesignal_id` alias is read-only and must not be included.","inputSchema":{"type":"object","properties":{"app_id":{"type":"string","description":"OneSignal app ID."},"aliases":{"type":"object","description":"New aliases to set on the user. Do not include `onesignal_id` (read-only).","additionalProperties":{"type":"string"}},"subscription_id":{"type":"string","description":"Subscription ID to look up the user by."}}},"description_zh":"为拥有给定订阅的用户创建或更新身份别名。 `onesignal_id` 别名是只读的，不得包含在内。"},{"name":"create_custom_events","description":"Record custom events for OneSignal users, such as purchases, content views, or milestones. Use these to enter users into Journeys or trigger Wait Until nodes. Each event must set at least one of `external_id` or `onesignal_id`.","inputSchema":{"type":"object","properties":{"app_id":{"type":"string","description":"OneSignal app ID."},"events":{"type":"array","items":{"$ref":"#/$defs/CustomEventInput"},"description":"Array of event objects to record. Each event must have `name` and\neither `external_id` or `onesignal_id` set."}}},"description_zh":"记录 OneSignal 用户的自定义事件，例如购买、内容查看或里程碑。使用这些将用户输入旅程或触发等待节点。每个事件必须至少设置“external_id”或“onesignal_id”之一。"},{"name":"create_or_update_alias","description":"Create or update identity aliases for a user identified by alias. The `onesignal_id` alias is read-only and must not be included.","inputSchema":{"type":"object","properties":{"app_id":{"type":"string","description":"OneSignal app ID."},"aliases":{"type":"object","description":"New aliases to set on the user. Do not include `onesignal_id` (read-only).","additionalProperties":{"type":"string"}},"alias_id":{"type":"string","description":"Alias ID value."},"alias_label":{"type":"string","description":"Alias label used to identify the user (e.g. `\"external_id\"`)."}}},"description_zh":"为别名标识的用户创建或更新身份别名。 `onesignal_id` 别名是只读的，不得包含在内。"},{"name":"create_segment","description":"Create a new audience segment with filter conditions. Maximum 200 filter entries.","inputSchema":{"type":"object","properties":{"name":{"type":"string","description":"Segment name."},"app_id":{"type":"string","description":"OneSignal app ID."},"filters":{"type":"array","items":{"$ref":"#/$defs/FilterEntry"},"description":"Segment filter conditions. Maximum 200 entries."}}},"description_zh":"使用过滤条件创建新的细分受众群。最多 200 个过滤器条目。"},{"name":"create_subscription","description":"Create a new subscription and attach it to a user. Set `type` to the channel (\"Email\", \"SMS\", \"iOSPush\", \"AndroidPush\", etc.) and `token` to the email address, E.164 phone number, or push token.","inputSchema":{"type":"object","properties":{"app_id":{"type":"string","description":"OneSignal app ID."},"alias_id":{"type":"string","description":"Alias ID value."},"alias_label":{"type":"string","description":"Alias label used to identify the user (e.g. `\"external_id\"`)."},"subscription":{"type":"object","properties":{"type":{"type":["string","null"],"description":"Subscription channel type. Common values: `\"Email\"`, `\"SMS\"`,\n`\"ChromePush\"`, `\"FirefoxPush\"`, `\"SafariLegacyPush\"`, `\"SafariPush\"`,\n`\"AndroidPush\"`, `\"iOSPush\"`, `\"HuaweiPush\"`."},"token":{"type":["string","null"],"description":"The push token, email address, or phone number for this subscription."},"enabled":{"type":["boolean","null"],"description":"Whether this subscription is enabled (i.e. can receive notifications)."},"test_type":{"type":["integer","null"],"format":"int32","description":"Test device type. `1` = development, `2` = ad-hoc."}},"description":"Subscription to create."}}},"description_zh":"创建新订阅并将其附加到用户。将“type”设置为通道（“Email”、“SMS”、“iOSPush”、“AndroidPush”等），将“token”设置为电子邮件地址、E.164 电话号码或推送令牌。"},{"name":"create_template","description":"Create a new notification template for a OneSignal app.","inputSchema":{"type":"object","properties":{"name":{"type":"string","description":"Template name."},"extra":{"type":"object","nullable":true,"description":"Additional notification fields. Common keys: `big_picture`, `chrome_web_image`,\n`ios_sound`, `android_sound`, `ios_badge_type`, `ios_badge_count`,\n`data` (custom key-value payload), `url`, `web_url`, `app_url`,\n`buttons`, `web_buttons`, `ios_category`, `android_channel_id`.","additionalProperties":true},"app_id":{"type":"string","description":"OneSignal app ID."},"contents":{"type":["object","null"],"description":"Notification content map (language code → message). E.g. `{\"en\": \"Hello!\"}`.","additionalProperties":{"type":"string"}},"headings":{"type":["object","null"],"description":"Notification heading map (language code → heading).","additionalProperties":{"type":"string"}},"email_body":{"type":["string","null"],"description":"HTML body for email templates. When provided, the template is automatically\nmarked as an email template (`isEmail: true`)."},"email_subject":{"type":["string","null"],"description":"Subject line for email templates. When provided, the template is automatically\nmarked as an email template (`isEmail: true`)."}}},"description_zh":"为 OneSignal 应用程序创建新的通知模板。"},{"name":"create_user","description":"Create a new user in a OneSignal app. Provide an `identity` (e.g. {\"external_id\": \"user-123\"}) so the user can be referenced later by alias. Optionally attach `properties` (tags, language, country) and `subscriptions` (email, SMS, or push channels). The `identity` field is required to prevent orphaned users.","inputSchema":{"type":"object","properties":{"app_id":{"type":"string","description":"OneSignal app ID."},"identity":{"type":"object","description":"User identity aliases (e.g. `{\"external_id\": \"user-123\"}`).\nRequired — without an identity the user cannot be referenced later\nby alias, resulting in orphaned records.","additionalProperties":{"type":"string"}},"properties":{"type":"object","nullable":true,"properties":{"ip":{"type":["string","null"],"description":"User's IP address (IPv4 or IPv6). Typically set by the API response; rarely set manually."},"lat":{"type":["number","null"],"format":"double","description":"Latitude coordinate. Acceptable range: `-90.0` to `90.0`."},"long":{"type":["number","null"],"format":"double","description":"Longitude coordinate. Acceptable range: `-180.0` to `180.0`."},"tags":{"type":["object","null"],"description":"Custom key-value pairs for user segmentation and personalization.\nKeys and values must be strings. Does not support nested objects or arrays.\nExample: `{\"plan\": \"premium\", \"level\": \"5\"}`.","additionalProperties":{"type":"string"}},"country":{"type":["string","null"],"description":"Country code in ISO 3166-1 Alpha-2 format (uppercase). Example: `\"US\"`, `\"GB\"`."},"language":{"type":["string","null"],"description":"Language code in ISO 639-1 format (lowercase). Example: `\"en\"`, `\"es\"`, `\"fr\"`."},"last_active":{"type":["integer","null"],"format":"int64","description":"Unix timestamp (seconds) of the user's most recent activity."},"timezone_id":{"type":["string","null"],"description":"Timezone identifier from the IANA tz database. Example: `\"America/Los_Angeles\"`."},"first_active":{"type":["integer","null"],"format":"int64","description":"Unix timestamp (seconds) of when the user was first active."}},"description":"User profile properties (tags, language, country, location, etc.)."},"subscriptions":{"type":["array","null"],"items":{"$ref":"#/$defs/CreateSubscriptionInput"},"description":"Subscriptions to attach to this user (push, email, or SMS channels)."}}},"description_zh":"在 OneSignal 应用程序中创建新用户。提供“身份”（例如{“external_id”：“user-123”}），以便稍后可以通过别名引用该用户。可以选择附加“属性”（标签、语言、国家/地区）和“订阅”（电子邮件、短信或推送渠道）。需要“身份”字段来防止孤立用户。"},{"name":"export_audience_activity_csv","description":"Export audience activity for a notification to CSV. WARNING: Only 1 concurrent export is allowed per account — if a 409 or 429 is returned, a previous export is still running.","inputSchema":{"type":"object","properties":{"email":{"type":["string","null"],"description":"Email address to deliver the report to. Optional."},"app_id":{"type":"string","description":"OneSignal app ID."},"events":{"type":"string","description":"Type of events to retrieve. `\"sent\"` — users the notification was sent to;\n`\"clicked\"` — users who clicked the notification."},"notification_id":{"type":"string","description":"Notification ID to export audience activity for."}}},"description_zh":"将通知的受众活动导出到 CSV。警告：每个帐户仅允许 1 个并发导出 — 如果返回 409 或 429，则表明之前的导出仍在运行。"},{"name":"export_subscriptions_csv","description":"Export all subscriptions for a OneSignal app to CSV. WARNING: Only 1 concurrent export is allowed per account — if a 409 or 429 is returned, a previous export is still running.","inputSchema":{"type":"object","properties":{"app_id":{"type":"string","description":"OneSignal app ID."},"extra_fields":{"type":["array","null"],"items":{"type":"string"},"description":"Optional list of extra fields to include in the export."},"segment_name":{"type":["string","null"],"description":"Optional segment name to filter subscriptions by."},"last_active_since":{"type":["string","null"],"description":"Unix timestamp (seconds). Only include subscriptions active since this time."}}},"description_zh":"将 OneSignal 应用程序的所有订阅导出到 CSV。警告：每个帐户仅允许 1 个并发导出 - 如果返回 409 或 429，则先前的导出仍在运行。"},{"name":"get_custom_events","description":"List the custom event definitions indexed for a OneSignal app, including each event's properties, sources, most recent occurrence, usage locations (segment/journey), storage and total counts, and retention duration. Requires OAuth authentication.","inputSchema":{"type":"object","properties":{"app_id":{"type":"string","description":"OneSignal app ID."}}},"description_zh":"列出为 OneSignal 应用程序索引的自定义事件定义，包括每个事件的属性、来源、最近发生的事件、使用位置（路段/旅程）、存储和总计数以及保留持续时间。需要 OAuth 身份验证。"},{"name":"get_segment","description":"Retrieve a single audience segment by ID. By default, includes full segment metadata and filters (`payload` object with `id`, `name`, `created_at`, `source`, and `filters`). Set `include_segment_detail` to `false` to return only the subscriber count. Note: the API returns 400 for user-based segments (those using custom_event or message_event filters).","inputSchema":{"type":"object","properties":{"app_id":{"type":"string","description":"OneSignal app ID."},"segment_id":{"type":"string","description":"Segment ID to retrieve."},"include_segment_detail":{"type":["boolean","null"],"description":"If `true` (default), includes segment metadata and filters in the\nresponse (`payload` object with `id`, `name`, `created_at`, `source`,\nand `filters`). Set to `false` to return only the subscriber count."}}},"description_zh":"按 ID 检索单个细分受众群。默认情况下，包括完整的段元数据和过滤器（带有“id”、“name”、“created_at”、“source”和“filters”的“payload”对象）。将“include_segment_detail”设置为“false”以仅返回订阅者计数。注意：对于基于用户的细分（使用 custom_event 或 message_event 过滤器的细分），API 返回 400。"},{"name":"get_template","description":"Retrieve a single notification template by ID.","inputSchema":{"type":"object","properties":{"app_id":{"type":"string","description":"OneSignal app ID."},"template_id":{"type":"string","description":"Template ID to retrieve."}}},"description_zh":"按 ID 检索单个通知模板。"},{"name":"get_user_identity","description":"Retrieve all identity aliases associated with a user. Identify the user by `alias_label` (typically \"external_id\") and `alias_id`.","inputSchema":{"type":"object","properties":{"app_id":{"type":"string","description":"OneSignal app ID."},"alias_id":{"type":"string","description":"Alias ID value."},"alias_label":{"type":"string","description":"Alias label used to look up the user. Typically `\"external_id\"`."}}},"description_zh":"检索与用户关联的所有身份别名。通过“alias_label”（通常为“external_id”）和“alias_id”标识用户。"},{"name":"get_user_identity_by_subscription","description":"Retrieve the identity aliases for the user who owns a given subscription.","inputSchema":{"type":"object","properties":{"app_id":{"type":"string","description":"OneSignal app ID."},"subscription_id":{"type":"string","description":"Subscription ID."}}},"description_zh":"检索拥有给定订阅的用户的身份别名。"},{"name":"list_apps","description":"List OneSignal apps accessible to the authenticated user. Returns app names, IDs, and organization info. Supports pagination via limit and offset parameters.","inputSchema":{"type":"object","properties":{"limit":{"type":["integer","null"],"format":"uint32","minimum":0,"description":"Maximum number of apps to return. Defaults to 50; maximum allowed is 300."},"offset":{"type":["integer","null"],"format":"uint32","minimum":0,"description":"Pagination offset."}}},"description_zh":"列出经过身份验证的用户可以访问的 OneSignal 应用程序。返回应用程序名称、ID 和组织信息。支持通过 limit 和 offset 参数进行分页。"},{"name":"list_messages","description":"List push notifications for a OneSignal app. Use `limit` (default 50, max ~250) and `offset` for pagination. Avoid large offsets — this endpoint has known performance degradation at high page numbers.","inputSchema":{"type":"object","properties":{"kind":{"type":["integer","null"],"format":"uint32","minimum":0,"description":"Filter by how the notification was created: `0` = Dashboard, `1` = API, `3` = Automated."},"limit":{"type":"integer","format":"uint32","default":50,"minimum":0,"description":"Maximum number of notifications to return. Defaults to 50. Max ~250."},"app_id":{"type":"string","description":"OneSignal app ID."},"offset":{"type":"integer","format":"uint32","default":0,"minimum":0,"description":"Pagination offset."},"template_id":{"type":["string","null"],"description":"Filter by template ID (UUID v4)."},"time_offset":{"type":["string","null"],"description":"ISO 8601 timestamp or Base64 integer token for cursor-based pagination (from previous response)."}}},"description_zh":"列出 OneSignal 应用程序的推送通知。使用“limit”（默认 50，最大 ~250）和“offset”进行分页。避免大的偏移量——已知该端点在高页数时性能会下降。"},{"name":"list_segments","description":"List audience segments for a OneSignal app. Maximum 300 segments per page.","inputSchema":{"type":"object","properties":{"limit":{"type":["integer","null"],"format":"uint32","minimum":0,"description":"Maximum number of segments to return per page. Maximum 300."},"app_id":{"type":"string","description":"OneSignal app ID."},"offset":{"type":["integer","null"],"format":"uint32","minimum":0,"description":"Pagination offset. Maximum 300 segments per page."}}},"description_zh":"列出 OneSignal 应用程序的受众群体。每页最多 300 个段。"},{"name":"list_templates","description":"List notification templates for a OneSignal app. Maximum 50 per page.","inputSchema":{"type":"object","properties":{"limit":{"type":["integer","null"],"format":"uint32","minimum":0,"description":"Maximum number of templates to return. Max 50 per page."},"app_id":{"type":"string","description":"OneSignal app ID."},"offset":{"type":["integer","null"],"format":"uint32","minimum":0,"description":"Pagination offset."},"channel":{"type":["string","null"],"description":"Filter by delivery channel (e.g. `\"push\"`, `\"email\"`, `\"sms\"`)."}}},"description_zh":"列出 OneSignal 应用程序的通知模板。每页最多 50 个。"},{"name":"onesignal_config","description":"Return the current OneSignal MCP server configuration and connected app details.","inputSchema":{"type":"object"},"description_zh":"返回当前 OneSignal MCP 服务器配置和连接的应用程序详细信息。"},{"name":"onesignal_health","description":"Check the health status of the OneSignal MCP server.","inputSchema":{"type":"object"},"description_zh":"检查 OneSignal MCP 服务器的健康状态。"},{"name":"onesignal_reference_overview","description":"Return an overview of the OneSignal REST API reference, including available endpoints and rate limits.","inputSchema":{"type":"object"},"description_zh":"返回 OneSignal REST API 参考的概述，包括可用端点和速率限制。"},{"name":"send_message","description":"Send a push notification, email, or SMS via the OneSignal API. TIER 3 — HIGH IMPACT: confirmation is required before sending. Rate limited to 10 requests per minute. The `filters` array is limited to 200 entries; max 20,000 users per call. For push: set `contents`. For email: set `email_subject` + `email_body` (or use `template_id`). For SMS: set `contents` + `target_channel = \"sms\"`.","inputSchema":{"type":"object","properties":{"ttl":{"type":["integer","null"],"format":"uint32","minimum":0,"description":"Time-to-live in seconds. Notification expires if not delivered within this window. Push only."},"url":{"type":["string","null"],"description":"URL to open when the push notification is clicked."},"data":{"type":"object","nullable":true,"description":"Custom data payload passed through to the app (key-value map). Push only.","additionalProperties":true},"name":{"type":["string","null"],"description":"An internal name to help organize messages. Not shown to recipients. Max 128 chars."},"extra":{"type":"object","nullable":true,"description":"Additional less-common notification fields (e.g. `big_picture`, `ios_sound`,\n`buttons`, `web_buttons`, `android_channel_id`, `ios_category`, `collapse_id`).","additionalProperties":true},"app_id":{"type":"string","description":"OneSignal app ID."},"filters":{"type":["array","null"],"items":{"$ref":"#/$defs/FilterEntry"},"description":"Audience filters. Maximum 200 entries. Mutually exclusive with `included_segments`."},"contents":{"type":["object","null"],"description":"Notification content map (language code → message). E.g. `{\"en\": \"Hello!\"}`.\nRequired for push and SMS. Not required for email (use `email_body` instead).","additionalProperties":{"type":"string"}},"email_to":{"type":["array","null"],"items":{"type":"string"},"description":"Send email to specific addresses (up to 20,000). Creates new subscriptions if needed.\nMutually exclusive with `filters`, `included_segments`, `include_aliases`."},"headings":{"type":["object","null"],"description":"Notification heading map (language code → heading). Push only.","additionalProperties":{"type":"string"}},"sms_from":{"type":["string","null"],"description":"The phone number or messaging service used to send SMS/MMS. Defaults to your SMS Setup."},"email_bcc":{"type":["array","null"],"items":{"type":"string"},"description":"BCC recipients to copy on the email. Supplemental to the primary recipients\n(`email_to`, segments, aliases) — does not target on its own."},"email_body":{"type":["string","null"],"description":"HTML body for email messages. Required for email unless using `template_id`."},"send_after":{"type":["string","null"],"description":"Schedule delivery for a future UTC date/time in ISO 8601 format.\nExample: `\"2025-09-24T14:00:00-07:00\"`."},"custom_data":{"type":"object","nullable":true,"description":"Custom data payload for push notifications, or personalization data for templates.\nMax size: 2KB (push/SMS), 10KB (email).","additionalProperties":true},"template_id":{"type":["string","null"],"description":"Template ID (UUID v4) to use for message content."},"email_subject":{"type":["string","null"],"description":"Subject line for email messages. Required for email unless using `template_id`."},"delayed_option":{"type":["string","null"],"description":"Controls per-user delivery timing. Options: `\"timezone\"`, `\"last-active\"`."},"sms_media_urls":{"type":["array","null"],"items":{"type":"string"},"description":"URLs of media files to send as MMS. Requires MMS-capable `sms_from` number."},"target_channel":{"type":["string","null"],"description":"The delivery channel when using `include_aliases` or segments for SMS.\nAccepts `\"push\"`, `\"email\"`, or `\"sms\"`."},"email_from_name":{"type":["string","null"],"description":"The sender display name for the email. Defaults to your Dashboard \"Sender Name\"."},"email_preheader":{"type":["string","null"],"description":"Preview text displayed after the email subject line in the inbox."},"idempotency_key":{"type":["string","null"],"description":"Idempotency key (UUID) to prevent duplicate messages. Valid for 30 days."},"include_aliases":{"type":["object","null"],"description":"Target users by alias (e.g. `{\"external_id\": [\"user_1\"]}`). Up to 20,000 aliases.\nRequires `target_channel` to be set. Mutually exclusive with `filters`, `included_segments`.","additionalProperties":{"type":"array","items":{"type":"string"}}},"excluded_segments":{"type":["array","null"],"items":{"type":"string"},"description":"Exclude segments by name. Use with `included_segments`."},"included_segments":{"type":["array","null"],"items":{"type":"string"},"description":"Target segments by name. Mutually exclusive with `filters` and `include_aliases`."},"email_from_address":{"type":["string","null"],"description":"The \"From\" email address (e.g. `\"news@example.com\"`). Defaults to your Dashboard setting."},"email_sender_domain":{"type":["string","null"],"description":"The authenticated sending domain for email delivery. Must be verified in DNS."},"delivery_time_of_day":{"type":["string","null"],"description":"Use with `delayed_option: \"timezone\"` to set local delivery time.\nFormats: `\"9:00AM\"`, `\"21:45\"`, `\"09:45:30\"`."},"include_unsubscribed":{"type":["boolean","null"],"description":"If `true`, sends email to unsubscribed addresses. Use for transactional/account emails only."},"include_phone_numbers":{"type":["array","null"],"items":{"type":"string"},"description":"Send SMS to specific phone numbers in E.164 format (up to 20,000).\nCreates new subscriptions if needed. Mutually exclusive with other targeting."},"email_reply_to_address":{"type":["string","null"],"description":"The \"Reply-To\" email address. Defaults to your Dashboard setting."},"include_subscription_ids":{"type":["array","null"],"items":{"type":"string"},"description":"Specific subscription IDs to target (up to 20,000). IMPORTANT: You must also\nset `target_channel` to `\"email\"` or `\"sms\"` when targeting email or SMS subscriptions,\notherwise the API will reject them as invalid push IDs."},"disable_email_click_tracking":{"type":["boolean","null"],"description":"If `true`, disables click tracking on URLs in the email body."}}},"description_zh":"通过 OneSignal API 发送推送通知、电子邮件或短信。第 3 层 — 高影响力：发送前需要确认。速率限制为每分钟 10 个请求。 `filters` 数组限制为 200 个条目；每次呼叫最多 20,000 个用户。对于推送：设置“内容”。对于电子邮件：设置 `email_subject` + `email_body` （或使用 `template_id`）。对于 SMS：设置 `contents` + `target_channel = \"sms\"`。"},{"name":"start_live_activity","description":"Start an iOS Live Activity and deliver it to a specific device subscription.","inputSchema":{"type":"object","properties":{"name":{"type":"string","description":"An internal name to help organize and track messages."},"event":{"type":"string","description":"The action to perform. Must be `\"start\"` for this endpoint."},"app_id":{"type":"string","description":"OneSignal app ID."},"filters":{"type":["array","null"],"items":{"$ref":"#/$defs/FilterEntry"},"description":"Dynamic audience filters."},"contents":{"type":"object","description":"Push message body with language-specific values. E.g. `{\"en\": \"Game started!\"}`.","additionalProperties":{"type":"string"}},"headings":{"type":"object","description":"Push title with language-specific values. E.g. `{\"en\": \"Live Score\"}`.","additionalProperties":{"type":"string"}},"priority":{"type":["integer","null"],"format":"uint32","minimum":0,"description":"Notification priority. `10` = high, `5` = normal."},"stale_date":{"type":["integer","null"],"format":"int64","description":"Unix timestamp (seconds) after which the Live Activity is considered stale."},"activity_id":{"type":"string","description":"An identifier you set when starting the Live Activity to uniquely identify it on the device."},"activity_type":{"type":"string","description":"Activity type identifier used in the URL path (e.g. `\"sports-score\"`)."},"event_updates":{"type":"object","description":"Initial dynamic content state for the Live Activity.","additionalProperties":true},"idempotency_key":{"type":["string","null"],"description":"Idempotency key to prevent duplicate messages."},"include_aliases":{"type":"object","nullable":true,"description":"Target users by alias map (e.g. `{\"external_id\": [\"user1\", \"user2\"]}`). Max 20,000.","additionalProperties":{"type":"array","items":{"type":"string"}}},"event_attributes":{"type":"object","description":"Static data to initialize the Live Activity (matches your ActivityAttributes struct).","additionalProperties":true},"excluded_segments":{"type":["array","null"],"items":{"type":"string"},"description":"Exclude users in these segments."},"included_segments":{"type":["array","null"],"items":{"type":"string"},"description":"Target predefined segments by name."},"ios_relevance_score":{"type":["number","null"],"format":"double","description":"Relevance score between `0` and `1` for sorting Live Activities (iOS)."},"include_subscription_ids":{"type":["array","null"],"items":{"type":"string"},"description":"Target specific subscription IDs."}}},"description_zh":"启动 iOS Live Activity 并将其传送到特定设备订阅。"},{"name":"transfer_subscription","description":"Transfer a subscription to a different user within the same app. Cross-app transfers are not supported. Rate limited to 1 request per second per subscription.","inputSchema":{"type":"object","properties":{"app_id":{"type":"string","description":"OneSignal app ID."},"identity":{"type":"object","description":"Identity of the user to transfer the subscription to.","additionalProperties":{"type":"string"}},"subscription_id":{"type":"string","description":"Subscription ID to transfer."}}},"description_zh":"将订阅转移给同一应用程序中的不同用户。不支持跨应用传输。每个订阅的速率限制为每秒 1 个请求。"},{"name":"unsubscribe_email","description":"Unsubscribe an email address using the token from an email unsubscribe link. This endpoint uses token-based auth (no REST API key required).","inputSchema":{"type":"object","properties":{"token":{"type":"string","description":"Unsubscribe token from the email link."},"app_id":{"type":"string","description":"OneSignal app ID."},"notification_id":{"type":"string","description":"Notification ID from the unsubscribe link."}}},"description_zh":"使用电子邮件取消订阅链接中的令牌取消订阅电子邮件地址。此端点使用基于令牌的身份验证（不需要 REST API 密钥）。"},{"name":"update_live_activity","description":"Update or end an active iOS Live Activity.","inputSchema":{"type":"object","properties":{"name":{"type":"string","description":"An internal name to help organize and track messages."},"event":{"type":"string","description":"The action to perform on the Live Activity. `\"update\"` or `\"end\"`."},"app_id":{"type":"string","description":"OneSignal app ID."},"contents":{"type":["object","null"],"description":"Optional push message body shown alongside the Live Activity update.","additionalProperties":{"type":"string"}},"priority":{"type":["integer","null"],"format":"uint32","minimum":0,"description":"Notification priority. `10` = high, `5` = normal."},"stale_date":{"type":["integer","null"],"format":"int64","description":"Unix timestamp (seconds) after which the Live Activity is considered stale."},"activity_id":{"type":"string","description":"Live Activity ID to update."},"event_updates":{"type":"object","description":"Updated dynamic content state for the Live Activity.","additionalProperties":true},"dismissal_date":{"type":["integer","null"],"format":"int64","description":"Unix timestamp (seconds) indicating when the Live Activity should be dismissed."},"ios_relevance_score":{"type":["number","null"],"format":"double","description":"Relevance score between `0` and `1` for sorting Live Activities (iOS)."}}},"description_zh":"更新或结束正在进行的 iOS Live 活动。"},{"name":"update_segment","description":"Update an existing audience segment's name and/or filter conditions. `name` is always required even if not changing it (max 128 characters). When `filters` is provided it replaces all existing filters; omit to keep existing filters intact. Maximum 200 filter entries.","inputSchema":{"type":"object","properties":{"name":{"type":"string","description":"Segment name. Required — must be provided even if not changing it.\nMaximum 128 characters."},"app_id":{"type":"string","description":"OneSignal app ID."},"filters":{"type":["array","null"],"items":{"$ref":"#/$defs/FilterEntry"},"description":"Updated filter conditions. Maximum 200 entries. When provided, replaces\nall existing filters. Omit to keep existing filters intact."},"segment_id":{"type":"string","description":"Segment ID to update."}}},"description_zh":"更新现有细分受众群的名称和/或过滤条件。即使不更改，“name”也始终是必需的（最多 128 个字符）。当提供“filters”时，它将替换所有现有的过滤器；省略保持现有过滤器完好无损。最多 200 个过滤器条目。"},{"name":"update_subscription","description":"Update an existing subscription (token, enabled status, or test type).","inputSchema":{"type":"object","properties":{"app_id":{"type":"string","description":"OneSignal app ID."},"subscription":{"type":"object","properties":{"token":{"type":["string","null"],"description":"The push token, email address, or phone number for this subscription."},"enabled":{"type":["boolean","null"],"description":"Whether this subscription is enabled (i.e. can receive notifications)."},"test_type":{"type":["integer","null"],"format":"int32","description":"Test device type. `1` = development, `2` = ad-hoc."}},"description":"Subscription fields to update."},"subscription_id":{"type":"string","description":"Subscription ID to update."}}},"description_zh":"更新现有订阅（令牌、启用状态或测试类型）。"},{"name":"update_subscription_by_token","description":"Update a subscription identified by its channel type and token. Provide `subscription_type` and `token` to identify the subscription, then pass the fields to update in `subscription`.","inputSchema":{"type":"object","properties":{"token":{"type":"string","description":"Push token identifying the subscription."},"app_id":{"type":"string","description":"OneSignal app ID."},"subscription":{"type":"object","properties":{"token":{"type":["string","null"],"description":"The push token, email address, or phone number for this subscription."},"enabled":{"type":["boolean","null"],"description":"Whether this subscription is enabled (i.e. can receive notifications)."},"test_type":{"type":["integer","null"],"format":"int32","description":"Test device type. `1` = development, `2` = ad-hoc."}},"description":"Subscription fields to update."},"subscription_type":{"type":"string","description":"Subscription type segment in the URL path. Must match the subscription\nchannel type exactly (e.g. `\"Email\"`, `\"SMS\"`, `\"AndroidPush\"`, `\"iOSPush\"`)."}}},"description_zh":"更新由其通道类型和令牌标识的订阅。提供“subscription_type”和“token”来标识订阅，然后传递这些字段以在“subscription”中更新。"},{"name":"update_template","description":"Update an existing notification template. The `name` field is required even if you are not changing it.","inputSchema":{"type":"object","properties":{"name":{"type":"string","description":"Template name. Required even if unchanged."},"extra":{"type":"object","nullable":true,"description":"Additional notification fields to update. Common keys: `big_picture`, `chrome_web_image`,\n`ios_sound`, `android_sound`, `ios_badge_type`, `ios_badge_count`,\n`data` (custom key-value payload), `url`, `web_url`, `app_url`,\n`buttons`, `web_buttons`, `ios_category`, `android_channel_id`.","additionalProperties":true},"app_id":{"type":"string","description":"OneSignal app ID."},"contents":{"type":["object","null"],"description":"Notification content map (language code → message).","additionalProperties":{"type":"string"}},"headings":{"type":["object","null"],"description":"Notification heading map (language code → heading).","additionalProperties":{"type":"string"}},"email_body":{"type":["string","null"],"description":"HTML body for email templates. When provided, the template is automatically\nmarked as an email template (`isEmail: true`)."},"template_id":{"type":"string","description":"Template ID to update."},"email_subject":{"type":["string","null"],"description":"Subject line for email templates. When provided, the template is automatically\nmarked as an email template (`isEmail: true`)."}}},"description_zh":"更新现有的通知模板。即使您不更改“名称”字段，它也是必需的。"},{"name":"update_user","description":"Update an existing user identified by alias. Use `properties` to set tags, language, or country. Use `deltas` to increment session counts or append purchase records (these add to existing values rather than overwriting). Returns 202 — the update is processed asynchronously.","inputSchema":{"type":"object","properties":{"app_id":{"type":"string","description":"OneSignal app ID."},"deltas":{"type":"object","nullable":true,"properties":{"purchases":{"type":["array","null"],"items":{"$ref":"#/$defs/PurchaseEntry"},"description":"Purchase records to append to the user's purchase history."},"session_time":{"type":["integer","null"],"format":"int64","description":"Seconds to add to the user's total session time."},"session_count":{"type":["integer","null"],"format":"int32","description":"Number of sessions to add to the user's session count."}},"description":"Incremental deltas to apply to session/purchase stats.\nSupported keys: `session_count` (integer), `session_time` (integer seconds),\n`purchases` (array of purchase objects with `sku`, `iso`, `amount`)."},"alias_id":{"type":"string","description":"Alias ID value."},"properties":{"type":"object","nullable":true,"properties":{"ip":{"type":["string","null"],"description":"User's IP address (IPv4 or IPv6). Typically set by the API response; rarely set manually."},"lat":{"type":["number","null"],"format":"double","description":"Latitude coordinate. Acceptable range: `-90.0` to `90.0`."},"long":{"type":["number","null"],"format":"double","description":"Longitude coordinate. Acceptable range: `-180.0` to `180.0`."},"tags":{"type":["object","null"],"description":"Custom key-value pairs for user segmentation and personalization.\nKeys and values must be strings. Does not support nested objects or arrays.\nExample: `{\"plan\": \"premium\", \"level\": \"5\"}`.","additionalProperties":{"type":"string"}},"country":{"type":["string","null"],"description":"Country code in ISO 3166-1 Alpha-2 format (uppercase). Example: `\"US\"`, `\"GB\"`."},"language":{"type":["string","null"],"description":"Language code in ISO 639-1 format (lowercase). Example: `\"en\"`, `\"es\"`, `\"fr\"`."},"last_active":{"type":["integer","null"],"format":"int64","description":"Unix timestamp (seconds) of the user's most recent activity."},"timezone_id":{"type":["string","null"],"description":"Timezone identifier from the IANA tz database. Example: `\"America/Los_Angeles\"`."},"first_active":{"type":["integer","null"],"format":"int64","description":"Unix timestamp (seconds) of when the user was first active."}},"description":"User profile properties to update (tags, language, country, location, etc.)."},"alias_label":{"type":"string","description":"Alias label used to identify the user (e.g. `\"external_id\"`)."},"refresh_device_metadata":{"type":["boolean","null"],"description":"If `true`, refreshes device metadata (timezone, locale, etc.) from the subscription."}}},"description_zh":"更新由别名标识的现有用户。使用“属性”设置标签、语言或国家/地区。使用“增量”来增加会话计数或附加购买记录（这些会添加到现有值而不是覆盖）。返回 202 — 更新是异步处理的。"},{"name":"view_message","description":"Retrieve a single notification by ID.","inputSchema":{"type":"object","properties":{"app_id":{"type":"string","description":"OneSignal app ID."},"outcome_names":{"type":["array","null"],"items":{"type":"string"},"description":"Outcome names to retrieve for this message, with aggregation type.\n\nExamples:\n- `\"os__click.count\"` for click counts\n- `\"os__confirmed_delivery.count\"` for confirmed deliveries\n- `\"os__session_duration.sum\"` for total session duration\n\nIf you omit the `.count` / `.sum` suffix, `.count` will be appended automatically."},"notification_id":{"type":"string","description":"Notification ID to retrieve."},"outcome_platforms":{"type":["string","null"],"description":"Platforms to include in the outcome data, represented as a comma-separated list of\n`device_type` integers (e.g. `\"0,1,2,5,8,11,14,17\"`)."},"outcome_time_range":{"type":["string","null"],"description":"Time range for the returned outcome data.\n\nValid values: 1h, 1d, and 1mo."},"outcome_attribution":{"type":["string","null"],"description":"Attribution type for the outcomes.\n\nValid values:\n- `\"direct\"`\n- `\"influenced\"`\n- `\"unattributed\"`\n- `\"total\"`"}}},"description_zh":"按 ID 检索单个通知。"},{"name":"view_outcomes","description":"Retrieve outcome statistics for a OneSignal app (e.g. click counts, session duration). Note: data retention is approximately 30 days.","inputSchema":{"type":"object","properties":{"app_id":{"type":"string","description":"OneSignal app ID."},"outcome_names":{"type":"string","description":"Comma-separated outcome names to retrieve (e.g. `\"os__session_duration.count,os__click.count\"`).\nIf any name contains a comma, pass each name separately in `outcome_names_array` instead."},"outcome_platforms":{"type":["string","null"],"description":"Comma-separated platform IDs to filter by (e.g. `\"0,7\"` for iOS + macOS)."},"outcome_time_range":{"type":["string","null"],"description":"Time range for the returned data. Values: `\"1h\"`, `\"1d\"`, `\"1mo\"`. Defaults to `\"1h\"`."},"outcome_attribution":{"type":["string","null"],"description":"Attribution type: `\"direct\"` or `\"influenced\"` or `\"unattributed\"`."}}},"description_zh":"检索 OneSignal 应用程序的结果统计信息（例如点击次数、会话持续时间）。注意：数据保留时间约为 30 天。"},{"name":"view_user","description":"Retrieve a user and their properties by alias. Use `alias_label` \"external_id\" with the user's external ID, or another alias label you have configured.","inputSchema":{"type":"object","properties":{"app_id":{"type":"string","description":"OneSignal app ID."},"alias_id":{"type":"string","description":"Alias ID value."},"alias_label":{"type":"string","description":"Alias label used to look up the user. Typically `\"external_id\"`."}}},"description_zh":"通过别名检索用户及其属性。将 `alias_label` \"external_id\" 与用户的外部 ID 或您已配置的另一个别名标签一起使用。"}],"init_ref_tasks":[],"others":{"source_metadata":{"source_id":"0cdbc44b-23ed-4725-85a7-8782e87029a2","qualified_name":"onesignal/onesignal","display_name":"OneSignal","namespace":"onesignal","slug":"onesignal","verified":true,"use_count":27331,"remote":true,"is_deployed":true,"unlisted":false,"inactive":false,"created_at":"2026-03-10T05:39:45.197Z","homepage":"https://onesignal.com/","by_smithery":false,"owner":"org_01KPV6H8KK31A5ER2M8K9PY9HQ","score":null,"deployment_url":"https://onesignal.run.tools","connections":[{"type":"http","deployment_url":"https://onesignal.run.tools","config_schema":{}}]},"data_directions":["Official OneSignal REST API documentation covering apps, users, aliases, subscriptions, segments, templates, messages, custom events, outcomes, and CSV exports","Channel-specific implementation guides for web and mobile push, email, SMS, in-app messaging, and iOS Live Activities","Audience targeting and segmentation documentation, including filter syntax, custom-event filters, user-based segments, and entry limits","User identity and subscription model documentation covering external IDs, aliases, channel tokens, transfers, opt-outs, and cross-channel user resolution","Messaging requirements and examples for push content, email subjects and bodies, SMS targeting, templates, personalization, and localization","Campaign reporting references for delivery, clicks, outcomes, audience activity, attribution windows, and data-retention limits","Authentication, OAuth, API-key security, permissions, rate limits, pagination, asynchronous processing, and error-code documentation","OneSignal SDK repositories, release notes, changelogs, sample applications, and integration tutorials","Public pricing, plan limits, feature availability, channel costs, and account-level concurrency restrictions","Privacy, consent, unsubscribe, data-processing, retention, GDPR, CCPA, and messaging-compliance guidance","OneSignal service status, incident history, and operational health information","Public case studies, customer stories, implementation patterns, and comparisons with other customer-engagement platforms"],"organization_status":"agent_organized"}},{"global_id":"smithery_exa_3","schema_version":"1.0","environment":{"basic_info":{"source":"smithery","url":"https://smithery.ai/servers/exa","name":"exa","index":3},"description":"A web research service that searches for current public information and retrieves clean, structured content from webpages for analysis.","description_zh":"Exa 是一项网络研究服务，可搜索当前公开信息，并从网页中提取干净、结构化的内容供分析使用。","domain":{"level1":"general","level2":null,"level3":null}},"init_ref_tools":[{"name":"web_search_exa","description":"Search the web for any topic and get clean, ready-to-use content.\n\n      Best for: Finding current information, news, facts, people, companies, or answering questions about any topic.\n      Returns: Clean text content from top search results.\n\n      Query tips:\n      describe the ideal page, not keywords. \"blog post comparing React and Vue performance\" not \"React vs Vue\".\n      Use category:people / category:company to search through Linkedin profiles / companies respectively.\n      If highlights are insufficient, follow up with web_fetch_exa on the best URLs.","inputSchema":{"type":"object","properties":{"query":{"type":"string","minLength":1,"description":"Natural language search query. Should be a semantically rich description of the ideal page, not just keywords. Optionally include category:\u003ctype\u003e (company, people) to focus results — e.g. 'category:people John Doe software engineer'."},"numResults":{"type":"number","description":"Number of search results to return (default: 10)."}}},"description_zh":"在网络上搜索任何主题并获取干净、随时可用的内容。\n\n      最适合：查找当前信息、新闻、事实、人物、公司，或回答有关任何主题的问题。\n      返回：从顶部搜索结果中清除文本内容。\n\n      查询提示：\n      描述理想的页面，而不是关键字。 “比较 React 和 Vue 性能的博客文章”而不是“React 与 Vue”。\n      使用category:people /category:company 分别搜索Linkedin 个人资料/公司。\n      如果亮点不够，请在最佳 URL 上跟进 web_fetch_exa。"},{"name":"web_fetch_exa","description":"Read a webpage's full content as clean markdown. Use after web_search_exa when highlights are insufficient or to read any URL.\n\nBest for: Extracting full content from known URLs. Batch multiple URLs in one call.\nReturns: Clean text content and metadata from the page(s).","inputSchema":{"type":"object","properties":{"urls":{"type":"array","items":{"type":"string"},"description":"URLs to read. Batch multiple URLs in one call."},"maxCharacters":{"type":"number","minimum":1,"description":"Maximum characters to extract per page (default: 3000)"}}},"description_zh":"以干净的降价形式阅读网页的完整内容。当突出显示不足或要读取任何 URL 时，请在 web_search_exa 之后使用。\n\n最适合：从已知 URL 中提取完整内容。在一次调用中批量处理多个 URL。\n返回：页面中的干净文本内容和元数据。"}],"init_ref_tasks":[],"others":{"source_metadata":{"source_id":"b11dd2a9-0896-4133-a57f-2b654f9d80d4","qualified_name":"exa","display_name":"Exa Search","namespace":"exa","slug":"","verified":true,"use_count":9181,"remote":true,"is_deployed":true,"unlisted":false,"inactive":false,"created_at":"2024-12-13T15:46:50.750Z","homepage":"https://exa.ai","by_smithery":false,"owner":"org_01KNB3A514RX0G4KHMMZAXTRA2","score":null,"deployment_url":"https://exa.run.tools","connections":[{"type":"http","deployment_url":"https://exa.run.tools","config_schema":{}}],"prompts":[{"name":"web_search_help","description":"Get help with web search using Exa","arguments":[]}],"resources":[{"name":"tools_list","uri":"exa://tools/list","description":"List of available Exa tools and their descriptions","mimeType":"application/json"}]},"data_directions":["Current news, facts, and general web information","Technical documentation for libraries, APIs, and SDKs","Full webpage content from known URLs","Public information about people and professional profiles","Public company profiles and business information","Articles, blog posts, reviews, and product comparisons","Search-result excerpts, page metadata, and highlighted passages"],"organization_status":"agent_organized"}},{"global_id":"smithery_upstash_context7_mcp_4","schema_version":"1.0","environment":{"basic_info":{"source":"smithery","url":"https://smithery.ai/servers/upstash/context7-mcp","name":"upstash/context7-mcp","index":4},"description":"A developer research and documentation retrieval service that identifies software libraries and provides current, version-specific API documentation and code examples for use in coding assistance workflows.","description_zh":"Context7 是面向开发者的研究与文档检索服务，可识别软件库，并提供当前且与版本对应的 API 文档和代码示例，用于编程辅助工作流。","domain":{"level1":"general","level2":null,"level3":null}},"init_ref_tools":[{"name":"resolve-library-id","description":"Resolves a package/product name to a Context7-compatible library ID and returns matching libraries.\n\nYou MUST call this function before 'query-docs' to obtain a valid Context7-compatible library ID UNLESS the user explicitly provides a library ID in the format '/org/project' or '/org/project/version' in their query.\n\nSelection Process:\n1. Analyze the query to understand what library/package the user is looking for\n2. Return the most relevant match based on:\n- Name similarity to the query (exact matches prioritized)\n- Description relevance to the query's intent\n- Documentation coverage (prioritize libraries with higher Code Snippet counts)\n- Source reputation (consider libraries with High or Medium reputation more authoritative)\n- Benchmark Score: Quality indicator (100 is the highest score)\n\nResponse Format:\n- Return the selected library ID in a clearly marked section\n- Provide a brief explanation for why this library was chosen\n- If multiple good matches exist, acknowledge this but proceed with the most relevant one\n- If no good matches exist, clearly state this and suggest query refinements\n\nFor ambiguous queries, request clarification before proceeding with a best-guess match.\n\nIMPORTANT: Do not call this tool more than 3 times per question. If you cannot find what you need after 3 calls, use the best result you have.","inputSchema":{"type":"object","properties":{"query":{"type":"string","description":"The user's original question or task. This is used to rank library results by relevance to what the user is trying to accomplish. IMPORTANT: Do not include any sensitive or confidential information such as API keys, passwords, credentials, or personal data in your query."},"libraryName":{"type":"string","description":"Library name to search for and retrieve a Context7-compatible library ID."}}},"description_zh":"将包/产品名称解析为 Context7 兼容的库 ID 并返回匹配的库。\n\n您必须在“query-docs”之前调用此函数以获得有效的 Context7 兼容库 ID，除非用户在查询中显式提供“/org/project”或“/org/project/version”格式的库 ID。\n\n选择过程：\n1. 分析查询以了解用户正在寻找什么库/包\n2. 根据以下条件返回最相关的匹配：\n- 名称与查询的相似度（精确匹配优先）\n- 与查询意图相关的描述\n- 文档覆盖率（优先考虑代码片段数量较多的库）\n- 来源声誉（考虑具有高或中等声誉的图书馆更具权威性）\n- 基准分数：质量指标（100为最高分）\n\n响应格式：\n- 在明确标记的部分返回所选库 ID\n- 简要解释为什么选择这个库\n- 如果存在多个良好匹配，请承认这一点，但继续选择最相关的匹配\n- 如果不存在良好的匹配，请明确说明并建议查询改进\n\n对于不明确的查询，请在进行最佳猜测匹配之前请求澄清。\n\n重要提示：每个问题调用此工具的次数不要超过 3 次。如果 3 次调用后仍无法找到所需内容，请使用现有的最佳结果。"},{"name":"query-docs","description":"Retrieves and queries up-to-date documentation and code examples from Context7 for any programming library or framework.\n\nYou must call 'resolve-library-id' first to obtain the exact Context7-compatible library ID required to use this tool, UNLESS the user explicitly provides a library ID in the format '/org/project' or '/org/project/version' in their query.\n\nIMPORTANT: Do not call this tool more than 3 times per question. If you cannot find what you need after 3 calls, use the best information you have.","inputSchema":{"type":"object","properties":{"query":{"type":"string","description":"The question or task you need help with. Be specific and include relevant details. Good: 'How to set up authentication with JWT in Express.js' or 'React useEffect cleanup function examples'. Bad: 'auth' or 'hooks'. IMPORTANT: Do not include any sensitive or confidential information such as API keys, passwords, credentials, or personal data in your query."},"libraryId":{"type":"string","description":"Exact Context7-compatible library ID (e.g., '/mongodb/docs', '/vercel/next.js', '/supabase/supabase', '/vercel/next.js/v14.3.0-canary.87') retrieved from 'resolve-library-id' or directly from user query in the format '/org/project' or '/org/project/version'."}}},"description_zh":"从 Context7 检索和查询任何编程库或框架的最新文档和代码示例。\n\n您必须首先调用“resolve-library-id”以获得使用此工具所需的准确的 Context7 兼容库 ID，除非用户在查询中以“/org/project”或“/org/project/version”格式显式提供库 ID。\n\n重要提示：每个问题调用此工具的次数不要超过 3 次。如果 3 次致电后仍无法找到所需信息，请使用您所掌握的最佳信息。"}],"init_ref_tasks":[],"others":{"source_metadata":{"source_id":"a2d7f090-292e-4145-a7ef-f1a7b6b061be","qualified_name":"upstash/context7-mcp","display_name":"Context7","namespace":"upstash","slug":"context7-mcp","verified":true,"use_count":5563,"remote":true,"is_deployed":true,"unlisted":false,"inactive":false,"created_at":"2025-04-12T07:00:21.424Z","homepage":"https://github.com/upstash/context7#readme","by_smithery":false,"owner":"org_01KNB6YN4CN91PZ763VVYX3PB2","score":null,"deployment_url":"https://context7-mcp--upstash.run.tools","connections":[{"type":"http","deployment_url":"https://context7-mcp--upstash.run.tools","config_schema":{}}]},"data_directions":["Official API references and developer documentation","Versioned framework, SDK, and package documentation","Public package registry metadata","Open-source repository documentation and README files","Release notes, changelogs, and migration guides","Official tutorials, guides, and code samples","Public type definitions, function signatures, and configuration references","Project names, aliases, organizations, repository URLs, and version identifiers"],"organization_status":"agent_organized"}},{"global_id":"smithery_ojaskord_url_safety_validator_mcp_5","schema_version":"1.0","environment":{"basic_info":{"source":"smithery","url":"https://smithery.ai/servers/OjasKord/url-safety-validator-mcp","name":"OjasKord/url-safety-validator-mcp","index":5},"description":"A URL risk-screening service for AI-agent workflows that evaluates externally supplied merchant, supplier, and payment links before navigation or forwarding. It identifies phishing, malware, typosquatting, suspicious redirects, and other reputation or domain-level threats.","description_zh":"URL Safety Validator 是面向 AI 智能体工作流的 URL 风险筛查服务，会在导航或转发之前评估外部提供的商户、供应商和支付链接。它可识别钓鱼、恶意软件、域名仿冒、可疑重定向以及其他信誉或域名层面的威胁。","domain":{"level1":"general","level2":null,"level3":null}},"init_ref_tools":[{"name":"check_url","description":"Checks a URL for phishing, malware, typosquatting, and redirect threats. Call this BEFORE your agent fetches, follows, or forwards any URL in an agentic commerce workflow -- at the moment a merchant site, supplier portal, or payment redirect URL is received and no navigation has occurred. Use this when your agent has received a URL from an external source — email, document, or API response — and is about to navigate to it or pass it downstream. Checks live against Google Web Risk (webrisk.googleapis.com) and Google Safe Browsing (safebrowsing.googleapis.com). Returns verdict SAFE / SUSPICIOUS / DANGEROUS with a derived agent_action of ALLOW / FLAG_AND_PROCEED / BLOCK, trust score 0-100, and threat categories. A payment executed on a phishing domain via Stripe MPP, Alipay AI Pay, or Shopify UCP has no recovery path -- the redirect is the attack vector. A DANGEROUS verdict means halt immediately. Returns machine-ready verdict, no further analysis needed.","inputSchema":{"type":"object","properties":{"url":{"type":"string","description":"The URL to check. Full URL preferred (e.g. https://example.com/path). Bare domains also accepted."}}},"outputSchema":{"type":"object","properties":{"url":{"type":"string"},"verdict":{"enum":["SAFE","SUSPICIOUS","DANGEROUS"],"type":"string"},"hostname":{"type":"string"},"reasoning":{"type":"string"},"ssl_valid":{"type":"boolean"},"checked_at":{"type":"string","format":"date-time"},"source_url":{"type":"string"},"_disclaimer":{"type":"string"},"hold_reason":{"type":"string","description":"Present only when verdict is SUSPICIOUS"},"retry_after":{"type":["number","null"]},"trust_score":{"type":"number","maximum":100,"minimum":0},"agent_action":{"enum":["ALLOW","FLAG_AND_PROCEED","BLOCK"],"type":"string","description":"Derived directly from verdict"},"ai_confidence":{"type":["string","null"]},"analysis_type":{"type":"string"},"domain_age_days":{"type":["number","null"]},"escalation_path":{"type":"string","description":"Present only when verdict is SUSPICIOUS"},"database_signals":{"type":"object"},"domain_registered":{"type":["string","null"]},"threat_categories":{"type":"array","items":{"type":"string"}},"redirect_chain_detected":{"type":"boolean"}},"required":["url","hostname","verdict","agent_action","trust_score","checked_at","_disclaimer"]},"description_zh":"检查 URL 是否存在网络钓鱼、恶意软件、误植和重定向威胁。在您的代理在代理商务工作流程中获取、跟踪或转发任何 URL 之前调用此方法 - 在收到商家网站、供应商门户或支付重定向 URL 且未发生导航时。当您的代理从外部源（电子邮件、文档或 API 响应）收到 URL 并准备导航到该 URL 或将其传递给下游时，请使用此选项。根据 Google Web Risk (webrisk.googleapis.com) 和 Google Safe Browsing (safebrowsing.googleapis.com) 进行实时检查。返回结论“安全”/“可疑”/“危险”，派生的 agent_action 为 ALLOW/FLAG_AND_PROCEED/BLOCK、信任评分 0-100 和威胁类别。通过 Stripe MPP、支付宝 AI Pay 或 Shopify UCP 在网络钓鱼域上执行的付款没有恢复路径 - 重定向是攻击媒介。危险的判决意味着立即停止。返回机器就绪的判决，无需进一步分析。"}],"init_ref_tasks":[],"others":{"source_metadata":{"source_id":"a76e824e-f8ea-41b3-96e5-bdf28f1df165","qualified_name":"OjasKord/url-safety-validator-mcp","display_name":"URL Safety Validator MCP","namespace":"OjasKord","slug":"url-safety-validator-mcp","verified":true,"use_count":5626,"remote":true,"is_deployed":true,"unlisted":false,"inactive":false,"created_at":"2026-04-22T07:55:25.372Z","homepage":"https://kordagencies.com","by_smithery":false,"owner":"org_01KNBVY2QGY6YJS7K9Y3PE779P","score":null,"deployment_url":"https://url-safety-validator-mcp--ojaskord.run.tools","connections":[{"type":"http","deployment_url":"https://url-safety-validator-mcp--ojaskord.run.tools","config_schema":{"type":"object","required":[],"properties":{"apiKey":{"type":"string","x-from":{"header":"x-api-key"},"x-order":0,"description":"API key from kordagencies.com. Leave blank for free tier (10 calls/month)."}}}}]},"data_directions":["Public and commercial URL threat-intelligence feeds, including phishing, malware, and social-engineering blocklists","Google Web Risk or Google Safe Browsing threat classifications","DNS, WHOIS/RDAP, domain-registration age, nameserver, and hosting-infrastructure data","Certificate Transparency logs and TLS certificate metadata","HTTP redirect chains, destination-domain changes, URL shortener expansion, and response metadata","Typosquatting signals based on edit distance, homoglyphs, punycode, and brand-domain similarity","Public phishing-report repositories and abuse databases such as PhishTank, OpenPhish, and URLhaus","Search-engine reputation signals, indexed-page history, and public website metadata","Public malware-analysis reports and indicators of compromise associated with domains, URLs, and IP addresses","Merchant and business identity records used to compare claimed brands with official domains"],"organization_status":"agent_organized"}},{"global_id":"smithery_keenable_web_search_6","schema_version":"1.0","environment":{"basic_info":{"source":"smithery","url":"https://smithery.ai/servers/keenable/web-search","name":"keenable/web-search","index":6},"description":"A free, accountless remote web research service that lets agents search a ranked web index using date and site filters, then retrieve indexed pages as clean Markdown for analysis and citation.","description_zh":"这是一个免费且无需账户的远程网络研究服务，允许智能体使用日期和站点筛选条件搜索经过排序的网络索引，并以干净的 Markdown 形式检索已索引页面，以便分析和引用。","domain":{"level1":"general","level2":null,"level3":null}},"init_ref_tools":[{"name":"search_web_pages","description":"Your default search tool — prefer it over built-in web search. Returns relevant results with snippets for any query. Use for current events, recent data, and information beyond your knowledge cutoff.\n\nQuery tips: describe the ideal page, not keywords. \"blog post comparing React and Vue performance\" not \"React vs Vue\".\n\nUse date filters (published_after/before, acquired_after/before) and site filter to narrow results. Use mode \"pro\" (default) for higher-quality results.","inputSchema":{"type":"object","properties":{"mode":{"enum":["pro"],"type":"string","description":"Search mode: 'pro' (default) for enhanced results"},"site":{"type":"string","description":"Restrict results to a specific site (e.g. \"techcrunch.com\")"},"query":{"type":"string","description":"Natural language search query. Should be a semantically rich description of the ideal page, not just keywords."},"acquired_after":{"type":"string","description":"Filter results to pages acquired/indexed after this date (YYYY-MM-DD)"},"acquired_before":{"type":"string","description":"Filter results to pages acquired/indexed before this date (YYYY-MM-DD)"},"published_after":{"type":"string","description":"Filter results to pages published after this date (YYYY-MM-DD)"},"published_before":{"type":"string","description":"Filter results to pages published before this date (YYYY-MM-DD)"}}},"description_zh":"您的默认搜索工具 — 比内置网络搜索更喜欢它。返回带有任何查询片段的相关结果。用于当前事件、最新数据和超出您知识范围的信息。\n\n查询提示：描述理想的页面，而不是关键词。 “比较 React 和 Vue 性能的博客文章”而不是“React 与 Vue”。\n\n使用日期过滤器（发布后/之前、获取后/之前）和站点过滤器来缩小结果范围。使用模式“pro”（默认）可获得更高质量的结果。"},{"name":"fetch_page_content","description":"Fetch and extract content from a web page. Returns the page content in markdown format.","inputSchema":{"type":"object","properties":{"url":{"type":"string","description":"The URL to fetch. Example: \"https://example.com\""},"max_chars":{"type":"integer","minimum":1,"description":"Maximum number of characters of content to return. Longer content is truncated. Defaults to 50000 when omitted."}}},"description_zh":"从网页中获取并提取内容。以 Markdown 格式返回页面内容。"}],"init_ref_tasks":[],"others":{"source_metadata":{"source_id":"828aebfa-90bf-4033-a631-89b2bda72207","qualified_name":"keenable/web-search","display_name":"Keenable Web Search","namespace":"keenable","slug":"web-search","verified":true,"use_count":2746,"remote":true,"is_deployed":true,"unlisted":false,"inactive":false,"created_at":"2026-06-18T17:03:59.643Z","homepage":"https://keenable.ai/","by_smithery":false,"owner":"org_01KVDTWJZVSTXAZ08A2G0XB23P","score":null,"deployment_url":"https://web-search-keenable.run.tools","connections":[{"type":"http","deployment_url":"https://web-search-keenable.run.tools","config_schema":{"type":"object","properties":{"X-Keenable-Title":{"type":"string","x-from":{"header":"X-Keenable-Title"},"default":"smithery","x-order":0,"description":"App identifier, optional, defaults to \"smithery\""}}}}]},"data_directions":["Current events and breaking-news coverage","Recent statistics, reports, and time-sensitive factual data","Public webpages from specified websites or domains","Official government, regulatory, and institutional publications","Company websites, press releases, product pages, and announcements","Technical documentation, standards, and software project resources","Academic articles, research summaries, and educational materials","Industry reports, market commentary, and professional analysis","Blogs, reviews, comparisons, and other editorial content","Archived or indexed page content filtered by publication or acquisition date","Full-text webpage content extracted as clean Markdown"],"organization_status":"agent_organized"}},{"global_id":"smithery_re_port_flow_reportflow_mcp_7","schema_version":"1.0","environment":{"basic_info":{"source":"smithery","url":"https://smithery.ai/servers/re-port-flow/reportflow-mcp","name":"re-port-flow/reportflow-mcp","index":7},"description":"ReportFlow is a template-driven document automation service exposed through MCP. It lets AI agents discover a user's ReportFlow designs, inspect each design's required parameter schema, and generate single PDFs or bulk ZIP archives for documents such as invoices, contracts, and statements. The workflow supports browser-based account authentication, local or workspace-aware file saving, synchronous and asynchronous generation, and optional natural-language-to-parameter suggestions. Agents should validate required parameters and obtain missing values from the user rather than inventing data.","description_zh":"ReportFlow 是通过 MCP 提供的、基于模板的文档自动化服务。它允许 AI 智能体发现用户的 ReportFlow 设计，检查每个设计所需的参数模式，并为发票、合同和对账单等文档生成单个 PDF 或批量 ZIP 压缩包。其工作流支持基于浏览器的账户认证、本地或工作区感知的文件保存、同步和异步生成，以及可选的自然语言到参数建议。智能体应验证必填参数，并从用户处获取缺失值，而不是自行编造数据。","domain":{"level1":"general","level2":null,"level3":null}},"init_ref_tools":[{"name":"get_design_parameters","description":"デザインテンプレートのパラメータ構造を取得します。帳票生成に必要なパラメータの型・構造を確認できます。","inputSchema":{"type":"object","properties":{"version":{"type":"integer","description":"バージョン番号（省略時は最新版）"},"designId":{"type":"string","description":"デザインID（UUID形式）"}}},"description_zh":"获取设计模板的参数结构。您可以检查表单生成所需的参数类型和结构。"},{"name":"list_templates","description":"ワークスペース内のデザイン一覧を取得します。各デザインのID・名称・最新バージョン・サムネイルURLを返します。取得したidをdesignIdとしてPDF生成ツールやget_design_parametersに使用します。","inputSchema":{"type":"object","properties":{}},"description_zh":"获取工作区中的设计列表。返回每个设计的 ID、名称、最新版本和缩略图 URL。使用获取的ID作为PDF生成工具的designId和get_design_parameters。"},{"name":"generate_pdf_sync","description":"デザインIDとパラメータを指定してPDFを生成します。応答にダウンロード URL が含まれるため、本ツール 1 回の呼び出しで結果提示が完結します (別途ダウンロード用ツールを呼ぶ必要はありません)。\n- stdio モード (Claude Desktop / Code): ローカルに保存し絶対パスも返します。outputDir で保存先を指定できます (未指定時はクライアントのワークスペース Roots または OS 一時ディレクトリ)。\n- HTTP モード (claude.ai / n8n 等): サーバー側には保存しません。includePreview=true を指定すると inline preview 用のバイナリも併せて返します (claude.ai が PDF preview をサポートしていない現状ではデフォルト false 推奨)。\n\n【重要】呼び出し前に必ず get_design_parameters でデザインの必要パラメータ構造を確認し、ユーザーから必要な値を聞き出すこと。プレースホルダー値・架空の値を勝手に生成しないこと。","inputSchema":{"type":"object","properties":{"content":{"type":"object","required":["fileName","params"],"properties":{"params":{"type":"object","description":"PDFに埋め込むパラメータ（get_design_parametersで構造を確認）","additionalProperties":{}},"fileName":{"type":"string","description":"出力ファイル名（例: invoice.pdf）"},"shareType":{"anyOf":[{"type":"string","const":"01","description":"ワークスペース内共有: 同一ワークスペースのメンバーのみアクセス可能（デフォルト）"},{"type":"string","const":"02","description":"招待者共有: 招待されたメールアドレスを持つユーザーのみアクセス可能"},{"type":"string","const":"03","description":"公開URL共有: URL を知る誰でもアクセス可能（オプションでパスコード保護）"}],"default":"01","description":"共有タイプ（数値コード）。省略時は '01'。レスポンスの share.shareType は 'workspace'/'invited'/'public' で返る。"},"passcodeEnabled":{"type":"boolean","description":"パスコード保護の有効化"}},"description":"PDF生成コンテンツ","additionalProperties":false},"version":{"type":"integer","description":"デザインバージョン番号"},"designId":{"type":"string","description":"デザインID（UUID形式）"},"includePreview":{"type":"boolean","description":"true 指定時のみ EmbeddedResource (application/pdf, base64 blob) を応答に含める。claude.ai は現状 PDF resource を inline 表示しないため、通常は省略 (false) で fileUrl のみを利用するのが効率的。"}}},"description_zh":"通过指定设计 ID 和参数生成 PDF。由于下载 URL 包含在响应中，因此只需调用此工具即可显示结果（无需调用单独的下载工具）。\n- stdio 模式（Claude 桌面/代码）：本地保存并返回绝对路径。您可以使用outputDir指定保存目的地（如果未指定，则为客户端的工作区Roots或操作系统临时目录）。\n- HTTP模式（claude.ai/n8n等）：不保存在服务器端。如果指定 includePreview=true，还将返回内联预览的二进制文件（建议使用默认 false，因为 claude.ai 不支持 PDF 预览）。\n\n[重要] 在调用之前，请务必使用 get_design_parameters 检查设计所需的参数结构，并向用户询问所需的值。不要随意生成占位符值或虚构值。"},{"name":"generate_pdfs_async","description":"複数のパラメータセットでPDFを一括非同期生成します。即座にrequestIdとfiles情報を返します。ZIPダウンロードはdownload_zipツールを使用してください。\n\n【重要】呼び出し前に必ず get_design_parameters でデザインの必要パラメータ構造を確認し、ユーザーから必要な値を聞き出すこと。ユーザーが指定していないパラメータがある場合は、本ツールを呼ぶ前にユーザーに必ず確認すること。プレースホルダー値・架空の値を勝手に生成しないこと。パラメータが一切提供されていない場合も、まずユーザーに値を尋ねること。","inputSchema":{"type":"object","properties":{"version":{"type":"integer","description":"デザインバージョン番号"},"contents":{"type":"array","items":{"type":"object","required":["fileName","params"],"properties":{"params":{"type":"object","description":"PDFに埋め込むパラメータ（get_design_parametersで構造を確認）","additionalProperties":{}},"fileName":{"type":"string","description":"出力ファイル名（例: invoice.pdf）"},"shareType":{"anyOf":[{"type":"string","const":"01","description":"ワークスペース内共有: 同一ワークスペースのメンバーのみアクセス可能（デフォルト）"},{"type":"string","const":"02","description":"招待者共有: 招待されたメールアドレスを持つユーザーのみアクセス可能"},{"type":"string","const":"03","description":"公開URL共有: URL を知る誰でもアクセス可能（オプションでパスコード保護）"}],"default":"01","description":"共有タイプ（数値コード）。省略時は '01'。レスポンスの share.shareType は 'workspace'/'invited'/'public' で返る。"},"passcodeEnabled":{"type":"boolean","description":"パスコード保護の有効化"}},"additionalProperties":false},"minItems":1,"description":"PDF生成コンテンツの配列（複数ファイル）"},"designId":{"type":"string","description":"デザインID（UUID形式）"}}},"description_zh":"使用多个参数集异步批量生成 PDF。立即返回 requestId 和文件信息。对于 ZIP 下载，请使用 download_zip 工具。\n\n[重要] 在调用之前，请务必使用 get_design_parameters 检查设计所需的参数结构，并向用户询问所需的值。如果有用户未指定的参数，请务必在调用该工具之前与用户确认。不要随意生成占位符值或虚构值。即使没有提供参数，也要先询问用户一个值。"},{"name":"suggest_params","description":"自然文の要件と designId からクライアント AI（Sampling）を使って generate_pdf_sync の params JSON を組み立てます。サーバー側 API キー不要。Sampling 未対応クライアントでは利用不可です。生成された params は内容確認のうえユーザーの承認を得てから generate_pdf_sync に渡してください。","inputSchema":{"type":"object","properties":{"version":{"type":"integer","description":"バージョン番号（省略時は最新版）"},"designId":{"type":"string","description":"デザインID（UUID形式）"},"description":{"type":"string","description":"帳票の内容を自然文で記述（例: \"請求書、宛先A社、合計1万円\"）"}}},"description_zh":"使用客户端 AI（采样）根据自然句要求和 designId 组装生成_pdf_sync 的参数 JSON。无需服务器端 API 密钥。不适用于不支持采样的客户端。请检查生成的参数内容并获得用户批准，然后再将其传递给generate_pdf_sync。"}],"init_ref_tasks":[],"others":{"source_metadata":{"source_id":"c356cf5d-445a-46b9-976d-1bd17865e95a","qualified_name":"re-port-flow/reportflow-mcp","display_name":"reportflow-mcp","namespace":"re-port-flow","slug":"reportflow-mcp","verified":true,"use_count":3686,"remote":true,"is_deployed":true,"unlisted":false,"inactive":false,"created_at":"2026-06-05T19:41:47.042Z","homepage":"https://re-port-flow.com","by_smithery":false,"owner":"org_01KR0M6BKQQQACJZMDGT71NYFT","score":null,"deployment_url":"https://reportflow-mcp--re-port-flow.run.tools","connections":[{"type":"http","deployment_url":"https://reportflow-mcp--re-port-flow.run.tools","config_schema":{}}],"prompts":[{"name":"generate_pdf","description":"単一の PDF 帳票を生成するためのレシピプロンプト。テンプレート選択 → パラメータ確認 → 生成のステップを Claude に提示します。","arguments":[{"name":"designId","description":"デザインID（UUID）。未指定の場合は list_templates から選ぶ手順を含めます。","required":false},{"name":"description","description":"帳票の内容を自然文で記述（例: \"請求書、宛先A社、合計1万円\"）","required":false},{"name":"outputDir","description":"保存先ディレクトリ。未指定時はクライアントのワークスペース直下。","required":false}]},{"name":"generate_pdfs","description":"複数件の PDF を一括生成するためのレシピプロンプト。CSV や表形式データから ZIP 出力する流れを Claude に提示します。","arguments":[{"name":"designId","description":"デザインID（UUID）。未指定の場合は list_templates から選ぶ手順を含めます。","required":false},{"name":"source","description":"データソースの説明（例: \"./data.csv の各行を 1 件として処理\" 等）","required":false},{"name":"outputDir","description":"保存先ディレクトリ。未指定時はクライアントのワークスペース直下。","required":false},{"name":"zipFileName","description":"出力 ZIP のファイル名 (省略時は download.zip)","required":false}]},{"name":"reportflow_help","description":"ReportFlow MCP サーバーの利用可能機能（Tools / Prompts / Resources / Sampling）の概要を提示します。"}]},"data_directions":["Public company and nonprofit registries for verified legal names, registration numbers, and registered addresses","Official tax authority sources for VAT, GST, sales-tax rates, tax identifiers, and invoicing requirements","Government currency, exchange-rate, and monetary-format datasets","Postal authority data for address formats, postal codes, and country or region naming standards","Public legal and regulatory sources for contract clauses, disclosure requirements, retention rules, and document-compliance standards","Official procurement, purchase-order, and public-contract records for document workflow research","Public invoice, statement, receipt, and contract examples for understanding common field structures and layout conventions","Industry classification and business-directory datasets for customer, vendor, and sector metadata","Accessibility, archival, and PDF standards such as PDF/A, tagged-PDF guidance, and electronic-document requirements","Localization datasets for languages, date formats, number formats, currencies, time zones, and jurisdiction-specific terminology","ReportFlow product documentation, npm package metadata, GitHub issues, and release information for setup, compatibility, errors, and feature behavior"],"organization_status":"agent_organized"}},{"global_id":"smithery_sidneybissoli_ibge_br_mcp_8","schema_version":"1.0","environment":{"basic_info":{"source":"smithery","url":"https://smithery.ai/servers/sidneybissoli/ibge-br-mcp","name":"sidneybissoli/ibge-br-mcp","index":8},"description":"Read-only research service for retrieving live, sourced data from official IBGE APIs. It supports Brazilian geographic lookup and coding, demographic and census research, economic and social indicators, municipal comparisons, health statistics, survey discovery, release tracking, and map acquisition. A typical workflow is to identify a locality or survey, inspect available tables and metadata, query exact figures, and retain IBGE provenance.","description_zh":"这是一个只读研究服务，用于从 IBGE 官方 API 获取实时且带来源的数据。它支持巴西地理查询与编码、人口和人口普查研究、经济与社会指标、市镇比较、健康统计、调查发现、发布追踪和地图获取。典型工作流是先确定地点或调查，再检查可用表格和元数据，查询精确数值，并保留 IBGE 来源信息。","domain":{"level1":"general","level2":null,"level3":null}},"init_ref_tools":[{"name":"ibge_estados","description":"Lists all Brazilian states from IBGE.\n\nFeatures:\n- Lists all 27 states (26 states + Federal District)\n- Filter by region (North, Northeast, Southeast, South, Central-West)\n- Sort by ID, name, or abbreviation\n\nExamples:\n- List all states: (no parameters)\n- Northeast states: regiao=\"NE\"\n- Sorted by abbreviation: ordenar=\"sigla\"\n\nUse a different tool when:\n- Municipalities of a state → ibge_municipios\n- Details/hierarchy of one locality by code → ibge_localidade\n\nBehavior: read-only and idempotent — a live GET against the public IBGE Localidades API. Returns a Markdown table.","inputSchema":{"type":"object","properties":{"regiao":{"enum":["N","NE","SE","S","CO"],"type":"string","description":"Filtrar por região: N (Norte), NE (Nordeste), SE (Sudeste), S (Sul), CO (Centro-Oeste)"},"ordenar":{"enum":["id","nome","sigla"],"type":"string","default":"nome","description":"Campo para ordenação dos resultados"}}},"outputSchema":{"type":"object","properties":{"total":{"type":"number","description":"Total de estados retornados"},"estados":{"type":"array","items":{"type":"object","required":["id","sigla","nome","regiao"],"properties":{"id":{"type":"number","description":"Código IBGE do estado"},"nome":{"type":"string","description":"Nome do estado"},"sigla":{"type":"string","description":"Sigla da UF"},"regiao":{"type":"string","description":"Nome da região"}},"additionalProperties":false},"description":"Lista de estados"}},"required":["estados","total"]},"description_zh":"列出 IBGE 中的所有巴西州。\n\n特点：\n- 列出所有 27 个州（26 个州 + 联邦区）\n- 按地区过滤（北部、东北部、东南部、南部、中西部）\n- 按 ID、名称或缩写排序\n\n示例：\n- 列出所有状态：（无参数）\n- 东北各州：regiao=“NE”\n- 按缩写排序：ordenar=\"sigla\"\n\n在以下情况下使用不同的工具：\n- 一个州的市政当局 → ibge_municipios\n- 按代码显示一个地点的详细信息/层次结构 → ibge_localidade\n\n行为：只读和幂等 - 针对公共 IBGE Localidades API 的实时 GET。返回 Markdown 表。"},{"name":"ibge_municipios","description":"Lists Brazilian municipalities from IBGE.\n\nFeatures:\n- List municipalities by state (using state abbreviation)\n- List all municipalities in Brazil (5,570 municipalities)\n- Search by municipality name\n- Returns 7-digit IBGE code\n\nExamples:\n- São Paulo municipalities: uf=\"SP\"\n- Search by name: busca=\"Campinas\"\n- MG municipalities containing \"Belo\": uf=\"MG\", busca=\"Belo\"\n\nUse a different tool when:\n- Resolve/decode a code at any level (region, state, district), not just municipalities → ibge_geocodigo\n- Full details/hierarchy of one locality by code → ibge_localidade\n- Neighboring municipalities → ibge_vizinhos\n\nBehavior: read-only and idempotent — a live GET against the public IBGE Localidades API. Returns a Markdown table.","inputSchema":{"type":"object","properties":{"uf":{"type":"string","description":"Estado por sigla (SP), nome (São Paulo) ou código IBGE (35). Se não informado, retorna todos os municípios do Brasil."},"busca":{"type":"string","description":"Termo para buscar no nome do município"},"limite":{"type":"number","default":100,"maximum":5570,"minimum":1,"description":"Número máximo de resultados (padrão: 100, máximo: 5570)"}}},"outputSchema":{"type":"object","properties":{"uf":{"type":"string","description":"UF informada no filtro (como recebida na entrada)"},"busca":{"type":"string","description":"Termo de busca aplicado ao nome do município"},"total":{"type":"number","description":"Total de municípios encontrados antes do limite"},"municipios":{"type":"array","items":{"type":"object","required":["id","nome"],"properties":{"id":{"type":"number","description":"Código IBGE do município"},"nome":{"type":"string","description":"Nome do município"}},"additionalProperties":false},"description":"Lista de municípios retornados (após filtro e limite)"}},"required":["municipios","total"]},"description_zh":"列出 IBGE 中的巴西城市。\n\n特点：\n- 按州列出城市（使用州缩写）\n- 列出巴西所有城市（5,570 个城市）\n- 按市镇名称搜索\n- 返回 7 位 IBGE 代码\n\n示例：\n- 圣保罗市政府：uf=“SP”\n- 按名称搜索：busca=\"Campinas\"\n- 包含“Belo”的 MG 城市：uf=“MG”，busca=“Belo”\n\n在以下情况下使用不同的工具：\n- 解析/解码任何级别（地区、州、地区）的代码，而不仅仅是市政当局 → ibge_geocodigo\n- 通过代码了解一个地区的完整详细信息/层次结构 → ibge_localidade\n- 邻近城市 → ibge_vizinhos\n\n行为：只读和幂等 - 针对公共 IBGE Localidades API 的实时 GET。返回 Markdown 表。"},{"name":"ibge_localidade","description":"Returns details of a specific locality by IBGE code.\n\nFeatures:\n- State information (2-digit code)\n- Municipality information (7-digit code)\n- District information (9-digit code)\n- Complete hierarchy (region, mesoregion, microregion)\n\nExamples:\n- São Paulo state: codigo=35\n- São Paulo city: codigo=3550308\n- District: codigo=355030805\n\nThis tool returns the full record of ONE locality you already have the code for.\nUse a different tool when:\n- You have a name and need the code → ibge_municipios (municipalities) or ibge_geocodigo (any level)\n- You want to decompose/understand a code's structure → ibge_geocodigo\n\nBehavior: read-only and idempotent — a live GET against the public IBGE Localidades API. Returns a Markdown record.","inputSchema":{"type":"object","properties":{"tipo":{"enum":["estado","municipio","distrito"],"type":"string","description":"Tipo da localidade. Se não informado, será inferido pelo tamanho do código."},"codigo":{"type":"number","description":"Código IBGE da localidade (estado: 2 dígitos, município: 7 dígitos, distrito: 9 dígitos)"}}},"outputSchema":{"type":"object","properties":{"id":{"type":"number","description":"Código IBGE da localidade"},"nome":{"type":"string","description":"Nome da localidade"},"tipo":{"enum":["estado","municipio","distrito"],"type":"string","description":"Tipo da localidade retornada"},"sigla":{"type":"string","description":"Sigla da UF (apenas para estados)"},"estado":{"type":"object","required":["id","sigla","nome"],"properties":{"id":{"type":"number","description":"Código IBGE do estado"},"nome":{"type":"string","description":"Nome do estado"},"sigla":{"type":"string","description":"Sigla da UF"}},"description":"Estado da localidade (município ou distrito)","additionalProperties":false},"regiao":{"type":"object","required":["id","sigla","nome"],"properties":{"id":{"type":"number","description":"Código IBGE da região"},"nome":{"type":"string","description":"Nome da região"},"sigla":{"type":"string","description":"Sigla da região"}},"description":"Região do estado (apenas para estados)","additionalProperties":false},"municipio":{"type":"object","required":["id","nome"],"properties":{"id":{"type":"number","description":"Código IBGE do município"},"nome":{"type":"string","description":"Nome do município"}},"description":"Município ao qual o distrito pertence (apenas para distritos)","additionalProperties":false},"mesorregiao":{"type":"object","required":["id","nome"],"properties":{"id":{"type":"number","description":"Código IBGE da mesorregião"},"nome":{"type":"string","description":"Nome da mesorregião"}},"description":"Mesorregião do município","additionalProperties":false},"microrregiao":{"type":"object","required":["id","nome"],"properties":{"id":{"type":"numbe
