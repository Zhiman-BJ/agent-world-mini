n- 搜索临床测量值和生命体征\n- 查找诊断观察结果\n\n返回具有名称、组件和属性的匹配 LOINC 代码。"},{"name":"loinc_details","description":"Get detailed information about a specific LOINC code.\n\nUse this tool to:\n- Get the full name and description of a LOINC code\n- Find the component, property, timing, and system\n- Check the scale type and method\n\nProvide a LOINC number in format \"XXXXX-X\" (e.g., \"2339-0\" for Glucose).","inputSchema":{"type":"object","properties":{"loinc_num":{"type":"string","pattern":"^\\d{1,5}-\\d$","description":"LOINC number (e.g., \"2339-0\")"}}},"outputSchema":{"type":"object","properties":{"class":{"type":"string"},"status":{"type":"string"},"system":{"type":"string"},"property":{"type":"string"},"component":{"type":"string"},"loinc_num":{"type":"string"},"scale_type":{"type":"string"},"short_name":{"type":"string"},"method_type":{"type":"string"},"time_aspect":{"type":"string"},"long_common_name":{"type":"string"}},"required":["loinc_num","long_common_name","short_name","component","property","time_aspect","system","scale_type","method_type","class","status"]},"description_zh":"获取有关特定 LOINC 代码的详细信息。\n\n使用此工具可以：\n- 获取 LOINC 代码的全名和描述\n- 查找组件、属性、时序和系统\n- 检查秤类型和方法\n\n提供格式为“XXXXX-X”的 LOINC 编号（例如，“2339-0”表示葡萄糖）。"},{"name":"loinc_answers","description":"Get the list of valid answers for a LOINC questionnaire item.\n\nUse this tool to:\n- Find valid response options for survey questions\n- Get answer codes for data entry validation\n- Look up standardized answer lists\n\nOnly applicable to LOINC codes that represent questions with defined answer sets.","inputSchema":{"type":"object","properties":{"loinc_num":{"type":"string","pattern":"^\\d{1,5}-\\d$","description":"LOINC number (e.g., \"2339-0\")"}}},"outputSchema":{"type":"object","properties":{"answers":{"type":"array","items":{"type":"object","required":["sequence","answer_code","answer_string"],"properties":{"sequence":{"type":"integer"},"answer_code":{"type":"string"},"answer_string":{"type":"string"}},"additionalProperties":false}},"loinc_num":{"type":"string"}},"required":["loinc_num","answers"]},"description_zh":"获取 LOINC 调查问卷项目的有效答案列表。\n\n使用此工具可以：\n- 查找调查问题的有效回答选项\n- 获取数据输入验证的答案代码\n- 查找标准化答案列表\n\n仅适用于代表具有已定义答案集的问题的 LOINC 代码。"},{"name":"loinc_panels","description":"Get the structure of a LOINC panel or form.\n\nUse this tool to:\n- See all tests included in a panel (e.g., CBC, metabolic panel)\n- Get the structure of assessment forms\n- Find related observations grouped together\n\nReturns the list of LOINC codes that make up the panel.","inputSchema":{"type":"object","properties":{"loinc_num":{"type":"string","pattern":"^\\d{1,5}-\\d$","description":"LOINC number (e.g., \"2339-0\")"}}},"outputSchema":{"type":"object","properties":{"panel":{"anyOf":[{"type":"object","required":["loinc_num","name","items"],"properties":{"name":{"type":"string"},"items":{"type":"array","items":{"type":"object","required":["sequence","loinc_num","name","required"],"properties":{"name":{"type":"string"},"required":{"type":"boolean"},"sequence":{"type":"integer"},"loinc_num":{"type":"string"}},"additionalProperties":false}},"loinc_num":{"type":"string"}},"additionalProperties":false},{"type":"null"}]},"loinc_num":{"type":"string"}},"required":["loinc_num","panel"]},"description_zh":"获取 LOINC 面板或表单的结构。\n\n使用此工具可以：\n- 查看面板中包含的所有测试（例如 CBC、代谢面板）\n- 获取评估表的结构\n- 查找分组在一起的相关观察结果\n\n返回组成面板的 LOINC 代码列表。"},{"name":"rxnorm_search","description":"Search for drugs in RxNorm (Normalized names for clinical drugs).\n\nUse this tool to:\n- Find drug concepts by brand or generic name\n- Look up medications for prescribing\n- Search for drug formulations\n\nReturns matching drugs with RxCUI identifiers, names, and term types.","inputSchema":{"type":"object","properties":{"query":{"type":"string","minLength":1,"description":"Drug name to search (brand or generic)"},"max_results":{"type":"integer","default":25,"maximum":100,"minimum":1,"description":"Maximum number of results (1-100). Default: 25"}}},"outputSchema":{"type":"object","properties":{"drugs":{"type":"array","items":{"type":"object","required":["rxcui","name","synonym","tty","language"],"properties":{"tty":{"type":"string"},"name":{"type":"string"},"rxcui":{"type":"string"},"synonym":{"type":"string"},"language":{"type":"string"}},"additionalProperties":false}},"query":{"type":"string"},"total_count":{"type":"integer"}},"required":["query","total_count","drugs"]},"description_zh":"在 RxNorm（临床药物的标准化名称）中搜索药物。\n\n使用此工具可以：\n- 按品牌或通用名称查找药物概念\n- 查找处方药物\n- 搜索药物配方\n\n返回具有 RxCUI 标识符、名称和术语类型的匹配药物。"},{"name":"rxnorm_concept","description":"Get detailed information about a specific RxNorm concept by RxCUI.\n\nUse this tool to:\n- Get the full name and synonyms for a drug\n- Check the concept status (active, remapped, etc.)\n- View related concepts (ingredients, brands, forms)\n\nProvide an RxCUI (RxNorm Concept Unique Identifier) like \"161\".","inputSchema":{"type":"object","properties":{"rxcui":{"type":"string","pattern":"^\\d+$","description":"RxNorm Concept Unique Identifier"},"include_related":{"type":"boolean","default":false,"description":"Include related concepts (ingredients, brands, dose forms)"}}},"outputSchema":{"type":"object","properties":{"tty":{"type":"string"},"name":{"type":"string"},"rxcui":{"type":"string"},"status":{"type":"string"},"synonym":{"type":"string"},"umlscui":{"type":"string"},"language":{"type":"string"},"suppress":{"type":"string"},"remapped_to":{"type":"array","items":{"type":"string"}},"related_groups":{"anyOf":[{"type":"array","items":{"type":"object","required":["tty","concepts"],"properties":{"tty":{"type":"string"},"concepts":{"type":"array","items":{"type":"object","required":["rxcui","name","synonym","tty","language"],"properties":{"tty":{"type":"string"},"name":{"type":"string"},"rxcui":{"type":"string"},"synonym":{"type":"string"},"language":{"type":"string"}},"additionalProperties":false}}},"additionalProperties":false}},{"type":"null"}]}},"required":["rxcui","name","synonym","tty","language","suppress","umlscui","status","remapped_to","related_groups"]},"description_zh":"通过 RxCUI 获取有关特定 RxNorm 概念的详细信息。\n\n使用此工具可以：\n- 获取药物的全名和同义词\n- 检查概念状态（活动、重新映射等）\n- 查看相关概念（成分、品牌、形式）\n\n提供 RxCUI（RxNorm 概念唯一标识符），例如“161”。"},{"name":"rxnorm_ingredients","description":"Get active ingredients for a drug by RxCUI.\n\nUse this tool to:\n- Find the active ingredients in a medication\n- Check for single vs. multiple ingredient products\n- Identify the generic components of brand drugs\n\nReturns ingredient RxCUIs and names.","inputSchema":{"type":"object","properties":{"rxcui":{"type":"string","pattern":"^\\d+$","description":"RxCUI of the drug"}}},"outputSchema":{"type":"object","properties":{"rxcui":{"type":"string"},"ingredients":{"type":"array","items":{"type":"object","required":["rxcui","name","tty","is_multiple"],"properties":{"tty":{"type":"string"},"name":{"type":"string"},"rxcui":{"type":"string"},"is_multiple":{"type":"boolean"}},"additionalProperties":false}}},"required":["rxcui","ingredients"]},"description_zh":"通过 RxCUI 获取药物的活性成分。\n\n使用此工具可以：\n- 查找药物中的活性成分\n- 检查单一成分与多种成分的产品\n- 识别品牌药的通用成分\n\n返回成分 RxCUI 和名称。"},{"name":"rxnorm_classes","description":"Get therapeutic and pharmacologic classes for a drug.\n\nUse this tool to:\n- Find the drug class (e.g., \"Beta-blockers\", \"NSAIDs\")\n- Identify therapeutic categories\n- Look up mechanism of action classifications\n\nReturns class IDs, names, and classification sources.","inputSchema":{"type":"object","properties":{"rxcui":{"type":"string","pattern":"^\\d+$","description":"RxCUI of the drug"}}},"outputSchema":{"type":"object","properties":{"rxcui":{"type":"string"},"classes":{"type":"array","items":{"type":"object","required":["class_id","class_name","class_type","source"],"properties":{"source":{"type":"string"},"class_id":{"type":"string"},"class_name":{"type":"string"},"class_type":{"type":"string"}},"additionalProperties":false}}},"required":["rxcui","classes"]},"description_zh":"获取药物的治疗和药理学课程。\n\n使用此工具可以：\n- 查找药物类别（例如“β-受体阻滞剂”、“NSAID”）\n- 确定治疗类别\n- 查找作用机制分类\n\n返回类 ID、名称和分类源。"},{"name":"rxnorm_ndc","description":"Map between RxNorm concepts and National Drug Codes (NDC).\n\nUse this tool to:\n- Get all NDC codes for a drug (by RxCUI)\n- Find the RxCUI for an NDC code\n- Cross-reference between coding systems\n\nProvide either an RxCUI to get NDCs, or an NDC to get the RxCUI.","inputSchema":{"type":"object","properties":{"ndc":{"type":"string","minLength":1,"description":"NDC code to look up RxCUI (alternative to rxcui)"},"rxcui":{"type":"string","pattern":"^\\d+$","description":"RxCUI to get NDC codes for"}}},"outputSchema":{"type":"object","properties":{"ndc":{"type":["string","null"]},"ndcs":{"type":"array","items":{"type":"object","required":["ndc"],"properties":{"ndc":{"type":"string"}},"additionalProperties":false}},"rxcui":{"type":["string","null"]},"query_mode":{"enum":["ndcs_for_rxcui","rxcui_for_ndc"],"type":"string"}},"required":["query_mode","rxcui","ndc","ndcs"]},"description_zh":"RxNorm 概念与国家药品法规 (NDC) 之间的映射。\n\n使用此工具可以：\n- 获取药物的所有 NDC 代码（由 RxCUI 提供）\n- 查找 NDC 代码的 RxCUI\n- 编码系统之间的交叉引用\n\n提供 RxCUI 以获取 NDC，或提供 NDC 以获取 RxCUI。"},{"name":"mesh_search","description":"Search for MeSH (Medical Subject Headings) descriptors.\n\nUse this tool to:\n- Find MeSH terms for indexing medical literature\n- Look up subject headings for PubMed searches\n- Find controlled vocabulary terms\n\nReturns matching descriptors with MeSH IDs and labels.","inputSchema":{"type":"object","properties":{"match":{"enum":["exact","contains","startswith"],"type":"string","default":"contains","description":"Match type: exact, contains, or startswith. Default: contains"},"query":{"type":"string","minLength":1,"description":"Search term (e.g., \"diabetes\", \"heart failure\")"},"language":{"enum":["en","es","pt","fr","de","it","zh","ja","ar","ru"],"type":"string","default":"en","description":"Language code (default: en)"},"max_results":{"type":"integer","default":25,"maximum":100,"minimum":1,"description":"Maximum number of results (1-100). Default: 25"}}},"outputSchema":{"type":"object","properties":{"match":{"enum":["exact","contains","startswith"],"type":"string"},"query":{"type":"string"},"descriptors":{"type":"array","items":{"type":"object","required":["id","uri","label"],"properties":{"id":{"type":"string"},"uri":{"type":"string"},"label":{"type":"string"}},"additionalProperties":false}},"total_count":{"type":"integer"}},"required":["query","match","total_count","descriptors"]},"description_zh":"搜索 MeSH（医学主题词）描述符。\n\n使用此工具可以：\n- 查找用于索引医学文献的 MeSH 术语\n- 查找 PubMed 搜索的主题词\n- 查找受控词汇术语\n\n返回具有 MeSH ID 和标签的匹配描述符。"},{"name":"mesh_descriptor","description":"Get detailed information about a MeSH descriptor by ID.\n\nUse this tool to:\n- Get the full definition (scope note) of a MeSH term\n- View tree numbers showing hierarchy location\n- See related concepts and synonyms\n\nProvide a MeSH Descriptor ID like \"D015242\" (Ofloxacin).","inputSchema":{"type":"object","properties":{"mesh_id":{"type":"string","pattern":"^D\\d+$","description":"MeSH Descriptor ID (e.g., D015242, D003920)"},"language":{"enum":["en","es","pt","fr","de","it","zh","ja","ar","ru"],"type":"string","default":"en","description":"Language code (default: en)"}}},"outputSchema":{"type":"object","properties":{"id":{"type":"string"},"uri":{"type":"string"},"label":{"type":"string"},"concepts":{"type":"array","items":{"type":"object","required":["uri","label","is_preferred","terms"],"properties":{"uri":{"type":"string"},"label":{"type":"string"},"terms":{"type":"array","items":{"type":"string"}},"is_preferred":{"type":"boolean"}},"additionalProperties":false}},"qualifiers":{"type":"array","items":{"type":"object","required":["id","uri","label"],"properties":{"id":{"type":"string"},"uri":{"type":"string"},"label":{"type":"string"}},"additionalProperties":false}},"scope_note":{"type":"string"},"tree_numbers":{"type":"array","items":{"type":"object","required":["tree_number","uri"],"properties":{"uri":{"type":"string"},"tree_number":{"type":"string"}},"additionalProperties":false}}},"required":["id","uri","label","scope_note","tree_numbers","concepts","qualifiers"]},"description_zh":"通过 ID 获取有关 MeSH 描述符的详细信息。\n\n使用此工具可以：\n- 获取 MeSH 术语的完整定义（范围注释）\n- 查看显示层次结构位置的树编号\n- 查看相关概念和同义词\n\n提供 MeSH 描述符 ID，例如“D015242”（氧氟沙星）。"},{"name":"mesh_tree","description":"Get the tree hierarchy location(s) for a MeSH descriptor.\n\nUse this tool to:\n- See where a term fits in the MeSH hierarchy\n- Understand broader/narrower relationships\n- Find related terms in the same branch\n\nMeSH tree numbers show the hierarchical path (e.g., C14.280.647 for Myocardial Infarction).","inputSchema":{"type":"object","properties":{"mesh_id":{"type":"string","pattern":"^D\\d+$","description":"MeSH Descriptor ID (e.g., D015242, D003920)"}}},"outputSchema":{"type":"object","properties":{"mesh_id":{"type":"string"},"tree_numbers":{"type":"array","items":{"type":"object","required":["tree_number","uri"],"properties":{"uri":{"type":"string"},"tree_number":{"type":"string"}},"additionalProperties":false}}},"required":["mesh_id","tree_numbers"]},"description_zh":"获取 MeSH 描述符的树层次结构位置。\n\n使用此工具可以：\n- 查看术语在 MeSH 层次结构中的位置\n- 了解更广泛/更狭窄的关系\n- 在同一分支中查找相关术语\n\nMeSH 树编号显示分层路径（例如，C14.280.647 表示心肌梗塞）。"},{"name":"mesh_qualifiers","description":"Get allowed qualifiers (subheadings) for a MeSH descriptor.\n\nUse this tool to:\n- Find which qualifiers can be combined with a descriptor\n- Build precise MeSH search queries\n- Understand aspects that can be specified\n\nQualifiers refine descriptors (e.g., \"Diabetes Mellitus/drug therapy\").","inputSchema":{"type":"object","properties":{"mesh_id":{"type":"string","pattern":"^D\\d+$","description":"MeSH Descriptor ID (e.g., D015242, D003920)"}}},"outputSchema":{"type":"object","properties":{"mesh_id":{"type":"string"},"qualifiers":{"type":"array","items":{"type":"object","required":["id","uri","label"],"properties":{"id":{"type":"string"},"uri":{"type":"string"},"label":{"type":"string"}},"additionalProperties":false}}},"required":["mesh_id","qualifiers"]},"description_zh":"获取 MeSH 描述符允许的限定符（副标题）。\n\n使用此工具可以：\n- 查找哪些限定符可以与描述符组合\n- 构建精确的 MeSH 搜索查询\n- 了解可以指定的方面\n\n限定词细化描述符（例如“糖尿病/药物治疗”）。"},{"name":"map_icd10_to_icd11","description":"Authoritative ICD-10 → ICD-11 mapping using WHO transition tables (release 2025-01, bundled with the server).\n\nReturns the primary 1:1 ICD-11 category for the ICD-10 code plus any alternative ICD-11 candidates that WHO documents (some ICD-10 concepts split into multiple ICD-11 entities). For each mapping, includes the ICD-11 code, title, chapter, and the Foundation URI / Linearization URI for navigating to the full entity definition.\n\nUse this for clinical coding, billing migration, retrospective analysis, and any workflow that needs authoritative mapping rather than text-search candidates. Coverage: 11,243 ICD-10 categories (excludes chapters and blocks like \"A00-A09\" which aren't used in clinical coding).\n\nProvide a code like \"E11\" (Type 2 diabetes), \"I21\" (Acute MI), or \"A07.8\" (4 alternatives in WHO's table). Both dotted (\"A07.8\") and undotted (\"A078\") forms are accepted.\n\nReturns \"no mapping\" when the code isn't in the WHO category-level table — that's the honest answer rather than a fuzzy search fallback.","inputSchema":{"type":"object","properties":{"icd10_code":{"type":"string","minLength":1,"description":"ICD-10 code to query in the ICD-11 search index (e.g., E11, I21.0, J18.9)"}}},"outputSchema":{"type":"object","properties":{"found":{"type":"boolean","description":"Whether the code is in the WHO ICD-10 → ICD-11 transition table."},"icd10":{"anyOf":[{"type":"object","required":["code","title","chapter","depth"],"properties":{"code":{"type":"string"},"depth":{"type":"integer"},"title":{"type":"string"},"chapter":{"type":"string"}},"additionalProperties":false},{"type":"null"}],"description":"Source ICD-10 entry from the WHO table. Null when found=false."},"query":{"type":"string","description":"The ICD-10 code as submitted (raw, before normalization)."},"source":{"type":"object","required":["publisher","version","release_date"],"properties":{"version":{"type":"string","description":"Transition table release identifier (e.g. \"2025-01\")."},"publisher":{"type":"string","description":"Authoritative publisher (e.g. \"WHO\")."},"release_date":{"type":"string","description":"ISO date string for the release."}},"additionalProperties":false},"primary":{"anyOf":[{"type":"object","required":["code","title","chapter","foundationUri","linearizationUri","classKind","depth"],"properties":{"code":{"type":"string"},"depth":{"type":"integer"},"title":{"type":"string"},"chapter":{"type":"string"},"classKind":{"type":"string"},"foundationUri":{"type":"string"},"linearizationUri":{"type":"string"}},"additionalProperties":false},{"type":"null"}],"description":"Primary 1:1 ICD-11 mapping. Null when found=false."},"alternatives":{"type":"array","items":{"type":"object","required":["code","title","chapter","foundationUri","linearizationUri","classKind","depth"],"properties":{"code":{"type":"string"},"depth":{"type":"integer"},"title":{"type":"string"},"chapter":{"type":"string"},"classKind":{"type":"string"},"foundationUri":{"type":"string"},"linearizationUri":{"type":"string"}},"additionalProperties":false},"description":"Additional ICD-11 candidates WHO documents for this ICD-10 code. Empty when the primary is the only documented mapping (or when found=false). 1,461 of the 11,243 indexed codes have non-empty alternatives."}},"required":["query","found","icd10","primary","alternatives","source"]},"description_zh":"使用 WHO 转换表的权威 ICD-10 → ICD-11 映射（2025-01 版，与服务器捆绑）。\n\n返回 ICD-10 代码的主要 1:1 ICD-11 类别以及 WHO 记录的任何替代 ICD-11 候选类别（某些 ICD-10 概念分为多个 ICD-11 实体）。对于每个映射，包括 ICD-11 代码、标题、章节和用于导航到完整实体定义的基础 URI/线性化 URI。\n\n将此用于临床编码、计费迁移、回顾性分析以及任何需要权威映射而不是文本搜索候选的工作流程。覆盖范围：11,243 个 ICD-10 类别（不包括临床编码中未使用的章节和块，例如“A00-A09”）。\n\n提供诸如“E11”（2 型糖尿病）、“I21”（急性心肌梗死）或“A07.8”（WHO 表中的 4 个替代项）之类的代码。带点（“A07.8”）和不带点（“A078”）形式均可接受。\n\n当代码不在 WHO 类别级表中时，返回“无映射”——这是诚实的答案，而不是模糊搜索后备。"},{"name":"map_loinc_to_snomed","description":"This tool looks up a LOINC code in NLM Clinical Tables and returns guidance on where to obtain a LOINC → SNOMED CT mapping. It does not perform the mapping.\n\nDirect LOINC → SNOMED CT mappings are not freely available via API. UMLS Metathesaurus contains the relationships but requires an individual UMLS Terminology Services license; the LOINC SNOMED CT Expression Association is published by Regenstrief Institute as part of the LOINC release and requires authenticated download from loinc.org under the LOINC license.\n\nFor programmatic LOINC → SNOMED mapping, use UMLS or the LOINC Expression Association files. For interactive lookup, use the SNOMED CT browser available to your organization or the Regenstrief RELMA desktop tool.\n\nProvide a LOINC code like \"2339-0\" (Glucose) or \"718-7\" (Hemoglobin).","inputSchema":{"type":"object","properties":{"loinc_code":{"type":"string","pattern":"^\\d{1,5}-\\d$","description":"LOINC code (e.g., 2339-0 for Glucose)"}}},"outputSchema":{"type":"object","properties":{"status":{"enum":["guidance-only"],"type":"string","description":"Always \"guidance-only\" — direct LOINC → SNOMED CT mappings require licensed sources (UMLS Metathesaurus or LOINC SNOMED CT Expression Association). This tool returns pointers, not the mapping itself."},"guidance":{"type":"string","description":"Short human-readable explanation of why this tool returns guidance instead of a mapping."},"loinc_code":{"type":"string","description":"The LOINC code as submitted."},"loinc_details":{"anyOf":[{"type":"object","required":["code","long_common_name","component","system","property"],"properties":{"code":{"type":"string"},"system":{"type":["string","null"]},"property":{"type":["string","null"]},"component":{"type":["string","null"]},"long_common_name":{"type":["string","null"]}},"additionalProperties":false},{"type":"null"}],"description":"NLM Clinical Tables details for the LOINC code (component, system, property, etc.). Null when the code was not found upstream."},"mapping_sources":{"type":"array","items":{"type":"object","required":["name","description","url"],"properties":{"url":{"type":["string","null"]},"name":{"type":"string"},"description":{"type":"string"}},"additionalProperties":false},"description":"Structured list of authoritative LOINC → SNOMED CT mapping sources (UMLS Metathesaurus, LOINC SNOMED CT Expression Association, Regenstrief RELMA)."}},"required":["loinc_code","loinc_details","status","guidance","mapping_sources"]},"description_zh":"该工具在 NLM 临床表中查找 LOINC 代码，并返回有关在何处获取 LOINC → SNOMED CT 映射的指导。它不执行映射。\n\n直接 LOINC → SNOMED CT 映射不能通过 API 免费获得。 UMLS Metathesaurus 包含关系，但需要单独的 UMLS 术语服务许可证； LOINC SNOMED CT 表达协会由 Regenstrief Institute 作为 LOINC 版本的一部分发布，需要根据 LOINC 许可证从 loinc.org 进行经过身份验证的下载。\n\n对于编程 LOINC → SNOMED 映射，请使用 UMLS 或 LOINC 表达式关联文件。对于交互式查找，请使用您的组织可用的 SNOMED CT 浏览器或 Regenstrief RELMA 桌面工具。\n\n提供 LOINC 代码，如“2339-0”（葡萄糖）或“718-7”（血红蛋白）。"},{"name":"validate_codes","description":"Validate a mixed batch of medical codes against their source terminologies. Useful for retrospective analysis of legacy databases — flag codes that no longer exist, surface ICD-10 → ICD-11 replacements, and grade activity status where the terminology exposes it.\n\nFor each input `{ code, terminology }`, returns:\n- **valid**: whether the code exists in the source terminology.\n- **active**: whether the code is currently active. Null when the source doesn't expose an explicit active/inactive distinction at category level (CID-10, ATC, ICD-11, RxNorm, MeSH all return null today; SNOMED and LOINC return a real boolean).\n- **title**: the official label/name when available.\n- **replaced_by**: a successor code, populated today only for ICD-10 codes that have a primary ICD-11 mapping in the bundled WHO transition tables.\n- **source**: human-readable provenance of the validation (terminology + release/version).\n- **error**: non-null only when validation couldn't be performed (network error, SNOMED feature flag off, etc.). `valid: false` + `error: null` means \"code not found\"; `valid: false` + `error: set` means \"couldn't validate\".\n\nTerminology is **required per code** — auto-detection isn't supported because category codes like \"A00\" exist in both ICD-10 and CID-10. Accepted values: `icd11`, `icd10`, `snomed`, `loinc`, `rxnorm`, `mesh`, `atc`, `cid10`.\n\nHard cap of 50 codes per call; codes are validated in parallel through their respective clients, so total wall time scales with the slowest upstream + its rate limit (worst case ~10 s for a full batch hitting ICD-11).","inputSchema":{"type":"object","properties":{"codes":{"type":"array","items":{"type":"object","required":["code","terminology"],"properties":{"code":{"type":"string","minLength":1,"description":"The code to validate (raw, as it appears in your data)."},"terminology":{"enum":["icd11","icd10","snomed","loinc","rxnorm","mesh","atc","cid10"],"type":"string","description":"Which terminology this code belongs to. Required — auto-detection isn't supported because category-level codes like \"A00\" exist in both ICD-10 and CID-10."}},"additionalProperties":false},"maxItems":50,"minItems":1,"description":"List of code+terminology pairs to validate. Hard cap of 50 per call to keep total latency under ~10 s given upstream rate limits."}}},"outputSchema":{"type":"object","properties":{"total":{"type":"integer","description":"Number of codes submitted."},"results":{"type":"array","items":{"type":"object","required":["code","terminology","valid","active","title","replaced_by","source","error"],"properties":{"code":{"type":"string","description":"The code as submitted."},"error":{"type":["string","null"],"description":"When the upstream call failed (timeout, server error, feature flag off), this holds the failure message. Distinct from valid=false: valid=false + error=null means \"code not found\"; valid=false + error set means \"couldn't validate\"."},"title":{"type":["string","null"],"description":"Official label/title for the code, when available."},"valid":{"type":"boolean","description":"True when the upstream API or bundled dataset confirms the code exists."},"active":{"type":["boolean","null"],"description":"Whether the code is currently active. Null when the source terminology doesn't expose an explicit active/inactive distinction at the category level (e.g. CID-10, ATC)."},"source":{"type":"string","description":"Human-readable identifier of the data source used for validation (terminology + release/version where applicable)."},"replaced_by":{"type":["string","null"],"description":"When the code has been superseded by another code, this holds the replacement. Populated today only for ICD-10 codes that have a primary ICD-11 mapping in the bundled WHO transition tables; null otherwise."},"terminology":{"enum":["icd11","icd10","snomed","loinc","rxnorm","mesh","atc","cid10"],"type":"string"}},"additionalProperties":false}},"error_count":{"type":"integer","description":"How many couldn't be validated due to upstream/network errors."},"valid_count":{"type":"integer","description":"How many were confirmed valid."},"invalid_count":{"type":"integer","description":"How many were not found."}},"required":["total","valid_count","invalid_count","error_count","results"]},"description_zh":"根据源术语验证混合批次的医疗代码。对于遗留数据库的回顾性分析非常有用 - 不再存在的标记代码、表面 ICD-10 → ICD-11 替换以及术语公开的活动状态等级。\n\n对于每个输入 `{ code, terminology }`，返回：\n- **有效**：代码是否存在于源术语中。\n- **活动**：代码当前是否处于活动状态。当源未在类别级别公开明确的活动/非活动区别时为 Null（CID-10、ATC、ICD-11、RxNorm、MeSH 今天均返回 null；SNOMED 和 LOINC 返回真正的布尔值）。\n- **标题**：官方标签/名称（如果有）。\n- **replaced_by**：后继代码，今天仅针对在捆绑的 WHO 转换表中具有主要 ICD-11 映射的 ICD-10 代码填充。\n- **来源**：人类可读的验证来源（术语+发布/版本）。\n- **错误**：仅当无法执行验证时才为非空（网络错误、SNOMED 功能标志关闭等）。 `valid: false` + `error: null` 表示“未找到代码”； `valid: false` + `error: set` 表示“无法验证”。\n\n**每个代码都需要术语** — 不支持自动检测，因为 ICD-10 和 CID-10 中都存在“A00”等类别代码。接受的值：“icd11”、“icd10”、“snomed”、“loinc”、“rxnorm”、“mesh”、“atc”、“cid10”。\n\n每次调用 50 个代码的硬上限；代码通过各自的客户端并行验证，因此总墙时间与最慢的上游+其速率限制（最坏情况约为 10 秒，完整批次命中 ICD-11）。"},{"name":"find_equivalent","description":"Search for equivalent terms across multiple medical terminologies.\n\nUse this tool to:\n- Find the same concept in different coding systems\n- Compare how terminologies represent a concept\n- Support terminology mapping and data integration\n\nSearches across: ICD-11, SNOMED CT, LOINC, RxNorm, and MeSH. Set `target_terminologies` to limit which are searched, or set `source_terminology` to exclude one (e.g. when you already have a code from that terminology and want equivalents elsewhere). The two combine: source is subtracted from targets.","inputSchema":{"type":"object","properties":{"term":{"type":"string","minLength":1,"description":"Medical term to search (e.g., \"diabetes\", \"aspirin\")"},"source_terminology":{"enum":["icd11","snomed","loinc","rxnorm","mesh"],"type":"string","description":"If set, this terminology is excluded from the search. Use this when the term came from this terminology and you want equivalents in the others. Combines with target_terminologies by subtraction (source is removed from the target list)."},"target_terminologies":{"type":"array","items":{"enum":["icd11","snomed","loinc","rxnorm","mesh"],"type":"string"},"description":"Limit the search to these terminologies. If omitted, all five are searched."}}},"outputSchema":{"type":"object","properties":{"term":{"type":"string"},"results":{"type":"object","properties":{"mesh":{"type":"object","required":["found","error","items"],"properties":{"error":{"type":["string","null"]},"found":{"type":"boolean"},"items":{"type":"array","items":{"type":"object","required":["code","title"],"properties":{"code":{"type":"string"},"title":{"type":"string"}},"additionalProperties":false}}},"additionalProperties":false},"icd11":{"type":"object","required":["found","error","items"],"properties":{"error":{"type":["string","null"]},"found":{"type":"boolean"},"items":{"type":"array","items":{"type":"object","required":["code","title"],"properties":{"code":{"type":"string"},"title":{"type":"string"}},"additionalProperties":false}}},"additionalProperties":false},"loinc":{"type":"object","required":["found","error","items"],"properties":{"error":{"type":["string","null"]},"found":{"type":"boolean"},"items":{"type":"array","items":{"type":"object","required":["code","title"],"properties":{"code":{"type":"string"},"title":{"type":"string"}},"additionalProperties":false}}},"additionalProperties":false},"rxnorm":{"type":"object","required":["found","error","items"],"properties":{"error":{"type":["string","null"]},"found":{"type":"boolean"},"items":{"type":"array","items":{"type":"object","required":["code","title"],"properties":{"code":{"type":"string"},"title":{"type":"string"}},"additionalProperties":false}}},"additionalProperties":false},"snomed":{"type":"object","required":["found","error","items"],"properties":{"error":{"type":["string","null"]},"found":{"type":"boolean"},"items":{"type":"array","items":{"type":"object","required":["code","title"],"properties":{"code":{"type":"string"},"title":{"type":"string"}},"additionalProperties":false}}},"additionalProperties":false}},"additionalProperties":false},"source_terminology":{"anyOf":[{"enum":["icd11","snomed","loinc","rxnorm","mesh"],"type":"string"},{"type":"null"}]},"searched_terminologies":{"type":"array","items":{"enum":["icd11","snomed","loinc","rxnorm","mesh"],"type":"string"}}},"required":["term","source_terminology","searched_terminologies","results"]},"description_zh":"搜索多个医学术语中的等效术语。\n\n使用此工具可以：\n- 在不同的编码系统中找到相同的概念\n- 比较术语如何表示概念\n- 支持术语映射和数据集成\n\n搜索范围：ICD-11、SNOMED CT、LOINC、RxNorm 和 MeSH。设置“target_terminologies”来限制搜索的术语，或设置“source_terminology”来排除一个术语（例如，当您已经拥有该术语的代码并希望在其他地方找到等效项时）。两者结合起来：从目标中减去源。"},{"name":"atc_classify","description":"Look up the WHO ATC (Anatomical Therapeutic Chemical) classification(s) for a drug by name.\n\nUse this tool to:\n- Find the ATC code for a medication (e.g., \"metformin\" → A10BA02)\n- Identify the therapeutic and pharmacological class hierarchy\n- Cross-reference drugs with their international ATC codes\n\nReturns one entry per ATC code the drug belongs to. A single-ingredient drug typically maps to one substance-level code; combination products map to multiple. ATC codes are international (WHO Collaborating Centre); this tool retrieves them via NLM RxClass.","inputSchema":{"type":"object","properties":{"drug_name":{"type":"string","minLength":1,"description":"Drug name to classify (brand or generic, e.g., \"metformin\")"}}},"outputSchema":{"type":"object","properties":{"matches":{"type":"array","items":{"type":"object","required":["rxcui","drug_name","tty","atc_code","atc_name","atc_level_type"],"properties":{"tty":{"type":"string"},"rxcui":{"type":"string"},"atc_code":{"type":"string"},"atc_name":{"type":"string"},"drug_name":{"type":"string"},"atc_level_type":{"type":"string"}},"additionalProperties":false}},"drug_name":{"type":"string"}},"required":["drug_name","matches"]},"description_zh":"按名称查找药物的 WHO ATC（解剖治疗化学品）分类。\n\n使用此工具可以：\n- 查找药物的 ATC 代码（例如“二甲双胍”→ A10BA02）\n- 确定治疗和药理学类别层次结构\n- 药品与其国际 ATC 代码的交叉引用\n\n根据药物所属的 ATC 代码返回一个条目。单一成分药物通常映射到一个物质级代码；组合产品映射到多个。 ATC 代码是国际代码（世界卫生组织合作中心）；该工具通过 NLM RxClass 检索它们。"},{"name":"atc_lookup","description":"Look up an ATC code at level 1-4 to get its name and hierarchy level.\n\nUse this tool to:\n- Resolve an ATC code (e.g., \"A10BA\") to its class name (\"Biguanides\")\n- Confirm a code exists in the current ATC index\n- Identify the level (anatomical / therapeutic / pharmacological / chemical)\n\nAccepts codes 1-5 characters long: \"A\" (anatomical), \"A10\" (therapeutic), \"A10B\" (pharmacological), \"A10BA\" (chemical). Substance-level codes (7 chars, e.g., \"A10BA02\") are not exposed by this endpoint — use atc_classify with the drug name to retrieve the substance code.","inputSchema":{"type":"object","properties":{"atc_code":{"type":"string","pattern":"^[A-V](\\d{2}([A-Z]([A-Z](\\d{2})?)?)?)?$","description":"ATC code at level 1-4 (1-5 chars). Substance-level codes (7 chars, e.g., A10BA02) are not exposed by this endpoint — use atc_classify with the drug name instead."}}},"outputSchema":{"type":"object","properties":{"found":{"type":"boolean"},"details":{"anyOf":[{"type":"object","required":["atc_code","atc_name","atc_level_type"],"properties":{"atc_code":{"type":"string"},"atc_name":{"type":"string"},"atc_level_type":{"type":"string"}},"additionalProperties":false},{"type":"null"}]},"atc_code":{"type":"string"}},"required":["atc_code","found","details"]},"description_zh":"在 1-4 级查找 ATC 代码以获取其名称和层次结构级别。\n\n使用此工具可以：\n- 将 ATC 代码（例如“A10BA”）解析为其类别名称（“Biguanides”）\n- 确认当前ATC索引中存在代码\n- 确定水平（解剖/治疗/药理学/化学）\n\n接受长度为 1-5 个字符的代码：“A”（解剖学）、“A10”（治疗学）、“A10B”（药理学）、“A10BA”（化学）。此端点不会公开物质级代码（7 个字符，例如“A10BA02”） — 使用 atc_classify 和药物名称来检索物质代码。"},{"name":"atc_members","description":"List the drugs (substances) that belong to an ATC class.\n\nUse this tool to:\n- Enumerate all members of a therapeutic class (e.g., \"A10BA\" → metformin, phenformin)\n- Build a list of drugs sharing a pharmacological mechanism\n- Explore an ATC subtree at any level\n\nEach member includes its substance-level (7-char) ATC code via source_atc_code, useful for disambiguation when the queried class is at level 1-4. RxNorm's catalog is US-centric; the ATC class names and codes themselves are international.","inputSchema":{"type":"object","properties":{"atc_code":{"type":"string","pattern":"^[A-V](\\d{2}([A-Z]([A-Z](\\d{2})?)?)?)?$","description":"ATC code at any level. Higher levels (1-4) return all member substances; level 5 returns the single substance."}}},"outputSchema":{"type":"object","properties":{"members":{"type":"array","items":{"type":"object","required":["rxcui","name","tty","source_atc_code"],"properties":{"tty":{"type":"string"},"name":{"type":"string"},"rxcui":{"type":"string"},"source_atc_code":{"type":"string"}},"additionalProperties":false}},"atc_code":{"type":"string"}},"required":["atc_code","members"]},"description_zh":"列出属于 ATC 类别的药物（物质）。\n\n使用此工具可以：\n- 列举治疗类别的所有成员（例如，“A10BA”→ 二甲双胍、苯乙双胍）\n- 建立共享药理机制的药物清单\n- 探索任意级别的 ATC 子树\n\n每个成员都通过 source_atc_code 包含其物质级别（7 个字符）ATC 代码，当查询的类别处于级别 1-4 时，这对于消除歧义很有用。 RxNorm 的目录以美国为中心； ATC 类别名称和代码本身是国际性的。"},{"name":"cid10_search","description":"Search the Brazilian CID-10 (Classificação Estatística Internacional de Doenças, 10ª Revisão) by Portuguese text.\n\nUse this tool to:\n- Find CID-10 codes for Brazilian SUS / ANVISA contexts (\"infarto\", \"diabetes\", \"tuberculose\")\n- Look up the official Portuguese (CBCD/USP) translation of a clinical term\n- Locate codes for billing, epidemiology, and clinical documentation in Brazil\n\nReturns matches from CID-10 categories (3-char) and/or subcategories (4-char). Search is diacritic-insensitive: typing \"infeccoes\" matches \"infecções\". This tool searches the Brazilian Portuguese CID-10 V2008 — for the international ICD-11 (current WHO revision, in English by default), use icd11_search.","inputSchema":{"type":"object","properties":{"level":{"enum":["categories","subcategories","all"],"type":"string","default":"all","description":"Restrict search to 3-char categories, 4-char subcategories, or both. Default: all"},"query":{"type":"string","minLength":2,"description":"Search term in Portuguese (e.g., \"diabetes\", \"infarto\", \"tuberculose\")"},"max_results":{"type":"integer","default":25,"maximum":100,"minimum":1,"description":"Maximum number of results (1-100). Default: 25"}}},"outputSchema":{"type":"object","properties":{"hits":{"type":"array","items":{"type":"object","required":["level","code","display","classif","title","title_short","refer","excluidos","restr_sexo","causa_obito","chapter_num","group_range"],"properties":{"code":{"type":"string"},"level":{"enum":["category","subcategory"],"type":"string"},"refer":{"type":"string"},"title":{"type":"string"},"classif":{"type":"string"},"display":{"type":"string"},"excluidos":{"type":"string"},"restr_sexo":{"type":"string"},"causa_obito":{"type":"string"},"chapter_num":{"anyOf":[{"type":"integer"},{"type":"null"}]},"group_range":{"type":["string","null"]},"title_short":{"type":"string"}},"additionalProperties":false}},"level":{"enum":["categories","subcategories","all"],"type":"string"},"query":{"type":"string"},"shown_count":{"type":"integer"},"total_count":{"type":"integer"}},"required":["query","level","total_count","shown_count","hits"]},"description_zh":"通过葡萄牙语文本搜索巴西 CID-10 (Classificação Estatística Internacional de Doenças, 10ª Revisão)。\n\n使用此工具可以：\n- 查找巴西 SUS / ANVISA 上下文的 CID-10 代码（“infarto”、“diabetes”、“tuberculose”）\n- 查找临床术语的官方葡萄牙语 (CBCD/USP) 翻译\n- 查找巴西的账单、流行病学和临床文档代码\n\n返回 CID-10 类别（3 个字符）和/或子类别（4 个字符）的匹配项。搜索不区分变音符号：输入“infeccoes”会匹配“infecções”。此工具搜索巴西葡萄牙语 CID-10 V2008 — 对于国际 ICD-11（当前 WHO 修订版，默认为英文），请使用 icd11_search。"},{"name":"cid10_lookup","description":"Look up a specific CID-10 code and return its Portuguese name.\n\nUse this tool to:\n- Resolve a code to its Brazilian description (\"I21\" → \"Infarto agudo do miocárdio\")\n- Confirm a 3-char category or 4-char subcategory exists in CID-10\n- Retrieve gender / cause-of-death restriction flags when applicable\n\nAccepts both dotted (\"A00.1\") and undotted (\"A001\") forms; returns the canonical display.","inputSchema":{"type":"object","properties":{"code":{"type":"string","pattern":"^[A-Z]\\d{2}(\\.?\\d)?$","description":"CID-10 code (e.g., \"A00\", \"A00.1\", \"A001\", \"I21\"). Dotted and undotted forms both accepted."}}},"outputSchema":{"type":"object","properties":{"hit":{"anyOf":[{"type":"object","required":["level","code","display","classif","title","title_short","refer","excluidos","restr_sexo","causa_obito","chapter_num","group_range"],"properties":{"code":{"type":"string"},"level":{"enum":["category","subcategory"],"type":"string"},"refer":{"type":"string"},"title":{"type":"string"},"classif":{"type":"string"},"display":{"type":"string"},"excluidos":{"type":"string"},"restr_sexo":{"type":"string"},"causa_obito":{"type":"string"},"chapter_num":{"anyOf":[{"type":"integer"},{"type":"null"}]},"group_range":{"type":["string","null"]},"title_short":{"type":"string"}},"additionalProperties":false},{"type":"null"}]},"code":{"type":"string"},"found":{"type":"boolean"}},"required":["code","found","hit"]},"description_zh":"查找特定的 CID-10 代码并返回其葡萄牙语名称。\n\n使用此工具可以：\n- 将代码解析为其巴西描述（“I21”→“Infarto agudo do miocárdio”）\n- 确认 CID-10 中存在 3 字符类别或 4 字符子类别\n- 在适用时检索性别/死因限制标志\n\n接受点式（“A00.1”）和非点式（“A001”）形式；返回规范显示。"},{"name":"cid10_chapters","description":"List the 22 chapters of CID-10 with their code ranges and Portuguese titles.\n\nUse this tool to:\n- See the top-level structure of CID-10 (chapters I-XXII, e.g., \"I. Algumas doenças infecciosas e parasitárias\", \"IX. Doenças do aparelho circulatório\")\n- Map a code to its chapter by code range (e.g., I00-I99 → chapter IX)\n- Build a navigable table of contents for downstream tooling\n\nReturns 22 entries — CID-10 V2008 has not been updated since 2008.","inputSchema":{"type":"object","properties":{}},"outputSchema":{"type":"object","properties":{"chapters":{"type":"array","items":{"type":"object","required":["num","code_start","code_end","title","title_short"],"properties":{"num":{"type":"integer"},"title":{"type":"string"},"code_end":{"type":"string"},"code_start":{"type":"string"},"title_short":{"type":"string"}},"additionalProperties":false}}},"required":["chapters"]},"description_zh":"列出 CID-10 的 22 个章节及其代码范围和葡萄牙语标题。\n\n使用此工具可以：\n- 参见 CID-10 的顶层结构（第 I-XXII 章，例如“I. Algumas doenças infecciosas e parasitárias”、“IX. Doenças do aparelho circulatório”）\n- 按代码范围将代码映射到其章节（例如，I00-I99 → 第九章）\n- 为下游工具构建可导航的目录\n\n返回 22 个条目 — CID-10 V2008 自 2008 年以来未更新。"},{"name":"cid10_chapter","description":"Get one CID-10 chapter and its constituent groups (e.g., \"Chapter IX → I00-I02 Febre reumática aguda, I05-I09 Doenças reumáticas crônicas do coração, ...\").\n\nUse this tool to:\n- Drill from a chapter into its groups\n- Build hierarchical browsers\n- Find which group contains a code range\n\nProvide a chapter number (1-22).","inputSchema":{"type":"object","properties":{"num":{"type":"integer","maximum":22,"minimum":1,"description":"Chapter number (1-22). CID-10 V2008 has 22 chapters."}}},"outputSchema":{"type":"object","properties":{"num":{"type":"integer"},"found":{"type":"boolean"},"groups":{"type":"array","items":{"type":"object","required":["code_start","code_end","title","title_short"],"properties":{"title":{"type":"string"},"code_end":{"type":"string"},"code_start":{"type":"string"},"title_short":{"type":"string"}},"additionalProperties":false}},"chapter":{"anyOf":[{"type":"object","required":["num","code_start","code_end","title","title_short"],"properties":{"num":{"type":"integer"},"title":{"type":"string"},"code_end":{"type":"string"},"code_start":{"type":"string"},"title_short":{"type":"string"}},"additionalProperties":false},{"type":"null"}]}},"required":["num","found","chapter","groups"]},"description_zh":"获取 ICD-10 的一章及其组成组（例如，“第九章 → I00-I02 急性风湿热、I05-I09 慢性风湿性心脏病……”）。\n\n使用此工具可以：\n- 从章节钻取到其组\n- 构建分层浏览器\n- 查找哪个组包含代码范围\n\n提供章节编号 (1-22)。"},{"name":"terminology_versions","description":"List the current version, release date, publisher, source URL, and update cadence of every terminology this server queries against.\n\nUseful for pipeline maintainers who need to:\n- Confirm which release of ICD-11 / SNOMED / LOINC / RxNorm / MeSH / ATC the server is querying before a batch run.\n- Verify the bundled CID-10 (frozen at V2008) and ICD-10 → ICD-11 transition tables (currently 2025-01) match expectations.\n- Cite the data version in research artifacts.\n\nPass `terminology` to filter to a single entry; otherwise the full set of 8 is returned. The ICD-10 → ICD-11 version reads live from the bundled dataset; everything else is metadata maintained alongside the project release.","inputSchema":{"type":"object","properties":{"terminology":{"enum":["icd11","icd10","snomed","loinc","rxnorm","mesh","atc","cid10"],"type":"string","description":"Filter to a single terminology. Omit to return all 8."}}},"outputSchema":{"type":"object","properties":{"total":{"type":"integer"},"generated":{"type":"string","description":"Date this snapshot was generated."},"terminologies":{"type":"array","items":{"type":"object","required":["code","name","full_name","publisher","current_version","release_date","source_url","changelog_url","update_cadence","bundled_in_server","notes"],"properties":{"code":{"enum":["icd11","icd10","snomed","loinc","rxnorm","mesh","atc","cid10"],"type":"string"},"name":{"type":"string"},"notes":{"type":["string","null"]},"full_name":{"type":"string"},"publisher":{"type":"string"},"source_url":{"type":"string"},"release_date":{"type":"string"},"changelog_url":{"type":["string","null"]},"update_cadence":{"type":"string"},"current_version":{"type":"string"},"bundled_in_server":{"type":"boolean"}},"additionalProperties":false}}},"required":["generated","total","terminologies"]},"description_zh":"列出此服务器查询的每个术语的当前版本、发布日期、发布者、源 URL 和更新节奏。\n\n对于需要执行以下操作的管道维护人员很有用：\n- 在批量运行之前确认服务器正在查询 ICD-11 / SNOMED / LOINC / RxNorm / MeSH / ATC 的哪个版本。\n- 验证捆绑的 CID-10（冻结于 V2008）和 ICD-10 → ICD-11 转换表（当前为 2025 年 1 月）是否符合预期。\n- 引用研究工件中的数据版本。\n\n通过 `terminology` 过滤到单个条目；否则返回全套 8 个。 ICD-10 → ICD-11 版本从捆绑数据集中实时读取；其他所有内容都是与项目发布一起维护的元数据。"},{"name":"terminology_diff","description":"Report what diff data is available between two versions of a terminology.\n\nFor most terminologies this is **guidance only** — the server doesn't ship historical snapshots, so the tool points at the publisher's official changelog and explains the cadence. `bundled_versions` lists the version(s) this server actually has on hand.\n\nFor **ICD-10 vs ICD-11** specifically, the tool surfaces a real cross-revision summary from the bundled WHO transition tables (the ICD-10 → ICD-11 case is a structural diff between two WHO revisions). Use `terminology: \"icd10\"` with no `to_version` to get the cross-revision summary: total mapped ICD-10 categories, how many are 1:1 vs split into multiple ICD-11 codes, and the average number of alternatives when split.\n\nInputs:\n- `terminology` (required): which terminology to report on.\n- `from_version` (optional): the version you have data from. If omitted, the tool reports against the currently-bundled version.\n- `to_version` (optional): the version you want to compare to. If omitted, the tool reports against the publisher's latest known release.\n\nThis tool is intentionally a metadata + guidance layer, not a diff engine — for terminologies that change frequently (SNOMED, LOINC, RxNorm, MeSH), the publisher's official changelog is the authoritative source.","inputSchema":{"type":"object","properties":{"to_version":{"type":"string","description":"Version you want to compare to. Optional."},"terminology":{"enum":["icd11","icd10","snomed","loinc","rxnorm","mesh","atc","cid10"],"type":"string","description":"Which terminology to report on."},"from_version":{"type":"string","description":"Version you have data from. Optional; behavior depends on terminology."}}},"outputSchema":{"type":"object","properties":{"message":{"type":"string"},"to_version":{"type":["string","null"]},"terminology":{"enum":["icd11","icd10","snomed","loinc","rxnorm","mesh","atc","cid10"],"type":"string"},"from_version":{"type":["string","null"]},"changelog_url":{"type":["string","null"]},"diff_available":{"type":"boolean","description":"True when this server has the data to compute a real diff for the requested terminology. False = guidance-only response."},"bundled_versions":{"type":"array","items":{"type":"string"}},"cross_revision_summary":{"anyOf":[{"type":"object","required":["icd10_categories_total","one_to_one_mappings","one_to_many_splits","avg_alternatives_when_split"],"properties":{"one_to_many_splits":{"type":"integer"},"one_to_one_mappings":{"type":"integer"},"icd10_categories_total":{"type":"integer"},"avg_alternatives_when_split":{"type":"number"}},"additionalProperties":false},{"type":"null"}],"description":"Populated only for terminology=\"icd10\" today — the bundled WHO ICD-10 → ICD-11 transition tables let us surface a real structural diff between the two WHO revisions."}},"required":["terminology","from_version","to_version","diff_available","message","changelog_url","bundled_versions","cross_revision_summary"]},"description_zh":"报告术语的两个版本之间可用的差异数据。\n\n对于大多数术语来说，这只是**指导** - 服务器不发送历史快照，因此该工具指向发布者的官方变更日志并解释节奏。 `bundled_versions` 列出了该服务器实际拥有的版本。\n\n特别是对于 **ICD-10 与 ICD-11**，该工具显示了来自捆绑的 WHO 转换表的真实交叉修订摘要（ICD-10 → ICD-11 案例是两个 WHO 修订版之间的结构差异）。使用不带“to_version”的“terminology: \"icd10\"”来获取交叉修订摘要：映射的 ICD-10 类别总数、1:1 与拆分为多个 ICD-11 代码的数量以及拆分时的平均替代项数量。\n\n输入：\n- “术语”（必填）：要报告的术语。\n- `from_version`（可选）：您拥有数据的版本。如果省略，该工具将根据当前捆绑的版本进行报告。\n- `to_version`（可选）：您要比较的版本。如果省略，该工具将根据发布者的最新已知版本进行报告。\n\n该工具有意成为元数据+指导层，而不是差异引擎 - 对于经常更改的术语（SNOMED、LOINC、RxNorm、MeSH），发布者的官方变更日志是权威来源。"}],"init_ref_tasks":[],"others":{"source_metadata":{"source_id":"9d6a89ec-ebe0-4122-8f7e-35f07112127f","qualified_name":"sidneybissoli/medical-terminologies-mcp","display_name":"Medical Terminologies MCP","namespace":"sidneybissoli","slug":"medical-terminologies-mcp","verified":true,"use_count":3111,"remote":true,"is_deployed":true,"unlisted":false,"inactive":false,"created_at":"2026-05-10T19:40:51.978Z","homepage":"https://medical.sidneybissoli.com/mcp","by_smithery":false,"owner":"org_01KNBTYWT7TPCV541JA7YZWX69","score":null,"deployment_url":"https://medical-terminologies-mcp--sidneybissoli.run.tools","connections":[{"type":"http","deployment_url":"https://medical-terminologies-mcp--sidneybissoli.run.tools","config_schema":{}}],"prompts":[{"name":"find-medical-code","description":"Search a clinical condition, symptom, or medical term across all available terminologies (ICD-11, LOINC, RxNorm, MeSH, ATC, CID-10) in parallel and synthesize the matches with their codes and source terminology.","arguments":[{"name":"condition","description":"The condition, symptom, or medical term to search for.","required":true},{"name":"language","description":"Preferred language hint — \"en\" or \"pt-BR\". When \"pt-BR\", CID-10 results are prioritized. Defaults to \"en\".","required":false}]},{"name":"drug-info","description":"Compile comprehensive information about a drug — normalized name, RxCUI, active ingredients, therapeutic classes, and WHO ATC classification — by composing RxNorm and ATC tool calls.","arguments":[{"name":"drug_name","description":"The drug name (brand or generic) to look up. Approximate matches are accepted.","required":true}]},{"name":"cid10-portuguese-lookup","description":"Procura um termo médico em português no CID-10 brasileiro (DataSUS V2008), com contexto de capítulo e descrição clínica. Searches a Portuguese medical term in the Brazilian CID-10 with chapter context.","arguments":[{"name":"term","description":"Termo médico em português a ser pesquisado (ex.: \"infecções respiratórias\", \"diabetes\"). Busca é insensível a acentos.","required":true}]}],"resources":[{"name":"Server info","uri":"info://server","description":"Version, tool count, supported terminologies, and feature-flag state. Useful for LLMs to ground answers about server capabilities.","mimeType":"application/json"},{"name":"CID-10 chapters","uri":"info://cid10/chapters","description":"List of the 22 CID-10 chapters (Brazilian Portuguese ICD-10, DataSUS V2008) with code ranges and Portuguese descriptions. Source: bundled CID-10 dataset.","mimeType":"application/json"},{"name":"Terminology licenses","uri":"info://licenses","description":"Per-terminology license disclaimers and access requirements. Important for downstream redistribution decisions and for surfacing license constraints in LLM answers.","mimeType":"text/markdown"},{"name":"Usage stats (hosted endpoint)","uri":"info://stats","description":"Per-tool invocation counts and total successful dispatches recorded by the hosted Cloudflare Workers endpoint. Excludes local stdio installs (those have no shared counter by design). Useful for adoption signal — see top_tool to know which terminology is pulling the most demand.","mimeType":"application/json"}]},"data_directions":["WHO ICD-11 public terminology data: disease entities, MMS codes, titles, definitions, synonyms, exclusions, hierarchy, chapters, foundation URIs, linearization URIs, and postcoordination axes.","WHO ICD-10-to-ICD-11 transition tables: primary and alternative mappings, split concepts, chapter assignments, and migration metadata.","Brazilian CID-10 V2008 data from official Brazilian classification sources: Portuguese category and subcategory labels, chapters, groups, code ranges, and restriction flags.","LOINC releases and public terminology services: laboratory tests, clinical observations, panel structures, answer lists, components, properties, timing, systems, scales, and methods.","RxNorm and related NLM datasets: RxCUIs, normalized drug names, brands, ingredients, dose forms, concept status, relationships, therapeutic classes, and NDC cross-references.","MeSH public releases: descriptors, scope notes, synonyms, tree numbers, related concepts, and permitted qualifiers for biomedical literature indexing.","WHO ATC classification data and compatible drug catalogs: anatomical, therapeutic, pharmacological, chemical, and substance-level classifications and class membership.","SNOMED CT concepts and relationships where licensing permits, including descriptions, identifiers, hierarchy, and equivalence candidates; availability may vary by jurisdiction.","NLM Clinical Tables and UMLS documentation for terminology discovery and mapping guidance; UMLS Metathesaurus mappings require an individual UMLS Terminology Services license.","LOINC–SNOMED CT Expression Association files distributed through authenticated LOINC releases for authorized direct mappings.","Official terminology release notes, version metadata, update schedules, source URLs, deprecation records, remapping notices, and publisher changelogs.","Public NDC directories and drug-label datasets for package-code validation and linkage to normalized RxNorm medication concepts.","Mixed-code datasets from clinical, billing, epidemiological, registry, and retrospective research systems for validity checks, activity-status review, replacement discovery, and migration analysis."],"organization_status":"agent_organized"}}]; 
const esc = value => String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const summary = document.getElementById('summary');
const host = document.getElementById('seeds');
const toolCount = seeds.reduce((n, seed) => n + seed.init_ref_tools.length, 0);
summary.textContent = '共 ' + seeds.length + ' 个环境，' + toolCount + ' 个参考工具；原文与中文描述并列展示。';
for (const seed of seeds) {
  const env = seed.environment;
  const info = env.basic_info;
  const tools = seed.init_ref_tools;
  const toolItems = tools.map(tool => '<li><code>' + esc(tool.name) + '</code>：' + esc(tool.description_zh || tool.description) + '<br><span class="original">' + esc(tool.description) + '</span></li>').join('');
  const article = document.createElement('article');
  const level2 = env.domain.level2 ? ' / ' + esc(env.domain.level2) : '';
  const level3 = env.domain.level3 ? ' / ' + esc(env.domain.level3) : '';
  article.innerHTML = '<h2>' + esc(info.index) + '. ' + esc(info.name) + '</h2>' +
    '<p class="meta"><a href="' + esc(info.url) + '" target="_blank" rel="noopener">' + esc(info.url) + '</a><br>分类：' + esc(env.domain.level1) + level2 + level3 + '</p>' +
    '<div class="label">中文描述</div><p class="description">' + esc(env.description_zh) + '</p>' +
    '<div class="label">原始描述</div><p class="description original">' + esc(env.description) + '</p>' +
    '<details><summary>查看参考工具（' + tools.length + '）</summary><ul>' + (toolItems || '<li>来源未提供参考工具</li>') + '</ul></details>';
  host.appendChild(article);
}
