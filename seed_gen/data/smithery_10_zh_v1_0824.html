r","description":"Código IBGE da microrregião"},"nome":{"type":"string","description":"Nome da microrregião"}},"description":"Microrregião do município","additionalProperties":false},"regiaoImediata":{"type":"object","required":["id","nome"],"properties":{"id":{"type":"number","description":"Código IBGE da região imediata"},"nome":{"type":"string","description":"Nome da região imediata"}},"description":"Região imediata do município","additionalProperties":false},"regiaoIntermediaria":{"type":"object","required":["id","nome"],"properties":{"id":{"type":"number","description":"Código IBGE da região intermediária"},"nome":{"type":"string","description":"Nome da região intermediária"}},"description":"Região intermediária do município","additionalProperties":false}},"required":["tipo","id","nome"]},"description_zh":"通过 IBGE 代码返回特定地点的详细信息。\n\n特点：\n- 状态信息（2位代码）\n- 市政府信息（7 位代码）\n- 地区信息（9位代码）\n- 完整的层次结构（区域、中观区域、微区域）\n\n示例：\n- 圣保罗州：codigo=35\n- 圣保罗市：codigo=3550308\n- 区：codigo=355030805\n\n该工具会返回您已拥有代码的一个地点的完整记录。\n在以下情况下使用不同的工具：\n- 您有姓名并需要代码 → ibge_municipios（市政）或 ibge_geocodigo（任何级别）\n- 您想要分解/理解代码的结构 → ibge_geocodigo\n\n行为：只读和幂等 - 针对公共 IBGE Localidades API 的实时 GET。返回 Markdown 记录。"},{"name":"ibge_populacao","description":"Returns real-time Brazilian population projection.\n\nFeatures:\n- Current population estimate\n- Birth rate (average time between births)\n- Death rate (average time between deaths)\n- Daily population increment\n\nSource: IBGE - Brazilian Population Projection\n\nThis tool ONLY returns Brazil's real-time national projection.\n\nUse a different tool when:\n- Population of a specific municipality/state → ibge_cidades (panorama)\n- Census or historical population → ibge_censo\n- Comparing/ranking multiple localities → ibge_comparar\n- Population time series → ibge_indicadores\n- An arbitrary SIDRA table → ibge_sidra\n\nBehavior: read-only and idempotent — a live GET against the public IBGE population-projection API. Returns Markdown plus a typed structuredContent payload.","inputSchema":{"type":"object","properties":{"localidade":{"enum":["BR"],"type":"string","default":"BR","description":"Localidade para projeção populacional (atualmente apenas BR disponível)"}}},"outputSchema":{"type":"object","properties":{"horario":{"type":"string","description":"Data/hora da consulta"},"populacao":{"type":"number","description":"População projetada (habitantes)"},"localidade":{"type":"string","description":"Localidade da projeção"},"periodoMedio":{"type":"object","required":["incrementoPopulacional","nascimento","obito"],"properties":{"obito":{"type":"number","description":"Segundos entre óbitos"},"nascimento":{"type":"number","description":"Segundos entre nascimentos"},"incrementoPopulacional":{"type":"number","description":"Incremento populacional por dia"}},"description":"Indicadores do período médio","additionalProperties":false}},"required":["localidade","horario","populacao","periodoMedio"]},"description_zh":"返回实时巴西人口预测。\n\n特点：\n- 当前人口估计\n- 出生率（平均生育间隔时间）\n- 死亡率（死亡之间的平均时间）\n- 每日人口增量\n\n资料来源：IBGE - 巴西人口预测\n\n该工具仅返回巴西的实时国家预测。\n\n在以下情况下使用不同的工具：\n- 特定市/州的人口→ ibge_cidades（全景）\n- 人口普查或历史人口 → ibge_censo\n- 比较/排名多个地点 → ibge_comparar\n- 人口时间序列 → ibge_indicadores\n- 任意 SIDRA 表 → ibge_sidra\n\n行为：只读且幂等 - 针对公共 IBGE 人口预测 API 的实时 GET。返回 Markdown 加上类型化的 StructuredContent 有效负载。"},{"name":"ibge_sidra","description":"Queries SIDRA tables (IBGE's Automatic Recovery System).\n\nSIDRA contains data from IBGE surveys like Census, PNAD, GDP, etc.\n\nCommon tables:\n- 6579: Population estimates (annual)\n- 9514: Census 2022 population\n- 200: Census population (1970-2010)\n- 4714: Unemployment rate (PNAD Contínua)\n- 6381: Average income (PNAD Contínua)\n- 6706: GDP at current prices\n- 5938: GDP per capita\n\nTerritorial levels:\n- 1: Brazil\n- 2: Region (North, Northeast, etc.)\n- 3: State (UF)\n- 6: Municipality\n- 7: Metropolitan Region\n\nExamples:\n- Brazil population 2023: tabela=\"6579\", periodos=\"2023\"\n- Population by state: tabela=\"6579\", nivel_territorial=\"3\"\n- Census 2022 by municipality: tabela=\"9514\", nivel_territorial=\"6\", localidades=\"3550308\"\n\nibge_sidra is the low-level engine. Prefer a friendlier wrapper when it fits:\n- Census themes (1970–2022) → ibge_censo\n- Economic/social time series → ibge_indicadores\n- Rank/compare 2–10 localities → ibge_comparar\n- One municipality's panel → ibge_cidades\nUse ibge_sidra_tabelas and ibge_sidra_metadados to find a table code and its structure before querying.\n\nBehavior: read-only and idempotent — a live GET against the public IBGE SIDRA API. Returns Markdown plus a typed structuredContent payload.","inputSchema":{"type":"object","properties":{"campos":{"type":"string","description":"Selecionar apenas algumas colunas por rótulo, separadas por vírgula (ex: 'Valor,Ano'). Reduz o volume da resposta. Omitir traz todas."},"pagina":{"type":"integer","default":1,"minimum":1,"description":"Página de resultados (100 registros por página)"},"tabela":{"type":"string","description":"Código da tabela SIDRA (ex: 6579 para estimativas de população, 9514 para censo 2022)"},"formato":{"enum":["json","tabela"],"type":"string","default":"tabela","description":"Formato de saída: 'json' para dados brutos ou 'tabela' para formato legível"},"periodos":{"type":"string","default":"last","description":"Períodos: 'last' para último, 'all' para todos, ou anos específicos (ex: 2020,2021,2022)"},"variaveis":{"type":"string","default":"allxp","description":"IDs das variáveis separados por vírgula, ou 'allxp' para todas"},"localidades":{"type":"string","default":"all","description":"Códigos das localidades separados por vírgula, ou 'all' para todas"},"classificacoes":{"type":"string","description":"Classificações no formato 'id[categorias]' (ex: '2[6794]' para sexo masculino)"},"nivel_territorial":{"type":"string","default":"1","description":"Nível territorial (código N): 1=Brasil, 2=Região, 3=UF, 6=Município, 7=Região Metropolitana, 8=Mesorregião, 9=Microrregião, 10=Distrito, 11=Subdistrito, 13=RM/RIDE, 14=RIDE, 15=Aglomeração Urbana, 17=Região Geográfica Imediata, 18=Região Geográfica Intermediária, 105=Macrorregião de Saúde, 106=Região de Saúde, 114=Aglomerado Subnormal, 127=Amazônia Legal, 128=Semiárido"}}},"outputSchema":{"type":"object","properties":{"nome":{"type":"string","description":"Nome da tabela (quando conhecido)"},"tabela":{"type":"string","description":"Código da tabela SIDRA consultada"},"colunas":{"type":"array","items":{"type":"string"},"description":"Rótulos das colunas, na ordem"},"paginacao":{"type":"object","required":["pagina","porPagina","totalPaginas","temMais"],"properties":{"pagina":{"type":"number"},"temMais":{"type":"boolean"},"porPagina":{"type":"number"},"totalPaginas":{"type":"number"}},"description":"Metadados de paginação para continuação","additionalProperties":false},"registros":{"type":"array","items":{"type":"object","additionalProperties":{"type":"string"}},"description":"Registros da página atual: cada um mapeia rótulo da coluna -\u003e valor"},"totalRegistros":{"type":"number","description":"Total de registros de dados disponíveis (todas as páginas)"}},"required":["tabela","nome","totalRegistros","colunas","registros","paginacao"]},"description_zh":"查询 SIDRA 表（IBGE 的自动恢复系统）。\n\nSIDRA 包含来自 IBGE 调查的数据，例如人口普查、PNAD、GDP 等。\n\n常用表：\n- 6579：人口估计（每年）\n- 9514：2022 年人口普查人口\n- 200：人口普查人口（1970-2010）\n- 4714：失业率（PNAD Continua）\n- 6381：平均收入 (PNAD Contínua)\n- 6706：按现价计算的GDP\n- 5938：人均国内生产总值\n\n领土级别：\n- 1：巴西\n- 2：地区（北部、东北等）\n- 3：状态（UF）\n- 6：市政府\n- 7：大都市区\n\n示例：\n- 2023年巴西人口：tabela=“6579”，periodos=“2023”\n- 按州划分的人口：tabela=“6579”，nivel_territorial=“3”\n- 2022 年人口普查（按市政府）： tabela=\"9514\"、nivel_territorial=\"6\"、localidades=\"3550308\"\n\nibge_sidra 是低级引擎。更喜欢合适的包装纸：\n- 人口普查主题 (1970–2022) → ibge_censo\n- 经济/社会时间序列 → ibge_indicadores\n- 对 2–10 个地点进行排名/比较 → ibge_comparar\n- 一个市政府的小组 → ibge_cidades\n在查询之前使用 ibge_sidra_tabelas 和 ibge_sidra_metadados 查找表代码及其结构。\n\n行为：只读和幂等 - 针对公共 IBGE SIDRA API 的实时 GET。返回 Markdown 加上类型化的 StructuredContent 有效负载。"},{"name":"ibge_nomes","description":"Queries name frequency and rankings in Brazil (IBGE).\n\nFeatures:\n1. **Name frequency** (tipo='frequencia'):\n   - Birth frequency by decade\n   - Multiple names separated by comma\n   - Filter by sex and locality\n\n2. **Name ranking** (tipo='ranking'):\n   - Most popular names\n   - Filter by decade, sex, and locality\n\nAvailable decades: 1930-2010\n\nExamples:\n- Frequency of \"Maria\": tipo=\"frequencia\", nomes=\"Maria\"\n- Compare names: tipo=\"frequencia\", nomes=\"João,José,Pedro\"\n- 2000s ranking: tipo=\"ranking\", decada=2000\n- Female names: tipo=\"ranking\", sexo=\"F\"\n\nBehavior: read-only and idempotent — a live GET against the public IBGE Nomes (Censo) API. Returns a Markdown table.","inputSchema":{"type":"object","properties":{"sexo":{"enum":["M","F"],"type":"string","description":"Filtrar por sexo: M (masculino) ou F (feminino)"},"tipo":{"enum":["frequencia","ranking"],"type":"string","description":"Tipo de consulta: 'frequencia' para buscar nomes específicos ou 'ranking' para ver os mais populares"},"nomes":{"type":"string","description":"Para tipo='frequencia': Nome ou nomes separados por vírgula"},"decada":{"type":"number","description":"Para tipo='ranking': Década do ranking (ex: 1990, 2000, 2010)"},"limite":{"type":"number","default":20,"maximum":100,"minimum":1,"description":"Para tipo='ranking': Número de nomes (padrão: 20)"},"localidade":{"type":"string","description":"Código IBGE da localidade (UF: 2 dígitos, Município: 7 dígitos)"}}},"outputSchema":{"type":"object","properties":{"tipo":{"enum":["frequencia","ranking"],"type":"string","description":"Tipo da consulta realizada"},"ranking":{"type":"object","required":["localidade","itens"],"properties":{"sexo":{"type":["string","null"],"description":"Sexo do ranking: M, F ou nulo"},"itens":{"type":"array","items":{"type":"object","required":["ranking","nome","frequencia"],"properties":{"nome":{"type":"string","description":"Nome"},"ranking":{"type":"number","description":"Posição no ranking"},"frequencia":{"type":"number","description":"Frequência de registros do nome"}},"additionalProperties":false},"description":"Itens do ranking, limitados pelo parâmetro 'limite'"},"decada":{"type":"number","description":"Década do ranking, quando informada"},"localidade":{"type":"string","description":"Código IBGE da localidade (ou BR para Brasil)"}},"description":"Resultado do ranking (presente quando tipo='ranking')","additionalProperties":false},"frequencia":{"type":"array","items":{"type":"object","required":["nome","localidade","periodos","total"],"properties":{"nome":{"type":"string","description":"Nome consultado"},"sexo":{"type":["string","null"],"description":"Sexo do nome: M, F ou nulo"},"total":{"type":"number","description":"Soma das frequências de todos os períodos"},"periodos":{"type":"array","items":{"type":"object","required":["periodo","frequencia"],"properties":{"periodo":{"type":"string","description":"Período/década (ex: '1930[', '1990,2000[')"},"frequencia":{"type":"number","description":"Frequência de registros do nome no período"}},"additionalProperties":false},"description":"Frequência do nome por período"},"localidade":{"type":"string","description":"Código IBGE da localidade (ou BR para Brasil)"}},"additionalProperties":false},"description":"Resultados de frequência (presente quando tipo='frequencia')"}},"required":["tipo"]},"description_zh":"巴西的查询名称频率和排名 (IBGE)。\n\n特点：\n1. **名称频率** (tipo='freequencia'):\n   - 按十年划分的出生频率\n   - 多个名称以逗号分隔\n   - 按性别和地点过滤\n\n2. **名称排名** (tipo='ranking'):\n   - 最流行的名字\n   - 按年代、性别和地点过滤\n\n可用十年：1930-2010\n\n示例：\n- “Maria”的频率：tipo=“frequencia”，nomes=“Maria”\n- 比较姓名：tipo=\"frequecia\", nomes=\"João,José,Pedro\"\n- 2000年代排名：tipo=\"ranking\", decada=2000\n- 女性名字：tipo=“ranking”，sexo=“F”\n\n行为：只读和幂等 - 针对公共 IBGE Nomes (Censo) API 的实时 GET。返回 Markdown 表。"},{"name":"ibge_noticias","description":"Searches and lists already-published IBGE news articles and press releases.\n\nUse this to find recent IBGE publications or announcements about a survey or topic — when an indicator was released, or news mentioning a term like \"censo\". Results are sorted newest-first; with no parameters it returns the 10 most recent items.\n\nParameters:\n- busca: free-text term to match (e.g. \"PIB\", \"censo\")\n- tipo: \"release\" (official publication of survey results) or \"noticia\" (general news); omit for both\n- de / ate: date range, format DD/MM/AAAA (e.g. de=\"01/01/2024\", ate=\"31/12/2024\")\n- destaque: true to return only featured items\n- quantidade: how many to return (default 10, max 100); pagina: page number to page through more\n\nEach item returns: title, type (release/news), publication date, editoria (section), related products/surveys, a featured flag, a plain-text summary, and a link to the full article. The header reports the total count and current page.\n\nExamples:\n- Latest 10 news: (no parameters)\n- Search census: busca=\"censo\"\n- 2024 news: de=\"01/01/2024\", ate=\"31/12/2024\"\n- Releases only: tipo=\"release\"\n\nUse a different tool when:\n- Scheduled/upcoming release dates (not yet published) → ibge_calendario\n\nBehavior: read-only and idempotent — a live GET against the public IBGE Notícias API. Returns a Markdown list.","inputSchema":{"type":"object","properties":{"de":{"type":"string","description":"Data inicial no formato DD/MM/AAAA (ex: 01/01/2024)"},"ate":{"type":"string","description":"Data final no formato DD/MM/AAAA (ex: 31/12/2024)"},"tipo":{"enum":["release","noticia"],"type":"string","description":"Tipo de publicação: 'release' ou 'noticia'"},"busca":{"type":"string","description":"Termo para buscar nas notícias"},"pagina":{"type":"number","default":1,"minimum":1,"description":"Número da página para paginação"},"destaque":{"type":"boolean","description":"Filtrar apenas notícias em destaque"},"quantidade":{"type":"number","default":10,"maximum":100,"minimum":1,"description":"Quantidade de notícias a retornar (padrão: 10, máximo: 100)"}}},"outputSchema":{"type":"object","properties":{"busca":{"type":"string","description":"Termo de busca aplicado, se houver"},"total":{"type":"number","description":"Total de notícias encontradas na consulta"},"pagina":{"type":"number","description":"Página atual"},"noticias":{"type":"array","items":{"type":"object","required":["titulo","tipo","dataPublicacao","link"],"properties":{"link":{"type":"string","description":"URL para a publicação completa"},"tipo":{"type":"string","description":"Tipo de publicação (ex: 'Release' ou 'Notícia')"},"titulo":{"type":"string","description":"Título da notícia ou release"},"destaque":{"type":"boolean","description":"Indica se a publicação está em destaque"},"produtos":{"type":"string","description":"Produtos do IBGE relacionados à publicação"},"editorias":{"type":"string","description":"Editoria(s) associada(s) à publicação"},"introducao":{"type":"string","description":"Introdução/resumo da publicação (texto limpo)"},"dataPublicacao":{"type":"string","description":"Data de publicação (formato original da API)"}},"additionalProperties":false},"description":"Lista de notícias retornadas"},"totalPaginas":{"type":"number","description":"Número total de páginas"}},"required":["noticias","total","pagina","totalPaginas"]},"description_zh":"搜索并列出已发布的 IBGE 新闻文章和新闻稿。\n\n使用它可以查找最近的 IBGE 出版物或有关调查或主题的公告 - 何时发布指标，或提及“censo”等术语的新闻。结果按最新的在前排序；如果不带参数，它会返回 10 个最近的项目。\n\n参数：\n-busca：要匹配的自由文本术语（例如“PIB”、“censo”）\n- tipo：“release”（调查结果的正式发布）或“noticia”（一般新闻）； omit for both\n- de / ate：日期范围，格式 DD/MM/AAAA（例如 de=\"01/01/2024\", ate=\"31/12/2024\"）\n- destaque：true 仅返回特色项目\n- quantidade：返回多少（默认 10，最大 100）； pagina：翻阅更多内容的页码\n\n每个项目返回：标题、类型（发布/新闻）、发布日期、编辑（部分）、相关产品/调查、特色标志、纯文本摘要以及完整文章的链接。标题报告总计数和当前页数。\n\n示例：\n- 最新10条新闻：（无参数）\n- 搜索人口普查：busca=\"censo\"\n- 2024年新闻：de =“01/01/2024”，ate =“31/12/2024”\n- 仅发布：tipo=\"release\"\n\n在以下情况下使用不同的工具：\n- 预定/即将发布的日期（尚未发布）→ ibge_calendario\n\n行为：只读和幂等 - 针对公共 IBGE Notícias API 的实时 GET。 Returns a Markdown list."},{"name":"ibge_sidra_tabelas","description":"Lists and searches available SIDRA tables.\n\nFeatures:\n- List all SIDRA tables (aggregates)\n- Search by table name\n- Filter by survey (Census, PNAD, GDP, etc.)\n- Shows code and name of each table\n\nSIDRA contains data from various surveys:\n- Demographic Census\n- PNAD Contínua (employment, income)\n- National Accounts (GDP)\n- Industrial Survey\n- Agricultural Survey\n\nExamples:\n- List tables: (no parameters)\n- Search population tables: busca=\"população\"\n- Census tables: pesquisa=\"censo\"\n\nThis is step 1 of the SIDRA workflow: find a table code → ibge_sidra_metadados (structure) → ibge_sidra (query).\nFor common data, a wrapper is usually easier: ibge_censo, ibge_indicadores, ibge_comparar, ibge_cidades.\n\nBehavior: read-only and idempotent — a live GET against the public IBGE SIDRA API. Returns a Markdown table.","inputSchema":{"type":"object","properties":{"busca":{"type":"string","description":"Termo para buscar no nome das tabelas/agregados"},"limite":{"type":"number","default":20,"maximum":100,"minimum":1,"description":"Número máximo de resultados (padrão: 20)"},"pesquisa":{"type":"string","description":"Filtrar por código ou nome da pesquisa (ex: 'censo', 'pnad', 'pib')"}}},"outputSchema":{"type":"object","properties":{"busca":{"type":"string","description":"Termo de busca aplicado, se houver"},"total":{"type":"number","description":"Total de tabelas que correspondem aos critérios"},"tabelas":{"type":"array","items":{"type":"object","required":["codigo","nome"],"properties":{"nome":{"type":"string","description":"Nome da tabela/agregado"},"codigo":{"type":"string","description":"Código da tabela/agregado SIDRA"},"pesquisa":{"type":"string","description":"Pesquisa de origem (código - nome)"}},"additionalProperties":false},"description":"Lista de tabelas SIDRA retornadas"},"pesquisa":{"type":"string","description":"Filtro de pesquisa aplicado, se houver"}},"required":["tabelas","total"]},"description_zh":"列出并搜索可用的 SIDRA 表。\n\n特点：\n- 列出所有 SIDRA 表（聚合）\n- 按表名搜索\n- 按调查过滤（人口普查、PNAD、GDP 等）\n- 显示每个表的代码和名称\n\nSIDRA 包含来自各种调查的数据：\n- 人口普查\n- PNAD Continua（就业、收入）\n- 国民账户（GDP）\n- 工业调查\n- 农业调查\n\n示例：\n- 列表表：（无参数）\n- 搜索人口表：busca=\"população\"\n- 人口普查表：pesquisa=“censo”\n\n这是SIDRA工作流程的第1步：查找表代码→ibge_sidra_metadados（结构）→ibge_sidra（查询）。\n对于通用数据，包装器通常更容易：ibge_censo、ibge_indicadores、ibge_comparar、ibge_cidades。\n\n行为：只读和幂等 - 针对公共 IBGE SIDRA API 的实时 GET。返回 Markdown 表。"},{"name":"ibge_sidra_metadados","description":"Returns metadata for a specific SIDRA table.\n\nFeatures:\n- General info (name, survey, subject, periodicity)\n- Available territorial levels\n- Variable list with units\n- Classifications and categories\n- Available periods\n\nUse this tool to understand table structure BEFORE querying data with ibge_sidra.\n\nExamples:\n- Population table metadata: tabela=\"6579\"\n- Census 2022 metadata: tabela=\"9514\"\n- PNAD unemployment: tabela=\"4714\"\n\nUse this after finding a table code (ibge_sidra_tabelas) and before querying with ibge_sidra.\n\nBehavior: read-only and idempotent — a live GET against the public IBGE SIDRA API. Returns Markdown.","inputSchema":{"type":"object","properties":{"tabela":{"type":"string","description":"Código da tabela/agregado SIDRA (ex: '6579', '9514', '4714')"},"incluir_periodos":{"type":"boolean","default":true,"description":"Incluir lista de períodos disponíveis (padrão: true)"},"incluir_localidades":{"type":"boolean","default":false,"description":"Incluir níveis territoriais disponíveis (padrão: false)"}}},"outputSchema":{"type":"object","properties":{"url":{"type":"string","description":"URL da tabela no SIDRA"},"nome":{"type":"string","description":"Nome da tabela"},"codigo":{"type":"string","description":"Código da tabela/agregado SIDRA"},"assunto":{"type":"string","description":"Assunto/tema da tabela"},"periodos":{"type":"array","items":{"type":"object","required":["id","literais"],"properties":{"id":{"type":"string","description":"Código do período"},"literais":{"type":"array","items":{"type":"string"},"description":"Descrições textuais do período"}},"additionalProperties":false},"description":"Períodos disponíveis para a tabela (quando incluir_periodos)"},"pesquisa":{"type":"string","description":"Nome da pesquisa de origem"},"variaveis":{"type":"array","items":{"type":"object","required":["id","nome"],"properties":{"id":{"type":"number","description":"ID da variável"},"nome":{"type":"string","description":"Nome da variável"},"unidade":{"type":"string","description":"Unidade de medida da variável"},"classificacoes":{"type":"array","items":{"type":"object","required":["id","nome","categorias"],"properties":{"id":{"type":"number","description":"ID da classificação"},"nome":{"type":"string","description":"Nome da classificação"},"categorias":{"type":"array","items":{"type":"object","required":["id","nome"],"properties":{"id":{"type":"number","description":"ID da categoria"},"nome":{"type":"string","description":"Nome da categoria"},"nivel":{"type":"number","description":"Nível hierárquico da categoria"},"unidade":{"type":"string","description":"Unidade da categoria"}},"additionalProperties":false},"description":"Categorias da classificação"}},"additionalProperties":false},"description":"Classificações aplicáveis à variável"}},"additionalProperties":false},"description":"Variáveis da tabela, com unidades e classificações/categorias"},"periodicidade":{"type":"object","properties":{"fim":{"type":"number","description":"Ano/período final da série"},"inicio":{"type":"number","description":"Ano/período inicial da série"},"frequencia":{"type":"string","description":"Frequência de coleta (ex: anual, mensal)"}},"description":"Periodicidade da pesquisa","additionalProperties":false},"niveisTerritoriais":{"type":"array","items":{"type":"object","required":["codigo","nome"],"properties":{"nome":{"type":"string","description":"Nome do nível territorial (ex: Brasil, UF, Município)"},"codigo":{"type":"string","description":"Código do nível territorial (ex: N1, N3, N6)"}},"additionalProperties":false},"description":"Níveis territoriais disponíveis para a tabela"}},"required":["codigo","nome"]},"description_zh":"返回特定 SIDRA 表的元数据。\n\n特点：\n- 一般信息（名称、调查、主题、周期）\n- 可用的领土级别\n- 带单位的变量列表\n- 分类和类别\n- 可用期间\n\n在使用 ibge_sidra 查询数据之前，请使用此工具了解表结构。\n\n示例：\n- 人口表元数据：tabela=\"6579\"\n- 2022 年人口普查元数据：tabela=\"9514\"\n- PNAD 失业率： tabela=\"4714\"\n\n在查找表代码 (ibge_sidra_tabelas) 之后和使用 ibge_sidra 查询之前使用此命令。\n\n行为：只读和幂等 - 针对公共 IBGE SIDRA API 的实时 GET。返回 Markdown。"},{"name":"ibge_malhas","description":"Gets geographic meshes (maps) from IBGE in GeoJSON, TopoJSON, or SVG format.\n\nFeatures:\n- Meshes for Brazil, regions, states, municipalities\n- Different resolution levels (internal divisions)\n- Different quality levels\n- Formats: GeoJSON (data), TopoJSON (compact), SVG (image)\n\nLocality types:\n- \"BR\" or \"1\" = Entire Brazil\n- State abbreviation (e.g., \"SP\", \"RJ\")\n- State code (e.g., \"35\" for SP)\n- Municipality code (7 digits)\n\nResolution (internal divisions):\n- 0 = Outline only\n- 2 = States\n- 5 = Municipalities\n\nExamples:\n- Brazil with states: localidade=\"BR\", resolucao=\"2\"\n- São Paulo with municipalities: localidade=\"SP\", resolucao=\"5\"\n- SVG format: localidade=\"BR\", formato=\"svg\"\n\nUse a different tool when:\n- Thematic meshes (biomes, Legal Amazon, semi-arid, metropolitan regions) → ibge_malhas_tema\n\nBehavior: read-only and idempotent — a live GET against the public IBGE Malhas API. Returns the mesh in the requested format (GeoJSON, TopoJSON, or SVG).","inputSchema":{"type":"object","properties":{"tipo":{"enum":["paises","regioes","estados","mesorregioes","microrregioes","municipios","distritos","regioes-imediatas","regioes-intermediarias"],"type":"string","description":"Tipo de divisão territorial"},"formato":{"enum":["geojson","topojson","svg"],"type":"string","default":"geojson","description":"Formato de saída (padrão: geojson)"},"qualidade":{"enum":["1","2","3","4"],"type":"string","default":"4","description":"Qualidade do traçado: 1=mínima, 2=baixa, 3=intermediária, 4=máxima"},"resolucao":{"enum":["0","1","2","3","4","5"],"type":"string","default":"0","description":"Resolução/divisões internas:\n0 = Sem divisões internas\n1 = Macrorregiões (apenas para BR)\n2 = Unidades da Federação\n3 = Mesorregiões\n4 = Microrregiões\n5 = Municípios"},"localidade":{"type":"string","description":"Código IBGE ou sigla da localidade (ex: 'BR', 'SP', '35', '3550308')"},"intrarregiao":{"type":"string","description":"Código de região para filtrar (apenas quando localidade=BR)"}}},"outputSchema":{"type":"object","properties":{"url":{"type":"string","description":"URL para download da malha completa"},"tipo":{"type":"string","description":"Tipo de divisão territorial, quando informado"},"formato":{"type":"string","description":"Formato de saída solicitado (geojson, topojson ou svg)"},"qualidade":{"type":"string","description":"Qualidade do traçado solicitada"},"resolucao":{"type":"string","description":"Resolução/divisões internas solicitada"},"localidade":{"type":"string","description":"Código IBGE ou sigla da localidade consultada"},"intrarregiao":{"type":"string","description":"Código de região usado para filtrar (apenas quando localidade=BR)"}},"required":["localidade","formato"]},"description_zh":"从 IBGE 获取 GeoJSON、TopoJSON 或 SVG 格式的地理网格（地图）。\n\n特点：\n- 巴西、地区、州、市的网格\n- 不同的分辨率级别（内部划分）\n- 不同的质量水平\n- 格式：GeoJSON（数据）、TopoJSON（紧凑）、SVG（图像）\n\n地点类型：\n- “BR”或“1”=整个巴西\n- 国家缩写（例如“SP”、“RJ”）\n- 州代码（例如 SP 为“35”）\n- 市政府代码（7 位数字）\n\n决议（内部部门）：\n- 0 = 仅轮廓\n- 2 = 状态\n- 5 = 直辖市\n\n示例：\n- 巴西，州份：localidade=\"BR\", resolucao=\"2\"\n- 圣保罗及其市镇：localidade=“SP”，resolucao=“5”\n- SVG 格式：localidade=\"BR\"，format=\"svg\"\n\n在以下情况下使用不同的工具：\n- 专题网格（生物群落、合法亚马逊、半干旱、大都市地区）→ ibge_malhas_tema\n\n行为：只读和幂等 - 针对公共 IBGE Malhas API 的实时 GET。以请求的格式（GeoJSON、TopoJSON 或 SVG）返回网格。"},{"name":"ibge_pesquisas","description":"Lists available IBGE surveys and their tables.\n\nFeatures:\n- List all IBGE surveys (Census, PNAD, GDP, etc.)\n- Search by name or code\n- Show details and tables of a specific survey\n- Categorize surveys by theme\n\nMain surveys:\n- **Census**: Demographic, Agricultural, MUNIC\n- **PNAD Contínua**: Employment, income, education\n- **National Accounts**: GDP, investments\n- **Economic Surveys**: Industry, Commerce, Services\n- **Price Indices**: IPCA, INPC\n\nExamples:\n- List all: (no parameters)\n- Search population: busca=\"população\"\n- PNAD details: detalhes=\"pnad\"\n\nThis lists surveys, not data. To find table codes use ibge_sidra_tabelas; to query data use ibge_sidra (or a wrapper: ibge_censo, ibge_indicadores, ibge_comparar, ibge_cidades).\n\nBehavior: read-only and idempotent — a live GET against the public IBGE SIDRA/Pesquisas API. Returns a Markdown list.","inputSchema":{"type":"object","properties":{"busca":{"type":"string","description":"Termo para buscar no nome ou ID da pesquisa"},"detalhes":{"type":"string","description":"Código da pesquisa para ver detalhes e tabelas disponíveis"}}},"outputSchema":{"type":"object","properties":{"modo":{"enum":["lista","detalhes"],"type":"string","description":"Modo de consulta que originou este resultado: lista de pesquisas ou detalhes de uma"},"busca":{"type":"string","description":"Termo de busca aplicado, se houver (modo lista)"},"total":{"type":"number","description":"Total de pesquisas encontradas (modo lista)"},"pesquisa":{"type":"object","required":["id","nome","totalTabelas","tabelas"],"properties":{"id":{"type":"string","description":"Código da pesquisa"},"nome":{"type":"string","description":"Nome da pesquisa"},"tabelas":{"type":"array","items":{"type":"object","required":["id","nome"],"properties":{"id":{"type":"string","description":"Código da tabela (agregado)"},"nome":{"type":"string","description":"Nome da tabela"}},"additionalProperties":false},"description":"Tabelas disponíveis na pesquisa"},"totalTabelas":{"type":"number","description":"Quantidade de tabelas da pesquisa"}},"description":"Detalhes de uma pesquisa específica (modo detalhes)","additionalProperties":false},"pesquisas":{"type":"array","items":{"type":"object","required":["id","nome","totalTabelas"],"properties":{"id":{"type":"string","description":"Código da pesquisa"},"nome":{"type":"string","description":"Nome da pesquisa"},"totalTabelas":{"type":"number","description":"Quantidade de tabelas (agregados) da pesquisa"}},"additionalProperties":false},"description":"Lista de pesquisas (modo lista)"}},"required":["modo"]},"description_zh":"列出可用的 IBGE 调查及其表格。\n\n特点：\n- 列出所有 IBGE 调查（人口普查、PNAD、GDP 等）\n- 按名称或代码搜索\n- 显示特定调查的详细信息和表格\n- 按主题对调查进行分类\n\n主要调查：\n- **人口普查**：人口统计、农业、MUNIC\n- **PNAD Contínua**：就业、收入、教育\n- **国民账户**：GDP、投资\n- **经济调查**：工业、商业、服务业\n- **价格指数**：IPCA、INPC\n\n示例：\n- 列出全部：（无参数）\n- 搜索人口：busca=\"população\"\n- PNAD 详细信息：detalhes=\"pnad\"\n\n这列出了调查，而不是数据。要查找表代码，请使用 ibge_sidra_tabelas；要查询数据，请使用 ibge_sidra （或包装器：ibge_censo、ibge_indicadores、ibge_comparar、ibge_cidades）。\n\n行为：只读和幂等 - 针对公共 IBGE SIDRA/Pesquisas API 的实时 GET。返回 Markdown 列表。"},{"name":"ibge_censo","description":"Queries IBGE Demographic Census data (1970-2022).\n\nSimplified tool to access census data without knowing SIDRA table codes.\n\nAvailable years: 1970, 1980, 1991, 2000, 2010, 2022\n\nAvailable themes:\n- populacao: Resident population\n- alfabetizacao: Literacy rate\n- domicilios: Housing characteristics\n- idade_sexo: Age pyramid\n- religiao: Religion distribution\n- cor_raca: Race/color\n- rendimento: Monthly income\n- educacao: Education level\n- trabalho: Employment\n\nExamples:\n- Population 2022: ano=\"2022\", tema=\"populacao\"\n- Historical series: ano=\"todos\", tema=\"populacao\"\n- Literacy 2010 by state: ano=\"2010\", tema=\"alfabetizacao\", nivel_territorial=\"3\"\n- List tables: tema=\"listar\"\n\nUse a different tool when:\n- Current real-time Brazil population → ibge_populacao\n- One municipality's current panel (estimate, HDI, GDP) → ibge_cidades\n- Comparing/ranking localities → ibge_comparar\n- An arbitrary SIDRA table → ibge_sidra\n\nBehavior: read-only and idempotent — a live GET against the public IBGE SIDRA API. Returns Markdown plus a typed structuredContent payload.","inputSchema":{"type":"object","properties":{"ano":{"enum":["1970","1980","1991","2000","2010","2022","todos"],"type":"string","description":"Ano do censo (1970, 1980, 1991, 2000, 2010, 2022) ou 'todos' para série histórica"},"tema":{"enum":["populacao","alfabetizacao","domicilios","idade_sexo","religiao","cor_raca","rendimento","migracao","educacao","trabalho","indigenas","quilombolas","saneamento","deficiencia","nupcialidade","fecundidade","listar"],"type":"string","default":"populacao","description":"Tema dos dados:\n- populacao: População residente\n- alfabetizacao: Taxa de alfabetização\n- domicilios: Características dos domicílios\n- idade_sexo: Pirâmide etária\n- religiao: Distribuição por religião\n- cor_raca: Cor ou raça\n- rendimento: Rendimento mensal\n- migracao: Migração\n- educacao: Nível de instrução\n- trabalho: Ocupação e trabalho\n- indigenas: População indígena\n- quilombolas: População quilombola\n- saneamento: Abastecimento de água e esgoto\n- deficiencia: Pessoas com deficiência\n- nupcialidade: Estado civil\n- fecundidade: Taxa de fecundidade\n- listar: Lista tabelas disponíveis"},"campos":{"type":"string","description":"Selecionar apenas algumas colunas por rótulo, separadas por vírgula (ex: 'Valor,Ano'). Reduz o volume da resposta."},"formato":{"enum":["tabela","json"],"type":"string","default":"tabela","description":"Formato de saída"},"localidades":{"type":"string","default":"all","description":"Códigos das localidades ou 'all'"},"nivel_territorial":{"type":"string","default":"1","description":"Nível territorial (código N): 1=Brasil, 2=Região, 3=UF, 6=Município"}}},"outputSchema":{"type":"object","properties":{"ano":{"type":"string","description":"Ano(s) de referência"},"tema":{"type":"string","description":"Tema do censo consultado"},"tabela":{"type":"string","description":"Tabela SIDRA de origem"},"colunas":{"type":"array","items":{"type":"string"},"description":"Rótulos das colunas, na ordem"},"descricao":{"type":"string","description":"Descrição da tabela"},"registros":{"type":"array","items":{"type":"object","additionalProperties":{"type":"string"}},"description":"Registros: cada um mapeia rótulo da coluna -\u003e valor"},"totalRegistros":{"type":"number","description":"Total de registros de dados"}},"required":["totalRegistros","colunas","registros"]},"description_zh":"查询 IBGE 人口普查数据 (1970-2022)。\n\n无需了解 SIDRA 表代码即可访问人口普查数据的简化工具。\n\n可用年份: 1970, 1980, 1991, 2000, 2010, 2022\n\n可用主题：\n- populacao：常住人口\n- alfabetizacao：识字率\n- domicilios：住房特征\n- idade_sexo：年龄金字塔\n- religiao：宗教分布\n- cor_raca：种族/颜色\n- rendimento：月收入\n- educacao：教育水平\n- trabalho：就业\n\n示例：\n- 2022 年人口：ano=“2022”，tema=“populacao”\n- 历史系列：ano=“todos”，tema=“populacao”\n- 2010 年各州识字率：ano=\"2010\"、tema=\"alfabetizacao\"、nivel_territorial=\"3\"\n- 列表表：tema=\"listar\"\n\n在以下情况下使用不同的工具：\n- 当前实时巴西人口 → ibge_populacao\n- 一个城市当前的面板（估计、HDI、GDP）→ ibge_cidades\n- 比较/排名地点 → ibge_comparar\n- 任意 SIDRA 表 → ibge_sidra\n\n行为：只读和幂等 - 针对公共 IBGE SIDRA API 的实时 GET。返回 Markdown 加上类型化的 StructuredContent 有效负载。"},{"name":"ibge_indicadores","description":"Queries IBGE economic and social indicators.\n\nAvailable indicators:\n\n**Economic:**\n- pib: GDP at current prices\n- pib_variacao: GDP variation (%)\n- pib_per_capita: GDP per capita\n- industria: Industrial production\n- comercio: Retail sales\n- servicos: Services volume\n\n**Prices:**\n- ipca: Monthly IPCA\n- ipca_acumulado: 12-month IPCA\n- inpc: Monthly INPC\n\n**Labor:**\n- desemprego: Unemployment rate\n- ocupacao: Employed people\n- rendimento: Average income\n- informalidade: Informality rate\n\n**Population:**\n- populacao: Population estimate\n- densidade: Population density\n\nExamples:\n- GDP: indicador=\"pib\"\n- IPCA last 12 months: indicador=\"ipca\", periodos=\"last 12\"\n- Unemployment by state: indicador=\"desemprego\", nivel_territorial=\"3\"\n- List indicators: indicador=\"listar\"\n\nUse a different tool when:\n- Comparing/ranking localities → ibge_comparar\n- Census themes → ibge_censo\n- One municipality's panel → ibge_cidades\n\nBehavior: read-only and idempotent — a live GET against the public IBGE SIDRA API. Returns Markdown plus a typed structuredContent payload.","inputSchema":{"type":"object","properties":{"campos":{"type":"string","description":"Selecionar apenas algumas colunas por rótulo, separadas por vírgula (ex: 'Valor,Ano'). Reduz o volume da resposta."},"formato":{"enum":["tabela","json"],"type":"string","default":"tabela","description":"Formato de saída"},"periodos":{"type":"string","default":"last","description":"Períodos (ex: '2023', 'last', 'last 4')"},"categoria":{"enum":["economico","precos","trabalho","populacao","agropecuaria","todos"],"type":"string","description":"Filtrar por categoria de indicadores"},"indicador":{"type":"string","description":"Nome do indicador (ex: \"pib\", \"ipca\", \"desemprego\", \"populacao\").\nUse \"listar\" para ver todos os indicadores disponíveis."},"localidades":{"type":"string","default":"all","description":"Códigos das localidades ou 'all'"},"nivel_territorial":{"type":"string","default":"1","description":"Nível territorial (código N): 1=Brasil, 2=Região, 3=UF"}}},"outputSchema":{"type":"object","properties":{"nome":{"type":"string","description":"Nome do indicador"},"tabela":{"type":"string","description":"Tabela SIDRA de origem"},"colunas":{"type":"array","items":{"type":"string"},"description":"Rótulos das colunas, na ordem"},"indicador":{"type":"string","description":"Chave do indicador consultado"},"registros":{"type":"array","items":{"type":"object","additionalProperties":{"type":"string"}},"description":"Registros: cada um mapeia rótulo da coluna -\u003e valor"},"totalRegistros":{"type":"number","description":"Total de registros de dados"}},"required":["totalRegistros","colunas","registros"]},"description_zh":"查询IBGE经济和社会指标。\n\n可用指标：\n\n**经济：**\n- GDP：按现价计算的GDP\n- GDP_variation：GDP变化（%）\n- gdp_per_capita：人均国内生产总值\n- 工业：工业生产\n- 商业：零售销售\n- 服务：服务量\n\n**价格：**\n- ipca：每月 IPCA\n- ipca_acumulado：12 个月的 IPCA\n- inpc：每月 INPC\n\n**劳动力：**\n- 失业：失业率\n- 职业：就业人员\n- 收入：平均收入\n- 非正规性：非正规性率\n\n**人口：**\n- 人口：人口估计\n- 密度：人口密度\n\n示例：\n- GDP：指标=“gdp”\n- IPCA 过去 12 个月：指标 =“ipca”，周期 =“最后 12”\n- 按州划分的失业率：indicator=“desemprego”，nivel_territorial=“3”\n- 列表指标：indicator=\"list\"\n\n在以下情况下使用不同的工具：\n- 比较/排名地点 → ibge_comparar\n- 人口普查主题 → ibge_censo\n- 一个市政府的小组 → ibge_cidades\n\n行为：只读和幂等 - 针对公共 IBGE SIDRA API 的实时 GET。返回 Markdown 加上类型化的 StructuredContent 有效负载。"},{"name":"ibge_cnae","description":"Queries CNAE (National Classification of Economic Activities) from IBGE.\n\nCNAE is the official classification for economic activities in Brazil.\n\nHierarchical structure:\n- Section (letter A-U): 21 main categories\n- Division (2 digits): 87 divisions\n- Group (3 digits): 285 groups\n- Class (4-5 digits): 673 classes\n- Subclass (7 digits): 1,332 subclasses\n\nFeatures:\n- Search by CNAE code\n- Search by activity description\n- List by hierarchical level\n- Show complete hierarchy\n\nExamples:\n- Search software: busca=\"software\"\n- Specific code: codigo=\"6201-5/01\"\n- View section: codigo=\"J\"\n- List divisions: nivel=\"divisoes\"\n\nBehavior: read-only and idempotent — a live GET against the public IBGE CNAE API. Returns Markdown.","inputSchema":{"type":"object","properties":{"busca":{"type":"string","description":"Termo para buscar na descrição das atividades (ex: 'software', 'restaurante', 'comércio')"},"nivel":{"enum":["secoes","divisoes","grupos","classes","subclasses"],"type":"string","description":"Nível hierárquico para listar (padrão: mostra todos os níveis relevantes)"},"codigo":{"type":"string","description":"Código CNAE para buscar (seção, divisão, grupo, classe ou subclasse).\nExemplos:\n- Seção: \"A\" (agricultura)\n- Divisão: \"01\" (agricultura e pecuária)\n- Grupo: \"01.1\" (produção de lavouras)\n- Classe: \"01.11\" (cultivo de cereais)\n- Subclasse: \"0111-3/01\" (cultivo de arroz)"},"limite":{"type":"number","default":20,"description":"Número máximo de resultados (padrão: 20)"}}},"outputSchema":{"type":"object","properties":{"modo":{"enum":["busca","codigo","lista","estrutura"],"type":"string","description":"Modo de resposta que gerou os dados"},"busca":{"type":"object","required":["termo","nivel","total","resultados"],"properties":{"nivel":{"type":"string","description":"Nível hierárquico pesquisado (ex: subclasses, classes)"},"termo":{"type":"string","description":"Termo pesquisado"},"total":{"type":"number","description":"Quantidade de resultados retornados"},"resultados":{"type":"array","items":{"type":"object","required":["id","descricao"],"properties":{"id":{"type":"string","description":"Código CNAE da atividade"},"descricao":{"type":"string","description":"Descrição da atividade"}},"additionalProperties":false},"description":"Atividades encontradas para o termo"}},"description":"Presente no modo de busca por termo","additionalProperties":false},"lista":{"type":"object","required":["nivel","total","exibidos","registros"],"properties":{"nivel":{"type":"string","description":"Nível hierárquico listado"},"total":{"type":"number","description":"Total de registros existentes no nível"},"exibidos":{"type":"number","description":"Quantidade de registros exibidos (limitada por 'limite')"},"registros":{"type":"array","items":{"type":"object","required":["id","descricao"],"properties":{"id":{"type":"string","description":"Código CNAE do registro"},"descricao":{"type":"string","description":"Descrição do registro"}},"additionalProperties":false},"description":"Registros do nível listado"}},"description":"Presente no modo de listagem por nível","additionalProperties":false},"codigo":{"type":"object","required":["id","descricao","nivel"],"properties":{"id":{"type":"string","description":"Código CNAE consultado"},"nivel":{"type":"string","description":"Nível do código (secao, divisao, grupo, classe ou subclasse)"},"descricao":{"type":"string","description":"Descrição do código"},"hierarquia":{"type":"array","items":{"type":"object","required":["nivel","id","descricao"],"properties":{"id":{"type":"string","description":"Código do nível"},"nivel":{"type":"string","description":"Nível hierárquico (Seção, Divisão, Grupo, Classe, Subclasse)"},"descricao":{"type":"string","description":"Descrição do nível"}},"additionalProperties":false},"description":"Cadeia hierárquica do código (do mais geral ao mais específico)"},"observacoes":{"type":"array","items":{"type":"string"},"description":"Observações/notas explicativas do código"}},"description":"Presente no modo de consulta por código","additionalProperties":false}},"required":["modo"]},"description_zh":"从 IBGE 查询 CNAE（国家经济活动分类）。\n\nCNAE 是巴西经济活动的官方分类。\n\n层次结构：\n- 部分（字母 A-U）：21 个主要类别\n- 分区（2 位）：87 分区\n- 组（3位）：285组\n- 类别（4-5位）：673个类别\n- 子类（7 位）：1,332 个子类\n\n特点：\n- 按 CNAE 代码搜索\n- 按活动描述搜索\n- 按层级列出\n- 显示完整的层次结构\n\n示例：\n- 搜索软件：busca=“软件”\n- 具体代码：codigo=\"6201-5/01\"\n- 查看部分：codigo=\"J\"\n- 列出部门：nivel=\"divisoes\"\n\n行为：只读和幂等 - 针对公共 IBGE CNAE API 的实时 GET。返回 Markdown。"},{"name":"ibge_geocodigo","description":"Decodes IBGE codes or searches codes by locality name.\n\nFeatures:\n- Decode region, state, municipality, or district codes\n- Search IBGE code by name\n- Show complete geographic hierarchy\n- Return related codes\n\nCode structure:\n- 1 digit: Region (1=North, 2=Northeast, 3=Southeast, 4=South, 5=Central-West)\n- 2 digits: State (11-53)\n- 7 digits: Municipality\n- 9 digits: District\n\nExamples:\n- Decode municipality: codigo=\"3550308\"\n- Decode state: codigo=\"35\"\n- Search by name: nome=\"São Paulo\"\n- Municipality in state: nome=\"Campinas\", uf=\"SP\"\n\nThis tool decodes a code's structure and resolves name→code at any level.\nUse a different tool when:\n- You only need to list/search municipalities → ibge_municipios\n- You want the full detailed record of one locality → ibge_localidade\n\nBehavior: read-only and idempotent — a live GET against the public IBGE Localidades API. Returns Markdown.","inputSchema":{"type":"object","properties":{"uf":{"type":"string","description":"Estado por sigla (SP), nome (São Paulo) ou código IBGE (35) para restringir a busca por nome de município"},"nome":{"type":"string","description":"Nome da localidade para encontrar o código IBGE (estado ou município)"},"codigo":{"type":"string","description":"Código IBGE para decodificar.\nFormatos aceitos:\n- 1 dígito: Região (1-5)\n- 2 dígitos: UF (11-53)\n- 7 dígitos: Município\n- 9 dígitos: Distrito"}}},"outputSchema":{"type":"object","properties":{"nome":{"type":"string","description":"Nome da localidade resolvida"},"tipo":{"enum":["regiao","uf","municipio","distrito","lista"],"type":"string","description":"Tipo do resultado: localidade decodificada (regiao/uf/municipio/distrito) ou lista de municípios encontrados (lista)"},"sigla":{"type":"string","description":"Sigla da região ou UF, quando aplicável"},"total":{"type":"number","description":"Quantidade de municípios encontrados na busca por nome (apenas tipo lista)"},"codigo":{"type":"number","description":"Código IBGE da localidade resolvida (ausente em resultados do tipo lista)"},"regiao":{"type":"string","description":"Nome da região à qual a UF pertence (apenas tipo uf)"},"estados":{"type":"array","items":{"type":"object","required":["codigo","sigla","nome"],"properties":{"nome":{"type":"string","description":"Nome da UF"},"sigla":{"type":"string","description":"Sigla da UF"},"codigo":{"type":"number","description":"Código IBGE da UF"}},"additionalProperties":false},"description":"Estados pertencentes à região (apenas tipo regiao)"},"matches":{"type":"array","items":{"type":"object","required":["codigo","nome"],"properties":{"nome":{"type":"string","description":"Nome do município"},"codigo":{"type":"number","description":"Código IBGE (7 dígitos) do município"}},"additionalProperties":false},"description":"Municípios encontrados na busca por nome (apenas tipo lista)"},"hierarquia":{"type":"array","items":{"type":"object","required":["nivel","codigo","nome"],"properties":{"nome":{"type":"string","description":"Nome da localidade neste nível"},"nivel":{"type":"string","description":"Nome do nível territorial (Região, UF, Município, etc.)"},"codigo":{"type":"number","description":"Código IBGE do nível"}},"additionalProperties":false},"description":"Hierarquia geográfica completa, da região ao município/distrito (tipo municipio/distrito)"},"codigoSidra":{"type":"string","description":"Código SIDRA de 6 dígitos do município (apenas tipo municipio)"},"regiaoCodigo":{"type":"number","description":"Código IBGE da região à qual a UF pertence (apenas tipo uf)"}},"required":["tipo"]},"description_zh":"解码 IBGE 代码或按地点名称搜索代码。\n\n特点：\n- 解码地区、州、市或地区代码\n- 按名称搜索 IBGE 代码\n- 显示完整的地理层次结构\n- 返回相关代码\n\n代码结构：\n- 1 位数字：区域（1=北部、2=东北部、3=东南部、4=南部、5=中西部）\n- 2 位数字：州 (11-53)\n- 7 位数字：市政府\n- 9 位数字：地区\n\n示例：\n- 解码自治市：codigo=\"3550308\"\n- 解码状态：codigo=“35”\n- 按名称搜索：nome=\"São Paulo\"\n- 州内市政府：nome=“坎皮纳斯”，uf=“SP”\n\n该工具可以解码代码的结构并解析任何级别的名称→代码。\n在以下情况下使用不同的工具：\n- 您只需要列出/搜索城市 → ibge_municipios\n- 您想要一个地点的完整详细记录 → ibge_localidade\n\n行为：只读和幂等 - 针对公共 IBGE Localidades API 的实时 GET。返回 Markdown。"},{"name":"ibge_calendario","description":"Queries IBGE release and collection calendar.\n\nFeatures:\n- List upcoming survey releases\n- Filter by product (IPCA, PNAD, GDP, etc.)\n- Filter by period\n- Distinguish releases from field collections\n\nEvent types:\n- **Release**: Publication of survey results\n- **Collection**: Field research period\n\nExamples:\n- Upcoming releases: (no parameters)\n- IPCA releases: produto=\"IPCA\"\n- 2024 calendar: de=\"01/01/2024\", ate=\"31/12/2024\"\n- Field collections: tipo=\"coleta\"\n\nUse a different tool when:\n- Already-published news and releases → ibge_noticias\n\nBehavior: read-only and idempotent — a live GET against the public IBGE Calendário API. Returns a Markdown list.","inputSchema":{"type":"object","properties":{"de":{"type":"string","description":"Data inicial no formato DD/MM/AAAA (ex: '01/01/2024')"},"ate":{"type":"string","description":"Data final no formato DD/MM/AAAA (ex: '31/12/2024')"},"tipo":{"enum":["divulgacao","coleta","todos"],"type":"string","default":"divulgacao","description":"Tipo de evento: 'divulgacao' (publicações), 'coleta' (pesquisas de campo), ou 'todos'"},"pagina":{"type":"number","default":1,"description":"Número da página (padrão: 1)"},"produto":{"type":"string","description":"Filtrar por produto/pesquisa (ex: 'IPCA', 'PNAD', 'PIB')"},"quantidade":{"type":"number","default":20,"description":"Quantidade de resultados por página (padrão: 20)"}}},"outputSchema":{"type":"object","properties":{"total":{"type":"number","description":"Total de eventos disponíveis para os critérios"},"pagina":{"type":"number","description":"Página atual retornada"},"eventos":{"type":"array","items":{"type":"object","required":["id","titulo","produto","dataDivulgacao","tipoId","tipo"],"properties":{"id":{"type":"number","description":"Identificador do evento no calendário"},"link":{"type":"string","description":"Link para mais informações, quando disponível"},"tipo":{"type":"string","description":"Descrição do tipo do evento"},"tipoId":{"type":"number","description":"ID do tipo (1 = divulgação, 2 = coleta)"},"titulo":{"type":"string","description":"Título do evento"},"produto":{"type":"string","description":"Nome do produto/pesquisa associado"},"dataDivulgacao":{"type":"string","description":"Data/hora de divulgação no formato 'DD/MM/AAAA HH:MM:SS'"}},"additionalProperties":false},"description":"Lista de eventos do calendário (divulgações/coletas)"},"produto":{"type":"string","description":"Filtro de produto aplicado, quando informado"},"totalPaginas":{"type":"number","description":"Total de páginas disponíveis"}},"required":["eventos","total"]},"description_zh":"查询 IBGE 发布和收集日历。\n\n特点：\n- 列出即将发布的调查\n- 按产品过滤（IPCA、PNAD、GDP 等）\n- 按时期过滤\n- 区分发布与现场收藏\n\n事件类型：\n- **发布**：公布调查结果\n- **收藏**：实地研究时期\n\n示例：\n- 即将发布的版本：（无参数）\n- IPCA 发布：produto=\"IPCA\"\n- 2024 年日历：de=\"01/01/2024\"，ate=\"31/12/2024\"\n- 现场收藏：tipo=\"coleta\"\n\n在以下情况下使用不同的工具：\n- 已发布的新闻和发布 → ibge_noticias\n\n行为：只读和幂等 - 针对公共 IBGE Calendário API 的实时 GET。返回 Markdown 列表。"},{"name":"ibge_comparar","description":"Compares data between localities (municipalities or states).\n\nAvailable indicators:\n- populacao: Current population estimate\n- populacao_censo: Census 2022 population\n- pib: GDP per capita\n- area: Territorial area (km²)\n- densidade: Population density (inhab/km²)\n- alfabetizacao: Literacy rate\n- domicilios: Number of households\n\nFeatures:\n- Compare up to 10 localities at once\n- Calculate statistics (max, min, average, variation)\n- Generate ranked output\n- Accept municipality codes (7 digits) or state codes (2 digits)\n\nExamples:\n- Compare capitals: localidades=\"3550308,3304557,4106902\", indicador=\"populacao\"\n- Compare states: localidades=\"35,33,41\", indicador=\"pib\"\n- Area ranking: localidades=\"3550308,3304557\", formato=\"ranking\"\n- List indicators: indicador=\"listar\"\n\nUse this tool ONLY to rank/compare 2–10 localities on one indicator.\nFor a single locality, use ibge_cidades (municipal panel), ibge_censo, or ibge_sidra.\n\nBehavior: read-only and idempotent — a live GET against the public IBGE APIs (SIDRA and Localidades). Returns Markdown plus a typed structuredContent payload.","inputSchema":{"type":"object","properties":{"formato":{"enum":["tabela","json","ranking"],"type":"string","default":"tabela","description":"Formato de saída: tabela, json ou ranking (ordenado)"},"indicador":{"enum":["populacao","populacao_censo","pib","area","densidade","alfabetizacao","domicilios","listar"],"type":"string","default":"populacao","description":"Indicador para comparação:\n- populacao: Estimativa populacional atual\n- populacao_censo: População do Censo 2022\n- pib: PIB per capita\n- area: Área territorial (km²)\n- densidade: Densidade demográfica (hab/km²)\n- alfabetizacao: Taxa de alfabetização\n- domicilios: Número de domicílios\n- listar: Lista indicadores disponíveis"},"localidades":{"type":"string","description":"Códigos IBGE das localidades separados por vírgula (ex: \"3550308,3304557,4106902\").\nUse 7 dígitos para municípios, 2 dígitos para UFs."}}},"outputSchema":{"type":"object","properties":{"nome":{"type":"string","description":"Nome do indicador"},"tabela":{"type":"string","description":"Tabela SIDRA de origem"},"formato":{"type":"string","description":"Formato solicitado"},"indicador":{"type":"string","description":"Indicador comparado"},"localidades":{"type":"array","items":{"type":"object","required":["codigo","nome","valor","valorTexto"],"properties":{"nome":{"type":"string"},"valor":{"type":"number"},"codigo":{"type":"string"},"valorTexto":{"type":"string"}},"additionalProperties":false},"description":"Localidades comparadas, com o valor do indicador"},"estatisticas":{"type":"object","required":["maior","menor","media","variacaoPct"],"properties":{"maior":{"type":"number"},"media":{"type":"number"},"menor":{"type":"number"},"variacaoPct":{"type":"number"}},"description":"Estatísticas agregadas (quando há ao menos 2 valores positivos)","additionalProperties":false}},"required":["localidades"]},"description_zh":"比较地方（市或州）之间的数据。\n\n可用指标：\n- populacao：当前人口估计\n- populacao_censo：2022 年人口普查人口\n- pib：人均国内生产总值\n- 面积：领土面积（平方公里）\n- densidade：人口密度（inhab/km²）\n- alfabetizacao：识字率\n- domicilios：家庭数量\n\n特点：\n- 一次比较最多 10 个地点\n- 计算统计数据（最大值、最小值、平均值、变化）\n- 生成排名输出\n- 接受市代码（7 位数字）或州代码（2 位数字）\n\n示例：\n- 比较大写字母：localidades=\"3550308,3304557,4106902\", indicador=\"populacao\"\n- 比较状态：localidades=“35,33,41”，indicador=“pib”\n- 地区排名：localidades=\"3550308,3304557\", format=\"ranking\"\n- 列表指标：indicador=\"listar\"\n\n仅使用此工具根据一项指标对 2-10 个地点进行排名/比较。\n对于单个地点，请使用 ibge_cidades（市政面板）、ibge_censo 或 ibge_sidra。\n\n行为：只读和幂等 - 针对公共 IBGE API（SIDRA 和 Localidades）的实时 GET。返回 Markdown 加上类型化的 StructuredContent 有效负载。"},{"name":"ibge_malhas_tema","description":"Gets thematic geographic meshes from IBGE.\n\nAvailable themes:\n- biomas: Brazilian biomes (Amazon, Cerrado, Atlantic Forest, Caatinga, Pampa, Pantanal)\n- amazonia_legal: Legal Amazon area\n- semiarido: Semi-arid region\n- costeiro: Coastal zone\n- fronteira: Border strip\n- metropolitana: Metropolitan regions\n- ride: Integrated Development Regions\n\nBiome codes:\n- 1: Amazon\n- 2: Cerrado\n- 3: Atlantic Forest\n- 4: Caatinga\n- 5: Pampa\n- 6: Pantanal\n\nExamples:\n- All biomes: tema=\"biomas\"\n- Amazon biome: tema=\"biomas\", codigo=\"1\"\n- Legal Amazon: tema=\"amazonia_legal\"\n- Metropolitan regions: tema=\"metropolitana\"\n- With municipalities: tema=\"biomas\", resolucao=\"5\"\n- List themes: tema=\"listar\"\n\nUse a different tool when:\n- Administrative meshes (Brazil/region/state/municipality outlines) → ibge_malhas\n\nBehavior: read-only and idempotent — a live GET against the public IBGE Malhas API. Returns the mesh in the requested format (GeoJSON, TopoJSON, or SVG).","inputSchema":{"type":"object","properties":{"tema":{"enum":["biomas","amazonia_legal","semiarido","costeiro","fronteira","metropolitana","ride","listar"],"type":"string","description":"Tema da malha:\n- biomas: Biomas brasileiros (Amazônia, Cerrado, etc.)\n- amazonia_legal: Área da Amazônia Legal\n- semiarido: Região do semiárido\n- costeiro: Zona costeira\n- fronteira: Faixa de fronteira\n- metropolitana: Regiões metropolitanas\n- ride: Regiões Integradas de Desenvolvimento\n- listar: Lista temas disponíveis"},"codigo":{"type":"string","description":"Código específico do tema (ex: código do bioma, da região metropolitana)"},"formato":{"enum":["geojson","topojson","svg"],"type":"string","default":"geojson","description":"Formato de saída"},"qualidade":{"enum":["1","2","3","4"],"type":"string","default":"4","description":"Qualidade do traçado: 1=mínima, 4=máxima"},"resolucao":{"enum":["0","5"],"type":"string","default":"0","description":"0 = Apenas contorno, 5 = Com municípios"}}},"outputSchema":{"type":"object","properties":{"tema":{"type":"string","description":"Tema da malha solicitada (ou 'listar')"},"temas":{"type":"array","items":{"type":"object","required":["tema","nome","descricao"],"properties":{"nome":{"type":"string","description":"Nome do tema"},"tema":{"type":"string","description":"Identificador do tema"},"descricao":{"type":"string","description":"Descrição do tema"}},"additionalProperties":false},"description":"Lista de temas disponíveis (somente no modo 'listar')"},"codigo":{"type":"string","description":"Código específico do tema, quando informado"},"formato":{"type":"string","description":"Formato de saída (geojson, topojson, svg)"},"resolucao":{"type":"string","description":"Resolução da malha (0 = contorno, 5 = com municípios)"}},"required":["tema"]},"description_zh":"从 IBGE 获取专题地理网格。\n\n可用主题：\n- 生物群：巴西生物群落（亚马逊、塞拉多、大西洋森林、卡廷加、潘帕、潘塔纳尔湿地）\n- amazonia_legal：亚马逊合法区域\n- semiarido：半干旱地区\n- costeiro：沿海地区\n- fronteira：边境地带\n- 大都市：大都市地区\n- 骑行：综合开发区\n\n生物群落代码：\n- 1：亚马逊\n- 2：塞拉多\n- 3：大西洋森林\n- 4：卡廷加\n- 5：潘帕\n- 6：潘塔纳尔湿地\n\n示例：\n- 所有生物群落：tema=\"biomas\"\n- 亚马逊生物群落：tema=“biomas”，codigo=“1”\n- 亚马逊合法：tema=\"amazonia_legal\"\n- 大都市地区：tema=\"metropolitana\"\n- 与市政当局：tema =“biomas”，resolucao =“5”\n- 列表主题：tema=\"listar\"\n\n在以下情况下使用不同的工具：\n- 行政网格（巴西/地区/州/市概要）→ ibge_malhas\n\n行为：只读和幂等 - 针对公共 IBGE Malhas API 的实时 GET。以请求的格式（GeoJSON、TopoJSON 或 SVG）返回网格。"},{"name":"ibge_vizinhos","description":"Finds nearby/neighboring municipalities.\n\nFeatures:\n- Search by IBGE code (7 digits) or municipality name\n- Returns municipalities in the same mesoregion (proximity approximation)\n- Optionally includes population data\n\nNote: Uses mesoregion as geographic proximity proxy.\nFor exact spatial neighborhood, mesh processing would be required.\n\nExamples:\n- By code: municipio=\"3550308\"\n- By name: municipio=\"Campinas\", uf=\"SP\"\n- With population: municipio=\"3550308\", incluir_dados=true\n\nNote: proximity is approximated by shared mesoregion (not exact spatial adjacency).\nFor listing/searching municipalities, use ibge_municipios.\n\nBehavior: read-only and idempotent — a live GET against the public IBGE Localidades API. Returns a Markdown list.","inputSchema":{"type":"object","properties":{"uf":{"type":"string","description":"Estado por sigla (SP), nome (São Paulo) ou código IBGE (35) — obrigatório se usar nome do município"},"raio":{"type":"number","description":"Raio em km para buscar municípios próximos (usa centróides)"},"municipio":{"type":"string","description":"Código IBGE do município (7 dígitos) ou nome do município"},"incluir_dados":{"type":"boolean","default":false,"description":"Incluir dados populacionais dos vizinhos"}}},"outputSchema":{"type":"object","properties":{"total":{"type":"number","description":"Quantidade de municípios próximos encontrados"},"vizinhos":{"type":"array","items":{"type":"object","required":["codigo","nome"],"properties":{"uf":{"type":"string","description":"Sigla da UF do município vizinho"},"nome":{"type":"string","description":"Nome do município vizinho"},"codigo":{"type":"string","description":"Código IBGE do município vizinho"},"populacao":{"type":"number","description":"População do município vizinho (apenas quando incluir_dados=true)"}},"additionalProperties":false},"description":"Lista de municípios próximos (mesma mesorregião)"},"municipio":{"type":"object","required":["codigo","nome"],"properties":{"nome":{"type":"string","description":"Nome do município consultado"},"codigo":{"type":"string","description":"Código IBGE do município consultado"}},"description":"Município de referência da consulta","additionalProperties":false}},"required":["municipio","vizinhos","total"]},"description_zh":"查找附近/邻近的城市。\n\n特点：\n- 按 IBGE 代码（7 位数字）或城市名称搜索\n- 返回同一中区域的城市（邻近近似值）\n- 可选择包括人口数据\n\n注意：使用中间区域作为地理邻近度代理。\n对于精确的空间邻域，需要网格处理。\n\n示例：\n- 通过代码：municipio=\"3550308\"\n- 按名称：municipio=“坎皮纳斯”，uf=“SP”\n- 人口：municipio=\"3550308\", incluir_dados=true\n\n注意：邻近度是通过共享中间区域来近似的（不是精确的空间邻接）。\n要列出/搜索城市，请使用 ibge_municipios。\n\n行为：只读和幂等 - 针对公共 IBGE Localidades API 的实时 GET。返回 Markdown 列表。"},{"name":"ibge_datasaude","description":"Queries Brazil health indicators, served through IBGE's SIDRA (some originally produced by DataSUS, e.g. mortality and births).\n\nMortality and Birth:\n- mortalidade_infantil: Infant mortality rate\n- nascidos_vivos: Live births by location\n- obitos: Deaths by residence\n- obitos_causas: Deaths by cause (ICD-10)\n\nDemographic Indicators:\n- esperanca_vida: Life expectancy at birth\n- fecundidade: Fertility rate\n\nSanitation:\n- saneamento_agua: Water supply\n- saneamento_esgoto: Sewage system\n\nHealth Coverage:\n- plano_saude: Health insurance coverage\n- autoavaliacao_saude: Self-rated health status\n\nTerritorial levels: 1=Brazil, 2=Region, 3=State, 6=Municipality\n\nExamples:\n- Infant mortality: indicador=\"mortalidade_infantil\"\n- Life expectancy by state: indicador=\"esperanca_vida\", nivel_territorial=\"3\"\n- Deaths in SP: indicador=\"obitos\", nivel_territorial=\"3\", localidade=\"35\"\n- List indicators: indicador=\"listar\"\n\nUse a different tool when:\n- A single municipality's general panel (which also includes infant mortality) → ibge_cidades\n- Population/demographic counts (not health-specific) → ibge_censo or ibge_sidra\n\nBehavior: read-only and idempotent — a live GET against the public IBGE SIDRA API. Returns Markdown plus a typed structuredContent payload.","inputSchema":{"type":"object","properties":{"campos":{"type":"string","description":"Selecionar apenas algumas colunas por rótulo, separadas por vírgula (ex: 'Valor,Ano'). Reduz o volume da resposta."},"formato":{"enum":["tabela","json"],"type":"string","default":"tabela","description":"Formato de saída"},"periodo":{"type":"string","default":"last","description":"Período: 'last', 'all', ou ano específico"},"indicador":{"type":"string","description":"Indicador de saúde. Disponíveis:\n- mortalidade_infantil: Taxa de mortalidade infantil\n- esperanca_vida: Esperança de vida ao nascer\n- nascidos_vivos: Nascidos vivos\n- obitos: Óbitos por local de residência\n- obitos_causas: Óbitos por causas (CID-10)\n- fecundidade: Taxa de fecundidade\n- saneamento_agua: Abastecimento de água\n- saneamento_esgoto: Esgotamento sanitário\n- plano_saude: Cobertura de plano de saúde\n- listar: Lista indicadores disponíveis"},"localidade":{"type":"string","default":"all","description":"Código da localidade ou 'all'"},"nivel_territorial":{"type":"string","default":"1","description":"Nível territorial (código N): 1=Brasil, 2=Região, 3=UF, 6=Município"}}},"outputSchema":{"type":"object","properties":{"nome":{"type":"string","description":"Nome do indicador"},"fonte":{"type":"string","description":"Fonte do dado"},"colunas":{"type":"array","items":{"type":"string"},"description":"Rótulos das colunas, na ordem"},"indicador":{"type":"string","description":"Chave do indicador de saúde consultado"},"registros":{"type":"array","items":{"type":"object","additionalProperties":{"type":"string"}},"description":"Registros: cada um mapeia rótulo da coluna -\u003e valor"},"totalRegistros":{"type":"number","description":"Total de registros de dados"}},"required":["totalRegistros","colunas","registros"]},"description_zh":"查询巴西健康指标，通过 IBGE 的 SIDRA 提供（一些最初由 DataSUS 生成，例如死亡率和出生率）。\n\n死亡率和出生率：\n- mortalidade_infantil：婴儿死亡率\n- nascidos_vivos：按地点划分的活产数\n- obitos：按居住地划分的死亡人数\n- obitos_causas：按原因划分的死亡 (ICD-10)\n\n人口统计指标：\n- esperanca_vida：出生时的预期寿命\n- fecundidade：生育率\n\n卫生：\n- saneamento_agua：供水\n- saneamento_esgoto：污水系统\n\n健康保险：\n- plano_saude：健康保险范围\n- autoavaliacao_saude：自评健康状况\n\n领土级别：1=巴西、2=地区、3=州、6=直辖市\n\n示例：\n- 婴儿死亡率：indicador=\"mortalidade_infantil\"\n- 各州预期寿命：indicador=\"esperanca_vida\", nivel_territorial=\"3\"\n- SP 死亡人数：indicador=\"obitos\"、nivel_territorial=\"3\"、localidade=\"35\"\n- 列表指标：indicador=\"listar\"\n\n在以下情况下使用不同的工具：\n- 单一市政府的综合小组（还包括婴儿死亡率）→ ibge_cidades\n- 人口/人口统计（非健康特定）→ ibge_censo 或 ibge_sidra\n\n行为：只读和幂等 - 针对公共 IBGE SIDRA API 的实时 GET。返回 Markdown 加上类型化的 StructuredContent 有效负载。"},{"name":"ibge_paises","description":"Queries international country data via IBGE.\n\nFeatures:\n- List all countries (following UN M49 methodology)\n- Country details (area, languages, currency, location)\n- Search countries by name\n- Filter by region/continent\n\nAvailable regions: americas, europa, africa, asia, oceania\n\nCountry codes: Use ISO-ALPHA-2 (e.g., BR, US, AR, PT, JP)\n\nExamples:\n- List all: tipo=\"listar\"\n- Brazil details: tipo=\"detalhes\", pais=\"BR\"\n- Search: tipo=\"buscar\", busca=\"Argentina\"\n- Americas countries: tipo=\"listar\", regiao=\"americas\"\n- Available indicators: tipo=\"indicadores\"\n\nBehavior: read-only and idempotent — a live GET against the public IBGE Países API. Returns Markdown.","inputSchema":{"type":"object","properties":{"pais":{"type":"string","description":"Código ISO-ALPHA-2 do país (ex: BR, US, AR) ou código M49"},"tipo":{"enum":["listar","detalhes","indicadores","buscar"],"type":"string","default":"listar","description":"Tipo de consulta: listar (todos), detalhes (de um país), indicadores, buscar"},"busca":{"type":"string","description":"Termo de busca para filtrar países pelo nome"},"regiao":{"type":"string","description":"Filtrar por região/continente: americas, europa, africa, asia, oceania"},"indicadores":{"type":"string","description":"IDs dos indicadores separados por | (ex: 77819|77820)"}}},"outputSchema":{"type":"object","properties":{"pais":{"type":"object","required":["nome","m49","isoAlpha2","isoAlpha3"],"properties":{"m49":{"type":"number","description":"Código M49 do país"},"nome":{"type":"string","description":"Nome do país"},"moedas":{"type":"array","items":{"type":"object","required":["id","nome"],"properties":{"id":{"type":"string","description":"Código da unidade monetária"},"nome":{"type":"string","description":"Nome da unidade monetária"}},"additionalProperties":false},"description":"Unidades monetárias do país"},"regiao":{"type":"string","description":"Nome da região/continente"},"linguas":{"type":"array","items":{"type":"string"},"description":"Línguas faladas no país"},"historico":{"type":"string","description":"Texto histórico sobre o país"},"isoAlpha2":{"type":"string","description":"Código ISO-ALPHA-2"},"isoAlpha3":{"type":"string","description":"Código ISO-ALPHA-3"},"subRegiao":{"type":"string","description":"Nome da sub-região"},"indicadores":{"type":"array","items":{"type":"object","required":["indicador","valor","ano"],"properties":{"ano":{"type":"string","description":"Ano de referência do valor"},"valor":{"type":"string","description":"Valor mais recente do indicador"},"indicador":{"type":"string","description":"Nome do indicador"}},"additionalProperties":false},"description":"Indicadores principais com o valor mais recente disponível"},"areaTotalKm2":{"type":"number","description":"Área territorial total em km²"},"regiaoIntermediaria":{"type":"string","description":"Nome da região intermediária"}},"description":"Detalhes de um país específico (modo detalhes)","additionalProperties":false},"tipo":{"enum":["listar","buscar","detalhes","indicadores"],"type":"string","description":"Modo de consulta que originou este resultado"},"busca":{"type":"string","description":"Termo de busca aplicado, se houver"},"total":{"type":"number","description":"Total de países encontrados (modos listar/buscar)"},"paises":{"type":"array","items":{"type":"object","required":["codigo","nome","regiao","subRegiao"],"properties":{"nome":{"type":"string","description":"Nome do país"},"codigo":{"type":"string","description":"Código ISO-ALPHA-2 do país (ou '-' se ausente)"},"regiao":{"type":"string","description":"Nome da região/continente (ou '-' se ausente)"},"subRegiao":{"type":"string","description":"Nome da sub-região (ou '-' se ausente)"}},"additionalProperties":false},"description":"Lista de países (modos listar/buscar). Limitada aos 50 primeiros na exibição"},"regiao":{"type":"string","description":"Filtro de região/continente aplicado, se houver"},"indicadores":{"type":"array","items":{"type":"object","required":["id","nome","alias"],"properties":{"id":{"type":"number","description":"ID do indicador na API do IBGE"},"nome":{"type":"string","description":"Nome do indicador"},"alias":{"type":"string","description":"Apelido amigável do indicador"}},"additionalProperties":false},"description":"Indicadores disponíveis para consulta de países (modo indicadores)"}},"required":["tipo"]},"description_zh":"通过IBGE查询国际国家数据。\n\n特点：\n- 列出所有国家（遵循 UN M49 方法）\n- 国家详细信息（地区、语言、货币、位置）\n- 按名称搜索国家\n- 按地区/大陆过滤\n\n可用区域：美洲、欧洲、非洲、亚洲、大洋洲\n\n国家/地区代码：使用 ISO-ALPHA-2（例如 BR、US、AR、PT、JP）\n\n示例：\n- 列出全部：tipo=\"listar\"\n- 巴西详细信息：tipo=\"detalhes\", pais=\"BR\"\n- 搜索：tipo=\"buscar\"、busca=\"阿根廷\"\n- 美洲国家：tipo=“listar”，regiao=“americas”\n- 可用指标：tipo=\"indicadores\"\n\n行为：只读和幂等 - 针对公共 IBGE Países API 的实时 GET。返回 Markdown。"},{"name":"ibge_cidades","description":"Queries municipal indicators from IBGE (similar to Cidades@ portal).\n\nFeatures:\n- General overview of a municipality (population, HDI, GDP, etc.)\n- Query specific indicators\n- Historical indicator data over years\n- List available surveys and indicators\n\nAvailable indicators: populacao, area, densidade, pib_per_capita, idh,\nescolarizacao, mortalidade, salario_medio, receitas, despesas\n\nExamples:\n- São Paulo overview: tipo=\"panorama\", municipio=\"3550308\"\n- Population history: tipo=\"historico\", municipio=\"3550308\", indicador=\"populacao\"\n- View surveys: tipo=\"pesquisas\"\n- Available indicators: tipo=\"indicador\"\n\nThis tool is the panel for a SINGLE municipality (Cidades@).\nUse a different tool when:\n- Real-time Brazil population → ibge_populacao\n- Census themes / historical series → ibge_censo\n- Comparing multiple municipalities → ibge_comparar\n- A macro indicator time series → ibge_indicadores\n\nBehavior: read-only and idempotent — a live GET against the public IBGE APIs (Cidades@/agregados). Returns Markdown plus a typed structuredContent payload.","inputSchema":{"type":"object","properties":{"uf":{"type":"string","description":"Código ou sigla da UF para filtrar (ex: 35 ou SP)"},"tipo":{"enum":["panorama","indicador","pesquisas","historico"],"type":"string","default":"panorama","description":"Tipo de consulta: panorama (resumo geral), indicador (específico), pesquisas (listar), historico"},"pesquisa":{"type":"string","description":"ID da pesquisa para filtrar indicadores"},"indicador":{"type":"string","description":"ID do indicador ou nome para busca"},"municipio":{"type":"string","description":"Código IBGE do município (7 dígitos)"}}},"outputSchema":{"type":"object","properties":{"nome":{"type":"string","description":"Nome do município/indicador"},"tipo":{"type":"string","description":"Tipo de consulta (panorama, indicador, pesquisas, historico)"},"municipio":{"type":"string","description":"Código IBGE do município"},"indicadores":{"type":"array","items":{"type":"object","required":["nome","valor"],"properties":{"ano":{"type":"string"},"nome":{"type":"string"},"valor":{"type":"string"}},"additionalProperties":false},"description":"Indicadores retornados (vazio para respostas de catálogo)"}},"required":["tipo","indicadores"]},"description_zh":"从 IBGE 查询市政指标（类似于 Cidades@ 门户）。\n\n特点：\n- 城市概况（人口、人类发展指数、国内生产总值等）\n- 查询具体指标\n- 历年历史指标数据\n- 列出可用的调查和指标\n\n可用指标：人口、面积、密度、人均GDP、IDH、\n受教育程度、死亡率、平均工资、收入、支出\n\n示例：\n- 圣保罗概览：type=\"panorama\"，市政当局=\"3550308\"\n- 人口历史：类型=“历史”，自治市=“3550308”，指标=“人口”\n- 查看调查：type=\"surveys\"\n- 可用指标：type=\"indicator\"\n\n该工具是单个城市 (Cities@) 的面板。\n在以下情况下使用不同的工具：\n- 实时巴西人口 → ibge_populacao\n- 人口普查主题/历史系列 → ibge_censo\n- 比较多个城市 → ibge_comparar\n- 指标时间序列宏 → ibge_indicadores\n\n行为：只读和幂等 - 针对公共 IBGE API (Cidades@/aggregados) 的实时 GET。返回 Markdown 加上类型化的 StructuredContent 有效负载。"}],"init_ref_tasks":[],"others":{"source_metadata":{"source_id":"f8d4ab7c-5113-476f-b692-b4f482c5ecbc","qualified_name":"sidneybissoli/ibge-br-mcp","display_name":"IBGE Brasil MCP","namespace":"sidneybissoli","slug":"ibge-br-mcp","verified":true,"use_count":2521,"remote":true,"is_deployed":true,"unlisted":false,"inactive":false,"created_at":"2026-01-18T13:06:00.033Z","homepage":"https://ibge.sidneybissoli.com","by_smithery":false,"owner":"org_01KNBTYWT7TPCV541JA7YZWX69","score":null,"deployment_url":"https://ibge-br-mcp--sidneybissoli.run.tools","connections":[{"type":"http","deployment_url":"https://ibge-br-mcp--sidneybissoli.run.tools","config_schema":{}}],"prompts":[{"name":"comparar-municipios","description":"Compara 2 a 10 localidades (municípios ou UFs) em um indicador e produz um ranking comentado.","arguments":[{"name":"localidades","description":"Localidades separadas por vírgula — códigos IBGE ou nomes (ex.: 'São Paulo, Rio de Janeiro, Belo Horizonte')","required":true},{"name":"indicador","description":"Indicador a comparar (ex.: populacao, pib, densidade, alfabetizacao). Padrão: populacao","required":false}]},{"name":"perfil-demografico","description":"Monta um perfil demográfico de uma localidade combinando população, censo e indicadores socioeconômicos.","arguments":[{"name":"localidade","description":"Município ou UF — código IBGE ou nome (ex.: '3550308' ou 'São Paulo')","required":true}]}],"resources":[{"name":"ufs","uri":"ibge://catalogos/ufs","description":"As 27 Unidades da Federação com código IBGE (2 dígitos), sigla, nome e região.","mimeType":"application/json"},{"name":"regioes","uri":"ibge://catalogos/regioes","description":"As 5 grandes regiões com código, sigla, nome e UFs que as compõem.","mimeType":"application/json"},{"name":"niveis-territoriais","uri":"ibge://catalogos/niveis-territoriais","description":"Códigos de nível territorial (nivel_territorial) aceitos pelas tools SIDRA, com rótulo e nome.","mimeType":"application/json"},{"name":"tabelas-sidra","uri":"ibge://catalogos/tabelas-sidra","description":"Códigos das tabelas SIDRA mais usadas (população, PIB, IPCA, etc.) com descrição.","mimeType":"application/json"},{"name":"biomas","uri":"ibge://catalogos/biomas","description":"Códigos dos 6 biomas brasileiros (usados por ibge_malhas_tema).","mimeType":"application/json"}]},"data_directions":["Brazilian geographic reference data: regions, states, municipalities, districts, IBGE codes, and locality hierarchies","Geospatial boundaries and thematic meshes in GeoJSON, TopoJSON, or SVG, including biomes, the Legal Amazon, semi-arid areas, coastal zones, border strips, and metropolitan regions","Population data: real-time national projection, annual estimates, historical census totals, density, births, deaths, fertility, and life expectancy","Demographic Census data from 1970 through 2022, including age, sex, race or color, religion, literacy, education, employment, income, and housing","SIDRA statistical tables, metadata, variables, classifications, categories, territorial levels, periods, and survey provenance","Economic indicators: GDP, GDP growth, GDP per capita, industrial production, retail trade, services, and municipal economic profiles","Price and labor indicators: IPCA, INPC, unemployment, occupation, earnings, and informality","Municipal indicators and historical series, including population, area, density, HDI, schooling, mortality, wages, revenues, and expenditures","Health and sanitation indicators, including infant mortality, live births, deaths, causes of death, water supply, sewage, and health coverage","Cross-locality comparisons and rankings for municipalities or states, with summary statistics","Official economic activity classifications through CNAE codes, descriptions, and hierarchies","Brazilian name frequencies and rankings by decade, sex, and locality","IBGE surveys, research programs, available tables, publication news, press releases, and release or collection calendars","International country reference data, including country codes, regions, area, languages, currencies, and location","Approximate nearby-municipality discovery using shared mesoregions, with optional population context"],"organization_status":"agent_organized"}},{"global_id":"smithery_sailquery_niche_9","schema_version":"1.0","environment":{"basic_info":{"source":"smithery","url":"https://smithery.ai/servers/sailquery/niche","name":"sailquery/niche","index":9},"description":"Niche is an editorial-intelligence and content-production service for creators, agents, and brands. It scans fresh primary sources, clusters and ranks emerging stories, recommends defensible editorial angles, and converts selected ideas into source-grounded, platform-native content for LinkedIn, X, Instagram, newsletters, articles, images, and reels. It also supports brand and voice profiles, content revision, publishing approval workflows, session management, and provenance-rich editorial-calendar exports.","description_zh":"Niche 是面向创作者、智能体和品牌的编辑情报与内容生产服务。它扫描最新的一手来源，对新兴故事进行聚类和排序，推荐有依据的编辑角度，并将选定想法转换为基于来源、适合各平台的 LinkedIn、X、Instagram、新闻简报、文章、图片和短视频内容。它还支持品牌与声音档案、内容修订、发布审批工作流、会话管理，以及包含丰富来源信息的编辑日历导出。","domain":{"level1":"general","level2":null,"level3":null}},"init_ref_tools":[{"name":"niche_signal_scan","description":"Niche (nicheangle.com) story discovery: find stories worth writing about, then draft and publish platform-native social content (LinkedIn, X threads, Instagram, newsletter) from them. This is story discovery, not content generation: Niche reads primary sources, separates signal from noise, and clusters it into a ranked story slate with provenance — the editorial-intelligence step before any writing. Returns a session_id + initial status; poll niche_session_state with the session_id until status is `cp1_awaiting_story` to read the slate.\n\nBRAND PROFILE: pass `brand_id` to bind this run to a persisted brand profile (set via niche_brand_profile_set). The profile's voice, lexicon, framing, channel config, and verifier overrides thread through every downstream stage. Pass `profile_overrides` alongside `brand_id` to deep-merge a one-time deviation onto the persisted profile (logged on the session, not stored). The effective profile is snapshotted at scan time — subsequent updates to the persisted profile don't affect in-flight runs.","inputSchema":{"type":"object","properties":{"niche":{"type":"string","maxLength":200,"minLength":2,"description":"Niche / beat description (2-200 chars). Specific is better."},"density":{"enum":["minimal","balanced","essay"],"type":"string","default":"balanced","description":"How tightly to pack visual formats (carousels especially).\n  • minimal — split a dense argument across MORE, shorter slides; favors skimmability.\n  • balanced (default) — the standard per-slide caps.\n  • essay — permissive; allows longer slides/sections.\nOver-cap slides auto-split on sentence boundaries (never mid-sentence); over-280 tweets split into a chain regardless."},"recency":{"type":"string","description":"Optional recency window — constrains discovery to fresh sources. One of '24h' | 'week' | 'month' | 'quarter' | 'year' (aliases: 'today'/'day'→24h, 'this week'→week, …). Use '24h' for 'today only / breaking'. Putting the demand in the niche STRING does NOT constrain recency — use this param. Omit to use the niche's default window."},"brand_id":{"type":"string","description":"Optional — bind this run to a persisted brand profile. Profile threads through voice, lexicon, framing, channels, verifier overrides. Set via niche_brand_profile_set."},"recency_strict":{"type":"boolean","description":"When true, `recency` is a HARD cutoff — sources outside the window are dropped before clustering, so 'nothing older than yesterday' is honored exactly. Default false: the window is a strong bias but older corroborating sources can still attach to a fresh cluster. Set true only when exactness matters more than slate depth (strict can thin the slate)."},"source_quality":{"enum":["strict","balanced","broad"],"type":"string","default":"balanced","description":"How aggressively to filter the slate on source quality (niche-relative — never penalizes a small publication that is THE authority for the niche).\n  • strict — drop uncorroborated single-source silos that aren't a primary/official or a niche authority (confirmed junk); surfaces only well-sourced stories. Can thin the slate.\n  • balanced (default) — down-weight weak sources, don't drop.\n  • broad — surface everything, including low-coverage emerging clusters, with authority as a tiebreaker only.\nUse strict for a high-trust brief, broad to scout early signal."},"target_outputs":{"type":"array","items":{"type":"string"},"description":"Output cells to generate (platform×content_type matrix). Each cell is a 'platform:content_type' string OR a cross-platform content type. Valid cells:\n  • linkedin:text_post — short LinkedIn post (text only)\n  • linkedin:image_post — LinkedIn post + 1.91:1 image card\n  • linkedin:carousel — multi-slide carousel\n  • linkedin:reel — LinkedIn-native vertical video\n  • x:single_tweet — standalone tweet\n  • x:thread — multi-tweet thread\n  • x:image_post — tweet + 16:9 image card\n  • x:reel — tweet + 9:16 video\n  • instagram:image_post — caption + 4:5 image card\n  • instagram:carousel — multi-image swipe\n  • instagram:reel — caption + 9:16 reel\n  • long_form_article — universal essay (Substack/blog)\n\nA bare platform name also works and maps to that platform's default cell: 'x'/'twitter'→x:thread, 'linkedin'/'li'→linkedin:text_post, 'instagram'/'ig'→instagram:image_post, 'longform'→long_form_article. The resolved cells are echoed back as target_outputs.\nDefaults to ['linkedin:text_post'] — narrow because every extra cell burns generation + verifier tokens you usually don't need."},"idempotency_key":{"type":"string","description":"Optional. A stable key for this logical scan — a retry with the same key reuses the original run instead of starting (and billing) a second. E
