<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentWorld 环境数据预览</title>
<style>
:root {
  color-scheme: light;
  --bg: #f4f6f7;
  --surface: #ffffff;
  --surface-2: #eef2f3;
  --line: #d5dcdf;
  --line-strong: #aeb9bd;
  --text: #172126;
  --muted: #617076;
  --green: #16784c;
  --green-bg: #e5f4ec;
  --blue: #215f9a;
  --blue-bg: #e8f1f8;
  --amber: #946200;
  --amber-bg: #fbf0cf;
  --red: #a43c38;
  --red-bg: #f9e9e7;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font-family: var(--sans); }
body { min-width: 320px; }
button { font: inherit; letter-spacing: 0; }
.app { display: grid; grid-template-columns: 280px minmax(0, 1fr); min-height: 100vh; }
.sidebar { position: sticky; top: 0; height: 100vh; overflow: auto; background: #202b30; color: #fff; border-right: 1px solid #11191d; }
.brand { padding: 22px 20px 18px; border-bottom: 1px solid #3b474c; }
.brand h1 { margin: 0; font-size: 17px; font-weight: 680; }
.brand p { margin: 6px 0 0; color: #b9c4c8; font-size: 12px; }
.env-list { padding: 12px; display: grid; gap: 8px; }
.env-button { width: 100%; min-height: 84px; padding: 12px; border: 1px solid #455258; border-radius: 5px; background: #29363b; color: #fff; text-align: left; cursor: pointer; }
.env-button:hover { border-color: #829096; }
.env-button.active { background: #f7faf9; color: var(--text); border-color: #f7faf9; }
.env-button strong { display: block; font-size: 13px; line-height: 1.4; overflow-wrap: anywhere; }
.env-button small { display: block; margin-top: 7px; color: #b9c4c8; font-size: 11px; }
.env-button.active small { color: var(--muted); }
.main { min-width: 0; }
.topbar { background: var(--surface); border-bottom: 1px solid var(--line); padding: 22px clamp(18px, 3vw, 42px) 0; }
.title-row { display: flex; gap: 18px; align-items: flex-start; justify-content: space-between; }
.title-row h2 { margin: 0; font-size: clamp(21px, 2.3vw, 30px); line-height: 1.2; letter-spacing: 0; }
.title-row p { margin: 8px 0 18px; max-width: 900px; color: var(--muted); font-size: 14px; line-height: 1.65; }
.status { display: flex; gap: 7px; flex-wrap: wrap; justify-content: flex-end; }
.badge { display: inline-flex; align-items: center; min-height: 25px; padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: 700; white-space: nowrap; }
.badge.green { color: var(--green); background: var(--green-bg); }
.badge.blue { color: var(--blue); background: var(--blue-bg); }
.badge.amber { color: var(--amber); background: var(--amber-bg); }
.tabs { display: flex; gap: 4px; overflow-x: auto; }
.tab { min-width: 92px; height: 42px; border: 0; border-bottom: 3px solid transparent; background: transparent; color: var(--muted); cursor: pointer; }
.tab.active { color: var(--text); border-bottom-color: var(--green); font-weight: 700; }
.content { padding: 24px clamp(18px, 3vw, 42px) 52px; max-width: 1500px; margin: 0 auto; }
.metric-grid { display: grid; grid-template-columns: repeat(6, minmax(100px, 1fr)); border: 1px solid var(--line); background: var(--surface); }
.metric { padding: 15px 16px; border-right: 1px solid var(--line); min-width: 0; }
.metric:last-child { border-right: 0; }
.metric span { display: block; color: var(--muted); font-size: 11px; }
.metric strong { display: block; margin-top: 5px; font-size: 21px; overflow-wrap: anywhere; }
.section { margin-top: 28px; }
.section-head { display: flex; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 12px; }
.section h3 { margin: 0; font-size: 16px; }
.section-head p { margin: 0; color: var(--muted); font-size: 12px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.model-wrap { overflow: auto; padding: 14px; }
.model-svg { display: block; min-width: 760px; width: 100%; }
.need-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-top: 1px solid var(--line); }
.need { padding: 14px 16px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.need:nth-child(2n) { border-right: 0; }
.need strong { font: 600 12px var(--mono); overflow-wrap: anywhere; }
.need p { margin: 7px 0 0; color: var(--muted); font-size: 12px; line-height: 1.55; }
.need .binding { margin-top: 9px; display: flex; gap: 5px; flex-wrap: wrap; }
code, .code { font-family: var(--mono); }
.token { display: inline-block; padding: 3px 6px; border: 1px solid var(--line); border-radius: 3px; background: var(--surface-2); font: 11px var(--mono); overflow-wrap: anywhere; }
.split { display: grid; grid-template-columns: minmax(240px, 0.34fr) minmax(0, 1fr); min-height: 620px; }
.list { border-right: 1px solid var(--line); overflow: auto; max-height: 760px; }
.list-button { width: 100%; min-height: 70px; padding: 12px 14px; border: 0; border-bottom: 1px solid var(--line); background: #fff; text-align: left; cursor: pointer; }
.list-button:hover { background: #f7f9f9; }
.list-button.active { background: var(--green-bg); box-shadow: inset 3px 0 var(--green); }
.list-button strong { display: block; font: 600 12px var(--mono); overflow-wrap: anywhere; }
.list-button small { display: block; margin-top: 6px; color: var(--muted); }
.detail { min-width: 0; padding: 20px; overflow: auto; }
.detail h4 { margin: 0; font-size: 17px; }
.detail .desc { margin: 8px 0 18px; color: var(--muted); font-size: 13px; line-height: 1.6; }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
th { padding: 9px 10px; color: var(--muted); background: var(--surface-2); border-bottom: 1px solid var(--line); text-align: left; font-weight: 650; }
td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: top; line-height: 1.5; overflow-wrap: anywhere; }
tr:last-child td { border-bottom: 0; }
.table-scroll { overflow: auto; border: 1px solid var(--line); }
.sample-tabs { display: flex; gap: 5px; margin: 18px 0 8px; }
.sample-tab { border: 1px solid var(--line); background: #fff; border-radius: 4px; padding: 6px 9px; cursor: pointer; font-size: 11px; }
.sample-tab.active { border-color: var(--blue); color: var(--blue); background: var(--blue-bg); }
pre { margin: 0; max-height: 360px; overflow: auto; padding: 14px; background: #172126; color: #e8eff1; font: 11px/1.55 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; }
.relations td:first-child, .relations td:nth-child(2), .relations td:nth-child(3) { font-family: var(--mono); }
.file-layout { display: grid; grid-template-columns: minmax(260px, .38fr) minmax(0, 1fr); min-height: 620px; }
.scope-column { border-right: 1px solid var(--line); }
.scope-head { padding: 16px; border-bottom: 1px solid var(--line); background: var(--surface-2); }
.scope-head h4 { margin: 0; font-size: 13px; }
.scope-head p { margin: 7px 0 0; color: var(--muted); font-size: 12px; line-height: 1.5; }
.file-button { width: 100%; min-height: 52px; padding: 10px 14px; border: 0; border-bottom: 1px solid var(--line); background: #fff; text-align: left; cursor: pointer; }
.file-button.active { background: var(--blue-bg); box-shadow: inset 3px 0 var(--blue); }
.file-button code { display: block; font-size: 11px; overflow-wrap: anywhere; }
.file-button small { color: var(--muted); }
.empty { padding: 42px; text-align: center; color: var(--muted); }
@media (max-width: 1050px) {
  .metric-grid { grid-template-columns: repeat(3, 1fr); }
  .metric:nth-child(3) { border-right: 0; }
  .metric:nth-child(-n+3) { border-bottom: 1px solid var(--line); }
}
@media (max-width: 760px) {
  .app { display: block; }
  .sidebar { position: static; height: auto; }
  .env-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .title-row { display: block; }
  .status { justify-content: flex-start; margin-bottom: 10px; }
  .split, .file-layout { grid-template-columns: 1fr; }
  .list, .scope-column { border-right: 0; border-bottom: 1px solid var(--line); max-height: 280px; }
  .need-grid { grid-template-columns: 1fr; }
  .need { border-right: 0; }
}
@media (max-width: 500px) {
  .env-list { grid-template-columns: 1fr; }
  .metric-grid { grid-template-columns: repeat(2, 1fr); }
  .metric { border-bottom: 1px solid var(--line); }
  .metric:nth-child(2n) { border-right: 0; }
  .metric:nth-last-child(-n+2) { border-bottom: 0; }
}
</style>
</head>

const DATA = {"schemaVersion":"2.0","environments":[{"id":"openzeppelin_contract_review_25","packageName":"smithery_openzeppelin_25","name":"OpenZeppelin Contract Review Evidence","description":"Release-pinned OpenZeppelin module metadata, canonical ERC requirements, and upstream compatibility evidence for offline contract-design review. Public deployment metadata and issuer operations remain explicit boundaries because the investigated sources did not yield verified records.","qualityTier":"rich","integrationTier":"integrated","valid":true,"recordSets":[{"id":"release_catalog","name":"OpenZeppelin Releases","description":"A record represents a published OpenZeppelin Contracts release and its release-pinned repository revision used to resolve module provenance and release notes.","importance":"supporting","access":"read_only","keyFields":["release_tag"],"count":4,"fields":[{"name":"release_tag","type":"string","nullable":false,"description":"Publisher release tag.","reference":null},{"name":"commit_sha","type":"string","nullable":false,"description":"Repository revision named by the release metadata.","reference":null},{"name":"published_at","type":"string","nullable":false,"description":"Release publication timestamp from the maintainer API.","reference":null},{"name":"prerelease","type":"boolean","nullable":false,"description":"Whether the publisher marks the release as a prerelease.","reference":null},{"name":"release_title","type":"string","nullable":true,"description":"Optional human-readable release title supplied by the publisher.","reference":null},{"name":"release_notes","type":"string","nullable":false,"description":"Maintainer release-note text used as compatibility evidence.","reference":null},{"name":"release_url","type":"string","nullable":false,"description":"Canonical web URL for the published release.","reference":null}],"samples":[{"release_tag":"v5.6.0","commit_sha":"56a3de2cea907c9a500d32e70c275f68393b7ba6","published_at":"2026-02-25T17:07:34Z","prerelease":0,"release_title":"v5.6.0","release_notes":"### Breaking changes\r\n\r\n- `Strings`: The `escapeJSON` function now escapes all control characters in the range U+0000 to U+001F per RFC-4627. Previously only backspace, tab, newline, form feed, carriage return, double quote, and backslash were escaped. Input strings containing any other control character (e.g. null `0x00`) or raw bytes in U+0001–U+001F will now produce different, longer output (e.g. `\\u0000` for null). ([#6344](https://github.com/OpenZeppelin/openzeppelin-contracts/pull/6344))\r\n- `ERC1155`: Performing batch transfers with exactly one id/value in the batch no-longer calls `IERC1155Receiver.onERC1155Received`. `IERC1155Receiver.onERC1155BatchReceived` is called instead (with arrays of length one). ([#6170](https://github.com/OpenZeppelin/openzeppelin-contracts/pull/6170))\r\n- `ERC1967Proxy` and `TransparentUpgradeableProxy`: Mandate initialization during construction. Deployment now reverts with `ERC1967ProxyUninitialized` if an initialize call is not provided. Developers that rely on the previous behavior and want to disable this check can do so by overriding the internal `_unsafeAllowUninitialized` function to return true. ([#5906](https://github.com/OpenZeppelin/openzeppelin-contracts/pull/5906))\r\n- `ERC721` and `ERC1155`: Prevent setting an operator for `address(0)`. In the case of `ERC721` this type of operator allowance could lead to obfuscated mint permission. ([#6171](https://github.com/OpenZeppelin/openzeppelin-contracts/pull/6171))\r\n- `RLP`: The `encode(bytes32)` function now encodes `bytes32` as a fixed size item and not as a scalar in `encode(uint256)`. Users must replace calls to `encode(bytes32)` with `encode(uint256(bytes32))` to preserve the same behavior. ([#6167](https://github.com/OpenZeppelin/openzeppelin-contracts/pull/6167))\r\n- `ERC4337Utils`: The `parseValidationData` now returns a `ValidationRange` as the last return tuple value indicating whether the `validationData` is compared against a timestamp or block number. Developers must update their code to handle this new return value (e.g. `(aggregator, validAfter, validUntil) -> (aggregator, validAfter, validUntil, range)`). ([#6215](https://github.com/OpenZeppelin/openzeppelin-contracts/pull/6215))\r\n- `SignerWebAuthn`: The `_rawSignatureValidation` function now returns `false` when the signature is not a valid WebAuthn authentication assertion. P256 fallback is removed. Developers can add it back by overriding the function. ([#6337](https://github.com/OpenZeppelin/openzeppelin-contracts/pull/6337))\r\n- `Memory`: The `setFreeMemoryPointer` function is renamed to `unsafeSetFreeMemoryPointer`. Developers should use `unsafeSetFreeMemoryPointer` instead of `setFreeMemoryPointer` after v5.6.0. ([#6348](https://github.com/OpenZeppelin/openzeppelin-contracts/pull/6348))\r\n- `Memory`: Remove the `asBytes32` and `asPointer` function to reduce the risk of mistakes when manipulating memory pointers. ([#6340](https://github.com/OpenZeppelin/openzeppelin-contracts/pull/6340))\r\n\r\n### Changes by category\r\n\r\n#### Account\r\n\r\n- `Account`: Update default version of the ERC-4337 entrypoint to v0.9. ([#6135](https://github.com/OpenZeppelin/openzeppelin-contracts/pull/6135))\r\n- `AccountERC7579`: Do not revert and perform the uninstall if the `onUninstall` hook of a module reverts. ([#6142](https://github.com/OpenZeppelin/openzeppelin-contracts/pull/6142))\r\n- `ERC4337Utils`: Added the `paymasterSignature` function to extract the signature in `paymasterAndData` after Entrypoint v0.9. Similarly, a variant of `paymasterData` that receives a flag to exclude the signature from the returned data. ([#6215](https://github.com/OpenZeppelin/openzeppelin-contracts/pull/6215))\r\n- `ERC4337Utils`: Added variants of `packValidationData(address,uint48,uint48)` and `packValidationData(bool,uint48,uint48)` that receive a `ValidationRange` argument, could be timestamp or block number. Similarly, the `parseValidationData` now returns a `ValidationRange` too. ([#6215](https://github.com/OpenZeppelin/openzeppelin-contracts/pull/6215))\r\n\r\n#### Tokens\r\n\r\n- `ERC1155`: Introduce the `_checkAuthorized` internal virtual function to encapsulate `isApprovedForAll` and `msg.sender == from` checks. ([#6133](https://github.com/OpenZeppelin/openzeppelin-contracts/pull/6133))\r\n- `ERC1155`: Call `IERC1155Receiver.onERC1155BatchReceived` when performing a batch transfers with exactly one id/value in the batch. ([#6170](https://github.com/OpenZeppelin/openzeppelin-contracts/pull/6170))\r\n- `ERC4626`: Allow overriding underlying assets transfer mechanisms through new internal virtual functions (`_transferIn` and `_transferOut`). ([#5970](https://github.com/OpenZeppelin/openzeppelin-contracts/pull/5970))\r\n- `ERC721URIStorage`: Add `_suffixURI`, an internal getter for retrieving the custom tokenURI without the base prefix. ([#6175](https://github.com/OpenZeppelin/openzeppelin-contracts/pull/6175))\r\n- Add ERC-165 detection for the `IERC6909ContentURI`, `IERC6909TokenSupply` and `IERC6909Metadata` interfaces in the `ERC6909ContentURI`, `ERC6909TokenSupply` and `ERC6909Metadata` contracts respectively. ([#6246](https://github.com/OpenZeppelin/openzeppelin-contracts/pull/6246)) and ([#6247](https://github.com/OpenZeppelin/openzeppelin-contracts/pull/6247))\r\n\r\n#### Cross-chain\r\n\r\n- `BridgeFungible`, `BridgeERC20` and `BridgeERC7802`: Added bridge contracts to handle crosschain movements of ERC-20 (and ERC-7802) tokens. ([#5914](https://github.com/OpenZeppelin/openzeppelin-contracts/pull/5914)) ([#6328](https://github.com/OpenZeppelin/openzeppelin-contracts/pull/6328))\r\n- `CrosschainLinked`: Added a new helper contract to facilitate communication between a contract on one chain and counterparts on remote chains through ERC-7786 gateways. ([#5914](https://github.com/OpenZeppelin/openzeppelin-contracts/pull/5914))\r\n- `ERC20Crosschain`: Added an ERC-20 extension to embed an ERC-7786 based crosschain bridge directly in the token contract. ([#5914](https://github.com/OpenZeppelin/openzeppelin-contracts/pull/5914))\r\n- `InteroperableAddress`: Reject inputs with both chain reference and addresses empty. ([#6340](https://github.com/OpenZeppelin/openzeppelin-contracts/pull/6340))\r\n\r\n#### Cryptography\r\n\r\n- `MessageHashUtils`: Add helper functions to build EIP-712 domain typehash and separator with fields selectively enabled/disabled. ([#5908](https://github.com/OpenZeppelin/openzeppelin-contracts/pull/5908))\r\n- `SignatureChecker`: Add `isValidERC1271SignatureNowCalldata`, a variant of `isValidERC1271SignatureNow` that takes the signature from calldata. ([#6123](https://github.com/OpenZeppelin/openzeppelin-contracts/pull/6123))\r\n- `TrieProof`: Add library for verifying Ethereum Merkle-Patricia trie inclusion proofs. ([#5826](https://github.com/OpenZeppelin/openzeppelin-contracts/pull/5826))\r\n- `WebAuthn`: Verification now returns `false` instead of reverting when client data contains an out-of-bounds `challengeIndex`. ([#6329](https://github.com/OpenZeppelin/openzeppelin-contracts/pull/6329))\r\n\r\n#### Structures\r\n\r\n- `Accumulator`: Check that slices being added (`shift` or `push`) are in the reserved space. ([#6302](https://github.com/OpenZeppelin/openzeppelin-contracts/pull/6302))\r\n- `DoubleEndedQueue`: Add `tryPushBack`, `tryPopBack`, `tryPushFront`, `tryPopFront`, `tryFront`, `tryBack`, and `tryAt` function variants that do not revert. ([#6020](https://github.com/OpenZeppelin/openzeppelin-contracts/pull/6020))\r\n- `EnumerableMap`: Add support for `Bytes4ToAddressMap` types. ([#6091](https://github.com/OpenZeppelin/openzeppelin-contracts/pull/6091))\r\n- `EnumerableSet`: Add support for `Bytes4Set` type. ([#6091](https://github.com/OpenZeppelin/openzeppelin-contracts/pull/6091))\r\n\r\n#### Utils\r\n\r\n- `Arrays`: Add `replace` functions enabling in-place array modification of `address[]`, `bytes32[]` and `uint256[]` arrays, with new content from another array. ([#5995](https://github.com/OpenZeppelin/openzeppelin-contracts/pull/5995))\r\n- `Arrays`: Add `slice` and `splice` functions for value types (`uint256[]`, `bytes32[]`, `address[]`). ([#5965](https://github.com/OpenZeppelin/openzeppelin-contracts/pull/5965))\r\n- `Bytes`: Add `replace` functions that replaces a portion of a bytes buffer with content from another buffer. ([#5995](https://github.com/OpenZeppelin/openzeppelin-contracts/pull/5995))\r\n- `Bytes`: Add the `toNibbles` function that expands the nibbles (4 bits chunk) of a `bytes` buffer. Used for manipulating Patricia Merkle Trees keys and paths. ([#5826](https://github.com/OpenZeppelin/openzeppelin-contracts/pull/5826))\r\n- `Memory`: Add a `isReserved(Slice)` function that checks if the memory occupied by the slice is reserved (i.e. before the free memory pointer). ([#6302](https://github.com/OpenZeppelin/openzeppelin-contracts/pull/6302))\r\n- `RLP`: Encode `bytes32` as a fixed size item and not as a scalar in `encode(bytes32)`. Scalar RLP encoding remains available by casting to a `uint256` and using the `encode(uint256)` function. ([#6167](https://github.com/OpenZeppelin/openzeppelin-contracts/pull/6167))\r\n- `RLP`: Fix RLP encoding validity check when decoding long lists or strings ([#6051](https://github.com/OpenZeppelin/openzeppelin-contracts/pull/6051))\r\n- `RLP`: Perform a memory copy when decoding `bytes` objects containing a single byte instead of returning a reference to the input. ([#6303](https://github.com/OpenZeppelin/openzeppelin-contracts/pull/6303))\r\n\r\n","release_url":"https://github.com/OpenZeppelin/openzeppelin-contracts/releases/tag/v5.6.0"},{"release_tag":"v5.6.1","commit_sha":"5fd1781b1454fd1ef8e722282f86f9293cacf256","published_at":"2026-02-27T15:02:36Z","prerelease":0,"release_title":"v5.6.1","release_notes":"- `InteroperableAddress`: Fix overflow in the parsing functions that caused silent misparse of large interoperable addresses. ([#6372](https://github.com/OpenZeppelin/openzeppelin-contracts/pull/6372))\r\n\r\n","release_url":"https://github.com/OpenZeppelin/openzeppelin-contracts/releases/tag/v5.6.1"},{"release_tag":"v5.7.0","commit_sha":"cab19933c33c2ad1d4c7a84864a3601dddfd16f3","published_at":"2026-07-29T16:43:07Z","prerelease":0,"release_title":"v5.7.0","release_notes":"### Breaking changes\r\n\r\n- `EIP712`: Drop the storage fallback for long `name`/`version` values. Both parameters must now fit in a `ShortString` (at most 31 bytes) or the constructor reverts with `ShortStrings.StringTooLong`. Storing the domain exclusively in immutables keeps the domain (and downstream `ERC7739` verification) consistent when the contract is used behind a proxy or clone without an initializer. ([#6631](https://github.com/OpenZeppelin/openzeppelin-contracts/pull/6631))\r\n- `ERC2771Forwarder`: custom error `ERC2771ForwarderFailureInAtomicBatch` has been renamed to `ERC2771ForwarderNoRefundReceiver`. ([#6415](https://github.com/OpenZeppelin/openzeppelin-contracts/pull/6415))\r\n- `Governor` and `IGovernor`: Replace `GovernorQueueNotImplemented` with `GovernorProposalQueueingNotRequired` and `GovernorProposalQueueingFailed`. ([#6582](https://github.com/OpenZeppelin/openzeppelin-contracts/pull/6582))\r\n\r\n### Deprecations\r\n\r\n- `Checkpoints`, `DoubleEndedQueue`, `EnumerableMap` and `EnumerableSet`: Deprecate the `at` function for accessing a specific index of the structure. We introduce new `pos` functions to replace them. ([#6494](https://github.com/OpenZeppelin/openzeppelin-contracts/pull/6494))\r\n\r\n### Changes by category\r\n\r\n#### Utils\r\n\r\n##### Additions\r\n\r\n- `BlockHeader`: Add a new library for verifying and parsing block headers. ([#6395](https://github.com/OpenZeppelin/openzeppelin-contracts/pull/6395))\r\n- `Create3`: Add a library to deploy contracts using the `CREATE3` mechanism, allowing the deployment address to depend only on the salt and the deployer, independently of the deployed bytecode. ([#6402](https://github.com/OpenZeppelin/openzeppelin-contracts/pull/6402))\r\n- `ERC1967Clones`: Add a library to deploy minimal ERC-1967 proxies via `CREATE` or `CREATE2`. ([#6405](https://github.com/OpenZeppelin/openzeppelin-contracts/pull/6405))\r\n- `ERC6372Utils`: Add utility library for ERC-6372 clock mode validation, supporting block number and timestamp modes with consistency checks. ([#6483](https://github.com/OpenZeppelin/openzeppelin-contracts/pull/6483))\r\n- `RateLimiter`: Add a library that provides primitives for limiting the rate at which an action can be performed, with two complementary strategies: a refilling token bucket and a sliding window counter. ([#6490](https://github.com/OpenZeppelin/openzeppelin-contracts/pull/6490))\r\n- `SimulateCall`: Add a new call simulation utilities that allow inspecting return data from contract calls by executing them in a non-mutating, revert-based context. ([#6290](https://github.com/OpenZeppelin/openzeppelin-contracts/pull/6290))\r\n\r\n##### Other\r\n\r\n- `Arrays`: Reduce reliance on recursion to prevent stack overflow and support larger arrays. ([#6324](https://github.com/OpenZeppelin/openzeppelin-contracts/pull/6324))\r\n- `ERC2771Forwarder`: Revert the entire atomic batch if a call with value fails. ([#6391](https://github.com/OpenZeppelin/openzeppelin-contracts/pull/6391))\r\n- `InteroperableAddress`: Fix overflow in the parsing functions that caused silent misparse of large interoperable addresses. ([#6372](https://github.com/OpenZeppelin/openzeppelin-contracts/pull/6372))\r\n- `InteroperableAddress`: Reject inputs with both chain reference and addresses empty. ([#6331](https://github.com/OpenZeppelin/openzeppelin-contracts/pull/6331))\r\n- `Memory`: Add a `isReserved(Slice)` function that checks if the memory occupied by the slice is reserved (i.e. before the free memory pointer). ([#6302](https://github.com/OpenZeppelin/openzeppelin-contracts/pull/6302))\r\n- `Memory`: Remove the `asBytes32` and `asPointer` function to reduce the risk of mistakes when manipulating memory pointers. ([#6348](https://github.com/OpenZeppelin/openzeppelin-contracts/pull/6348))\r\n- `RLP`: Perform a memory copy when decoding `bytes` objects containing a single byte instead of returning a reference to the input. ([#6303](https://github.com/OpenZeppelin/openzeppelin-contracts/pull/6303))\r\n\r\n#### Access\r\n\r\n- `AccessManager`: Treat `setAuthority` differently in `canCall` to prevent bypassing the `updateAuthority` security using an `execute`. ([#6388](https://github.com/OpenZeppelin/openzeppelin-contracts/pull/6388))\r\n- `AccessManager`: Allow a role admin to cancel operations that grant or revoke roles. ([#6573](https://github.com/OpenZeppelin/openzeppelin-contracts/pull/6573))\r\n\r\n#### Account\r\n\r\n- `AccountERC7579`: Revert the uninstallation of any module (validator, executor, fallback, or hook) if its `onUninstall` callback reverts, giving modules control over their own uninstallation. A forced uninstallation that bypasses the callback can still be performed through a delegate call via `execute`. ([#6628](https://github.com/OpenZeppelin/openzeppelin-contracts/pull/6628))\r\n- `ERC4337Utils`, `IERC4337`: Drop the `draft-` prefix from the file names now that ERC-4337 is finalized. Imports must be updated from `account/utils/draft-ERC4337Utils.sol` to `account/utils/ERC4337Utils.sol` and from `interfaces/draft-IERC4337.sol` to `interfaces/IERC4337.sol`. ([#6581](https://github.com/OpenZeppelin/openzeppelin-contracts/pull/6581))\r\n- `Paymaster`: Add a simple ERC-4337 paymaster implementation with minimal logic. ([#6576](https://github.com/OpenZeppelin/openzeppelin-contracts/pull/6576))\r\n- `PaymasterERC20`: Add extension of `Paymaster` that sponsors user operations against payment in ERC-20 tokens. ([#6576](https://github.com/OpenZeppelin/openzeppelin-contracts/pull/6576))\r\n- `PaymasterERC20Guarantor`: Add extension of `PaymasterERC20` that enables third parties to guarantee user operations by prefunding gas costs upfront, with repayment handling for successful operations. ([#6576](https://github.com/OpenZeppelin/openzeppelin-contracts/pull/6576))\r\n- `PaymasterERC721Owner`: Add extension of `Paymaster` that approves sponsoring of user operation based on ownership of an ERC-721 NFT. ([#6576](https://github.com/OpenZeppelin/openzeppelin-contracts/pull/6576))\r\n- `PaymasterSigner`: Add extension of `Paymaster` that approves sponsoring of user operation based on a cryptographic signature verified by the paymaster. ([#6576](https://github.com/OpenZeppelin/openzeppelin-contracts/pull/6576))\r\n\r\n#### Cryptography\r\n\r\n- `ERC7739`: Reject signatures whose `contentsDescr` fails to parse into a non-empty `contentsName`, preventing a malformed descriptor from degrading verification to a constant `structHash` that no longer binds the message contents or the account's EIP-712 domain. ([#6618](https://github.com/OpenZeppelin/openzeppelin-contracts/pull/6618))\r\n- `ERC7913WebAuthnVerifier`: Add an internal `_requireUV` function that can be overridden to disable the UV check. ([#6596](https://github.com/OpenZeppelin/openzeppelin-contracts/pull/6596))\r\n- `MultiSignerERC7913`: Decode the multisignature payload directly from calldata and return `false` on malformed encoding instead of reverting during `abi.decode`, so paymaster/account validation can surface `SIG_VALIDATION_FAILED` rather than bubble up a revert. The `_validateSignatures` and `_validateThreshold` override parameters change from `bytes[] memory` to `bytes[] calldata`. ([#6642](https://github.com/OpenZeppelin/openzeppelin-contracts/pull/6642))\r\n- `RSA`: Return `false` from `pkcs1Sha256` instead of reverting when modular exponentiation fails. ([#6638](https://github.com/OpenZeppelin/openzeppelin-contracts/pull/6638))\r\n- `SignatureChecker`: Zero-pad the ERC-1271 signature calldata to a 32-byte boundary when performing the ERC-1271 static call, so the encoded `bytes` argument conforms to the ABI spec. ([#6646](https://github.com/OpenZeppelin/openzeppelin-contracts/pull/6646))\r\n- `WebAuthn`: Verification now returns `false` instead of reverting when client data contains an out-of-bounds `challengeIndex`. ([#6329](https://github.com/OpenZeppelin/openzeppelin-contracts/pull/6329))\r\n\r\n#### Cross-chain\r\n\r\n- `BridgeERC20Core`: Rename `BridgeERC20Core` to `BridgeFungible`. ([#6328](https://github.com/OpenZeppelin/openzeppelin-contracts/pull/6328))\r\n- `BridgeNonFungible` and `BridgeERC721`: Add bridge contracts to handle crosschain movements of ERC-721 tokens. ([#6259](https://github.com/OpenZeppelin/openzeppelin-contracts/pull/6259))\r\n- `BridgeMultiToken` and `BridgeERC1155`: Add bridge contracts to handle crosschain movements of ERC-1155 tokens. ([#6281](https://github.com/OpenZeppelin/openzeppelin-contracts/pull/6281))\r\n- `CrosschainRemoteExecutor`: Add a new executor contract that relays transaction from a controller on a remote chain. ([#6272](https://github.com/OpenZeppelin/openzeppelin-contracts/pull/6272))\r\n\r\n#### Governance\r\n\r\n- `Governor`: Strictly enforce the expected proposal state depending on `proposalNeedsQueuing` when calling `execute`. ([#6386](https://github.com/OpenZeppelin/openzeppelin-contracts/pull/6386))\r\n- `GovernorCrosschain`: Add governor module that facilitates the execution of crosschain operations through CrosschainRemoteExecutors and ERC-7786 gateways. ([#6272](https://github.com/OpenZeppelin/openzeppelin-contracts/pull/6272))\r\n- `GovernorPreventLateQuorum`: Bound `lateQuorumVoteExtension` by a new internal virtual `_maxLateQuorumVoteExtension` (default `votingPeriod()`) to cap the total voting duration to twice the voting period, thus preventing a large extension from bricking governance. Integrators can override `_maxLateQuorumVoteExtension` to enforce a different bound. ([#6644](https://github.com/OpenZeppelin/openzeppelin-contracts/pull/6644))\r\n\r\n#### Structures\r\n\r\n- `Accumulator`: Check that slices being added (`shift` or `push`) are in the reserved space. ([#6302](https://github.com/OpenZeppelin/openzeppelin-contracts/pull/6302))\r\n- `DoubleEndedQueue`: Add `values(deque, start, end)` to return a slice of the queue as an array, mirroring the paginated `values` accessor in `EnumerableSet`. Out-of-bound values for `start` and `end` are clamped to the queue length. ([#6522](https://github.com/OpenZeppelin/openzeppelin-contracts/pull/6522))\r\n\r\n#### Token\r\n\r\n- `ERC20TransferAuthorization`: Add an ERC-20 extension implementing ERC-3009's transfer with authorization using parallel nonces. ([#6354](https://github.com/OpenZeppelin/openzeppelin-contracts/pull/6354))\r\n- `ERC721Crosschain`: Add an ERC-721 extension to embed an ERC-7786 based crosschain bridge directly in the token contract. ([#6259](https://github.com/OpenZeppelin/openzeppelin-contracts/pull/6259))\r\n- `ERC1155Crosschain`: Add an ERC-1155 extension to embed an ERC-7786 based crosschain bridge directly in the token contract. ([#6281](https://github.com/OpenZeppelin/openzeppelin-contracts/pull/6281))\r\n- `ERC1155Burnable`: Use `_checkAuthorized` to correctly apply authorization overrides. ([#6435](https://github.com/OpenZeppelin/openzeppelin-contracts/pull/6435))\r\n- `SafeERC20`: Add `tryGetDecimals` helper that safely queries a token's `decimals()` without reverting. ([#6482](https://github.com/OpenZeppelin/openzeppelin-contracts/pull/6482))\r\n- `ERC6909ContentURI`, `ERC6909TokenSupply` and `ERC6909Metadata`: Add ERC-165 detection for the `IERC6909ContentURI`, `IERC6909TokenSupply` and `IERC6909Metadata` interfaces. ([#6246](https://github.com/OpenZeppelin/openzeppelin-contracts/pull/6246))\r\n\r\n","release_url":"https://github.com/OpenZeppelin/openzeppelin-contracts/releases/tag/v5.7.0"}]},{"id":"module_catalog","name":"Versioned Contract Modules","description":"A record represents a release-pinned Solidity contract, in const state = { env: 0, view: "overview", recordSet: null, sample: 0, scope: 0, file: 0 };
const esc = (value) => String(value ?? "").replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
const fmt = (value) => new Intl.NumberFormat("zh-CN").format(Number(value || 0));
const bytes = (value) => { const n=Number(value||0); if(n<1024)return `${n} B`; if(n<1048576)return `${(n/1024).toFixed(1)} KB`; return `${(n/1048576).toFixed(1)} MB`; };
const env = () => DATA.environments[state.env];
const badge = (text, tone) => `<span class="badge ${tone}">${esc(text)}</span>`;
const token = (text) => `<span class="token">${esc(text)}</span>`;

function renderSidebar() {
  document.getElementById("envList").innerHTML = DATA.environments.map((item, index) => `
    <button class="env-button ${index===state.env?'active':''}" data-env="${index}">
      <strong>${esc(item.name)}</strong>
      <small>${fmt(item.metrics.records)} 条记录 · ${fmt(item.metrics.files)} 个文件</small>
    </button>`).join("");
  document.querySelectorAll("[data-env]").forEach(button => button.onclick = () => {
    state.env = Number(button.dataset.env); state.recordSet = null; state.scope = 0; state.file = 0; render();
  });
}

function renderHeader() {
  const item=env();
  document.getElementById("title").textContent=item.name;
  document.getElementById("description").textContent=item.description;
  document.getElementById("status").innerHTML = badge(item.qualityTier, item.qualityTier==='rich'?'green':'amber') + badge(item.integrationTier, 'blue') + badge(item.valid?'已验证':'验证失败', item.valid?'green':'red');
  const views=[["overview","总览"],["records","记录数据"],["relations","关系"],["files","文件工作区"]];
  document.getElementById("tabs").innerHTML=views.map(([id,label])=>`<button class="tab ${state.view===id?'active':''}" data-view="${id}">${label}</button>`).join("");
  document.querySelectorAll("[data-view]").forEach(button=>button.onclick=()=>{state.view=button.dataset.view;render();});
}

function metrics() {
  const m=env().metrics;
  return `<div class="metric-grid">
    <div class="metric"><span>全部记录</span><strong>${fmt(m.records)}</strong></div>
    <div class="metric"><span>Record Set</span><strong>${fmt(m.recordSets)}</strong></div>
    <div class="metric"><span>有效关系</span><strong>${fmt(m.relationships)}</strong></div>
    <div class="metric"><span>任务侧文件</span><strong>${fmt(m.files)}</strong></div>
    <div class="metric"><span>需求覆盖</span><strong>${fmt(m.needCoverage)}%</strong></div>
    <div class="metric"><span>选中来源</span><strong>${fmt(m.sources)}</strong></div>
  </div>`;
}

function graphSvg(item) {
  const nodes=[...item.recordSets.map(r=>({id:`record:${r.id}`,label:r.id,kind:r.importance==='core'?'core':'record'})),...item.scopes.map(s=>({id:`scope:${s.id}`,label:s.id,kind:'scope'}))];
  const columns=3, nodeW=220, nodeH=52, gapX=70, gapY=48, margin=42;
  const rows=Math.ceil(nodes.length/columns), width=margin*2+columns*nodeW+(columns-1)*gapX, height=margin*2+rows*nodeH+(rows-1)*gapY;
  const pos={}; nodes.forEach((node,i)=>{const c=i%columns,r=Math.floor(i/columns);pos[node.id]={x:margin+c*(nodeW+gapX),y:margin+r*(nodeH+gapY)};});
  const edges=item.relationships.map(r=>({from:`record:${r.from_record_set_id}`,to:`record:${r.to_record_set_id}`,label:r.matched_reference_count}));
  item.recordSets.forEach(record=>record.fields.filter(f=>f.reference?.scope_id).forEach(f=>edges.push({from:`record:${record.id}`,to:`scope:${f.reference.scope_id}`,label:'path',file:true})));
  const lines=edges.filter(e=>pos[e.from]&&pos[e.to]).map(e=>{const a=pos[e.from],b=pos[e.to];const x1=a.x+nodeW/2,y1=a.y+nodeH/2,x2=b.x+nodeW/2,y2=b.y+nodeH/2;return `<g><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${e.file?'#215f9a':'#9aa7ac'}" stroke-width="2" ${e.file?'stroke-dasharray="5 4"':''}/><text x="${(x1+x2)/2}" y="${(y1+y2)/2-5}" text-anchor="middle" fill="#617076" font-size="10">${esc(e.label)}</text></g>`}).join('');
  const boxes=nodes.map(n=>{const p=pos[n.id],fill=n.kind==='core'?'#e5f4ec':n.kind==='scope'?'#e8f1f8':'#eef2f3',stroke=n.kind==='core'?'#16784c':n.kind==='scope'?'#215f9a':'#aeb9bd';return `<g><rect x="${p.x}" y="${p.y}" width="${nodeW}" height="${nodeH}" rx="5" fill="${fill}" stroke="${stroke}"/><text x="${p.x+12}" y="${p.y+23}" fill="#172126" font-size="11" font-family="ui-monospace,monospace">${esc(n.label)}</text><text x="${p.x+12}" y="${p.y+40}" fill="#617076" font-size="10">${n.kind==='scope'?'Filesystem Scope':n.kind==='core'?'核心记录':'支持记录'}</text></g>`}).join('');
  return `<svg class="model-svg" viewBox="0 0 ${width} ${height}" height="${Math.min(520,height)}" role="img" aria-label="环境数据关系图">${lines}${boxes}</svg>`;
}

function overview() {
  const item=env();
  const needs=item.needs.map(n=>`<div class="need"><strong>${esc(n.need_id)}</strong><p>${esc(n.description)}</p><div class="binding">${(n.record_set_ids||[]).map(token).join('')}${(n.scope_ids||[]).map(v=>token(`scope:${v}`)).join('')}${badge(n.status,n.status==='realized'?'green':'amber')}</div></div>`).join('');
  return `${metrics()}<section class="section"><div class="section-head"><h3>统一数据模型</h3><p>实线为记录关系，虚线为文件路径引用</p></div><div class="panel"><div class="model-wrap">${graphSvg(item)}</div><div class="need-grid">${needs}</div></div></section>`;
}

function renderRecordDetail(record) {
  const fieldRows=record.fields.map(f=>`<tr><td><code>${esc(f.name)}</code></td><td>${esc(f.type)}</td><td>${f.nullable?'可空':'必填'}</td><td>${esc(f.description)}${f.reference?`<div>${token(`scope:${f.reference.scope_id}`)}</div>`:''}</td></tr>`).join('');
  const samples=record.samples.length?record.samples:[{}];
  state.sample=Math.min(state.sample,samples.length-1);
  return `<h4>${esc(record.name)}</h4><p class="desc">${esc(record.description)}</p><div class="status">${badge(record.importance,record.importance==='core'?'green':'amber')}${token(`${fmt(record.count)} rows`)}${(record.keyFields||[]).map(v=>token(`key:${v}`)).join('')}</div><div class="section"><div class="section-head"><h3>字段</h3><p>${fmt(record.fields.length)} 个声明字段</p></div><div class="table-scroll"><table><thead><tr><th>字段</th><th>类型</th><th>空值</th><th>含义</th></tr></thead><tbody>${fieldRows}</tbody></table></div></div><div class="sample-tabs">${samples.map((_,i)=>`<button class="sample-tab ${i===state.sample?'active':''}" data-sample="${i}">样例 ${i+1}</button>`).join('')}</div><pre>${esc(JSON.stringify(samples[state.sample],null,2))}</pre>`;
}

function recordsView() {
  const item=env(); if(!item.recordSets.length)return '<div class="empty">没有 Record Set</div>';
  if(!state.recordSet||!item.recordSets.some(r=>r.id===state.recordSet))state.recordSet=item.recordSets[0].id;
  const selected=item.recordSets.find(r=>r.id===state.recordSet);
  const html=`${metrics()}<section class="section"><div class="panel split"><div class="list">${item.recordSets.map(r=>`<button class="list-button ${r.id===state.recordSet?'active':''}" data-record="${esc(r.id)}"><strong>${esc(r.id)}</strong><small>${fmt(r.count)} 条 · ${esc(r.importance)}</small></button>`).join('')}</div><div class="detail" id="recordDetail">${renderRecordDetail(selected)}</div></div></section>`;
  setTimeout(()=>{document.querySelectorAll('[data-record]').forEach(b=>b.onclick=()=>{state.recordSet=b.dataset.record;state.sample=0;render();});document.querySelectorAll('[data-sample]').forEach(b=>b.onclick=()=>{state.sample=Number(b.dataset.sample);render();});},0);return html;
}

function relationsView() {
  const rows=env().relationships.map(r=>`<tr><td>${esc(r.relationship_id)}</td><td>${esc(r.from_record_set_id)}</td><td>${esc(r.to_record_set_id)}</td><td>${fmt(r.matched_reference_count)}</td><td>${fmt(r.missing_reference_count)}</td><td>${r.valid?badge('有效','green'):badge('无效','red')}</td></tr>`).join('');
  return `${metrics()}<section class="section"><div class="section-head"><h3>实际关系闭合</h3><p>统计来自最终 SQLite 的独立画像</p></div><div class="panel table-scroll"><table class="relations"><thead><tr><th>关系</th><th>来源 Record Set</th><th>目标 Record Set</th><th>命中</th><th>缺失</th><th>状态</th></tr></thead><tbody>${rows}</tbody></table></div></section>`;
}

function filesView() {
  const scopes=env().scopes;if(!scopes.length)return `${metrics()}<section class="section"><div class="panel empty">该环境没有任务侧文件工作区，全部能力来自结构化记录。</div></section>`;
  state.scope=Math.min(state.scope,scopes.length-1);const scope=scopes[state.scope];state.file=Math.min(state.file,Math.max(0,scope.files.length-1));const file=scope.files[state.file];
  const scopeTabs=scopes.map((s,i)=>`<button class="sample-tab ${i===state.scope?'active':''}" data-scope="${i}">${esc(s.id)} · ${fmt(s.files.length)}</button>`).join('');
  const fileList=scope.files.map((f,i)=>`<button class="file-button ${i===state.file?'active':''}" data-file="${i}"><code>${esc(f.path)}</code><small>${esc(f.format)} · ${bytes(f.bytes)}</small></button>`).join('');
  const preview=file?.preview?`<pre>${esc(file.preview)}</pre>`:`<div class="empty">该文件不提供文本预览</div>`;
  const html=`${metrics()}<section class="section"><div class="sample-tabs">${scopeTabs}</div><div class="panel file-layout"><div class="scope-column"><div class="scope-head"><h4>${esc(scope.name)}</h4><p>${esc(scope.description)}</p></div>${fileList}</div><div class="detail"><h4>${esc(file?.path||scope.id)}</h4><p class="desc">${file?`${esc(file.format)} · ${bytes(file.bytes)}`:`${fmt(scope.files.length)} 个文件`}</p>${preview}</div></div></section>`;
  setTimeout(()=>{document.querySelectorAll('[data-scope]').forEach(b=>b.onclick=()=>{state.scope=Number(b.dataset.scope);state.file=0;render();});document.querySelectorAll('[data-file]').forEach(b=>b.onclick=()=>{state.file=Number(b.dataset.file);render();});},0);return html;
}

function renderContent(){const views={overview,records:recordsView,relations:relationsView,files:filesView};document.getElementById('content').innerHTML=views[state.view]();}
function render(){renderSidebar();renderHeader();renderContent();}
render();
</script>
