<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent-World 任务案例浏览器</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6f7;
      --surface: #ffffff;
      --surface-soft: #f8faf9;
      --ink: #17201e;
      --muted: #65716e;
      --line: #dce3e1;
      --accent: #087f6b;
      --accent-soft: #e7f4f0;
      --blue: #2367a6;
      --blue-soft: #eaf2f9;
      --amber: #a05a08;
      --amber-soft: #fff2dc;
      --red: #a43a3a;
      --red-soft: #fbeaea;
      --shadow: 0 4px 18px rgba(23, 32, 30, 0.07);
      font-family: Inter, "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
    }

    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); }
    button, input, select { font: inherit; }
    button, select { cursor: pointer; }
    a { color: var(--blue); overflow-wrap: anywhere; }
    code, pre { font-family: "Cascadia Code", Consolas, monospace; }

    .topbar {
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 14px 24px;
      background: #17201e;
      color: white;
      border-bottom: 3px solid var(--accent);
    }
    .brand h1 { margin: 0; font-size: 20px; letter-spacing: 0; }
    .brand p { margin: 4px 0 0; color: #bdc8c5; font-size: 13px; }
    .toplinks { display: flex; gap: 16px; font-size: 13px; white-space: nowrap; }
    .toplinks a { color: #d9e9e5; }

    .overview {
      display: grid;
      grid-template-columns: repeat(5, minmax(120px, 1fr));
      gap: 1px;
      background: var(--line);
      border-bottom: 1px solid var(--line);
    }
    .metric { background: var(--surface); padding: 14px 20px; min-height: 72px; }
    .metric strong { display: block; font-size: 22px; line-height: 1.1; }
    .metric span { display: block; margin-top: 5px; color: var(--muted); font-size: 12px; }

    .filters {
      display: grid;
      grid-template-columns: minmax(260px, 1fr) repeat(3, minmax(150px, 220px));
      gap: 10px;
      padding: 12px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .filters input, .filters select {
      width: 100%;
      min-height: 40px;
      padding: 8px 10px;
      color: var(--ink);
      background: white;
      border: 1px solid #bdc8c5;
      border-radius: 5px;
      outline: none;
    }
    .filters input:focus, .filters select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

    .workspace {
      display: grid;
      grid-template-columns: minmax(300px, 370px) minmax(0, 1fr);
      min-height: calc(100vh - 197px);
    }
    .case-pane {
      background: #edf1f0;
      border-right: 1px solid var(--line);
      overflow-y: auto;
      max-height: calc(100vh - 197px);
    }
    .list-status {
      padding: 12px 16px 8px;
      color: var(--muted);
      font-size: 12px;
      position: sticky;
      top: 0;
      background: #edf1f0;
      z-index: 2;
    }
    .case-list { display: grid; gap: 8px; padding: 0 10px 18px; }
    .case-item {
      width: 100%;
      text-align: left;
      padding: 12px;
      background: var(--surface);
      color: var(--ink);
      border: 1px solid transparent;
      border-radius: 6px;
      box-shadow: 0 1px 4px rgba(23, 32, 30, 0.04);
    }
    .case-item:hover { border-color: #aebcb8; }
    .case-item.active { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
    .case-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .case-id { color: var(--accent); font-weight: 700; font-size: 12px; }
    .case-env { margin-top: 6px; font-weight: 650; font-size: 14px; overflow-wrap: anywhere; }
    .case-request {
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .case-meta { display: flex; gap: 10px; margin-top: 9px; color: var(--muted); font-size: 11px; }

    .quality {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 2px 7px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 650;
      white-space: nowrap;
    }
    .quality.strong { color: #076452; background: var(--accent-soft); }
    .quality.normal { color: #225f92; background: var(--blue-soft); }
    .quality.review { color: var(--amber); background: var(--amber-soft); }
    .quality.boundary { color: var(--red); background: var(--red-soft); }

    .detail-pane { overflow-y: auto; max-height: calc(100vh - 197px); background: var(--surface); }
    .detail { max-width: 1080px; margin: 0 auto; padding: 28px 34px 80px; }
    .detail-empty { padding: 80px 30px; text-align: center; color: var(--muted); }
    .detail-head { padding-bottom: 22px; border-bottom: 1px solid var(--line); }
    .detail-kicker { color: var(--accent); font-weight: 700; font-size: 13px; }
    .detail h2 { margin: 7px 0 8px; font-size: 26px; line-height: 1.25; letter-spacing: 0; }
    .environment-id { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
    .badges { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 14px; }
    .badge { padding: 5px 8px; border: 1px solid var(--line); border-radius: 4px; color: #46514e; font-size: 12px; background: var(--surface-soft); }

    .section { padding: 24px 0; border-bottom: 1px solid var(--line); }
    .section h3 { margin: 0 0 12px; font-size: 16px; letter-spacing: 0; }
    .request { margin: 0; font-size: 17px; line-height: 1.65; color: #27322f; }
    .review-box { padding: 14px 16px; border-left: 4px solid var(--amber); background: var(--amber-soft); line-height: 1.6; border-radius: 0 5px 5px 0; }
    .review-box.strong { border-left-color: var(--accent); background: var(--accent-soft); }
    .review-box.normal { border-left-color: var(--blue); background: var(--blue-soft); }
    .review-box.boundary { border-left-color: var(--red); background: var(--red-soft); }

    .chains { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .chain-label { margin-bottom: 9px; color: var(--muted); font-size: 12px; font-weight: 650; }
    .chain { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
    .chain-step { padding: 6px 8px; background: var(--surface-soft); border: 1px solid var(--line); border-radius: 4px; font: 12px/1.25 "Cascadia Code", Consolas, monospace; overflow-wrap: anywhere; }
    .chain-arrow { color: #8b9693; font-size: 12px; }

    .answer {
      margin: 0;
      padding: 16px;
      max-height: 520px;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #111815;
      color: #e6efec;
      font-size: 12px;
      line-height: 1.6;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    details.call { border-top: 1px solid var(--line); }
    details.call:last-child { border-bottom: 1px solid var(--line); }
    details.call summary { display: flex; align-items: center; gap: 12px; padding: 12px 4px; cursor: pointer; list-style: none; }
    details.call summary::-webkit-details-marker { display: none; }
    .call-number { width: 26px; height: 26px; display: grid; place-items: center; flex: 0 0 auto; border-radius: 50%; color: white; background: var(--accent); font-size: 11px; font-weight: 700; }
    .call-name { font: 13px "Cascadia Code", Consolas, monospace; font-weight: 650; overflow-wrap: anywhere; }
    .call-body { display: grid; grid-template-columns: 1fr 1.4fr; gap: 14px; padding: 0 4px 16px 42px; }
    .call-body h4 { margin: 0 0 7px; color: var(--muted); font-size: 11px; text-transform: uppercase; }
    .call-body pre { margin: 0; padding: 10px; max-height: 340px; overflow: auto; background: var(--surface-soft); border: 1px solid var(--line); border-radius: 4px; font-size: 11px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }

    .tool-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .tool { padding: 10px; border: 1px solid var(--line); border-radius: 5px; background: var(--surface-soft); }
    .tool strong { display: block; font: 12px "Cascadia Code", Consolas, monospace; overflow-wrap: anywhere; }
    .tool span { display: block; margin-top: 5px; color: var(--muted); font-size: 11px; line-height: 1.45; }
    .source-list { margin: 0; padding-left: 20px; }
    .source-list li { margin: 7px 0; font-size: 12px; line-height: 1.4; }

    .nav-buttons { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
    .nav-buttons button { width: 36px; height: 36px; border: 1px solid var(--line); background: white; color: var(--ink); border-radius: 5px; }
    .nav-buttons button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
    .nav-buttons button:disabled { opacity: 0.35; cursor: default; }
    .no-results { padding: 40px 18px; color: var(--muted); text-align: center; line-height: 1.6; }

    @media (max-width: 980px) {
      .overview { grid-template-columns: repeat(3, 1fr); }
      .filters { grid-template-columns: 1fr 1fr; }
      .workspace { grid-template-columns: minmax(260px, 320px) minmax(0, 1fr); min-height: calc(100vh - 285px); }
      .case-pane, .detail-pane { max-height: calc(100vh - 285px); }
      .chains, .call-body { grid-template-columns: 1fr; }
      .detail { padding: 24px 24px 60px; }
    }

    @media (max-width: 720px) {
      .topbar { align-items: flex-start; padding: 14px 16px; }
      .toplinks { display: none; }
      .overview { grid-template-columns: repeat(2, 1fr); }
      .filters { position: static; grid-template-columns: 1fr; padding: 10px; }
      .workspace { display: block; }
      .case-pane { max-height: 360px; border-right: 0; border-bottom: 1px solid var(--line); }
      .detail-pane { max-height: none; overflow: visible; }
      .detail { padding: 22px 16px 60px; }
      .detail h2 { font-size: 22px; }
      .tool-list { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>Agent-World 任务案例浏览器</h1>
      <p>真实数据环境 · Luna 5-run 成功轨迹 · 原始结果审查</p>
    </div>
    <nav class="toplinks" aria-label="数据文件">
      <a href="README_ZH.md">阅读说明</a>
      <a href="case_index.csv">案例索引</a>
      <a href="cases.jsonl">完整 JSONL</a>
    </nav>
  </header>

  <section class="overview" id="overview" aria-label="总体统计"></section>

  <section class="filters" aria-label="案例筛选">
    <input id="search" type="search" placeholder="搜索任务、环境或案例编号" aria-label="搜索案例">
    <select id="category-filter" aria-label="按领域筛选"></select>
    <select id="quality-filter" aria-label="按质量筛选">
      <option value="all">全部质量</option>
      <option value="较强案例">较强案例</option>
      <option value="正常案例">正常案例</option>
      <option value="可用但建议复核">建议复核</option>
      <option value="边界案例">边界案例</option>
    </select>
    <select id="type-filter" aria-label="按任务类型筛选">
      <option value="all">全部任务类型</option>
      <option value="natural_graph_walk">自然图游走</option>
      <option value="related_composition">相关任务组合</option>
    </select>
  </section>

  <main class="workspace">
    <aside class="case-pane" aria-label="案例列表">
      <div class="list-status" id="list-status"></div>
      <div class="case-list" id="case-list"></div>
    </aside>
    <section class="detail-pane" id="detail-pane" aria-live="polite">
      <div class="detail-empty">从左侧选择一条案例查看完整内容。</div>
    </section>
  </main>

  <script id="case-data" type="application/json">__CASE_DATA__</script>
  <script id="overview-data" type="application/json">__OVERVIEW_DATA__</script>
  <script>
    const cases = JSON.parse(document.getElementById('case-data').textContent);
    const overview = JSON.parse(document.getElementById('overview-data').textContent);
    const state = { filtered: [...cases], selectedId: cases[0]?.case_id || null };

    const dom = {
      overview: document.getElementById('overview'),
      search: document.getElementById('search'),
      category: document.getElementById('category-filter'),
      quality: document.getElementById('quality-filter'),
      type: document.getElementById('type-filter'),
      status: document.getElementById('list-status'),
      list: document.getElementById('case-list'),
      detail: document.getElementById('detail-pane')
    };

    function escapeHtml(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function pretty(value) {
      return JSON.stringify(value ?? null, null, 2);
    }

    function categoryName(value) {
      return String(value).replace(/^\d+_/, '');
    }

    function taskTypeName(value) {
      return value === 'related_composition' ? '相关任务组合' : '自然图游走';
    }

    function qualityClass(value) {
      if (value === '较强案例') return 'strong';
      if (value === '正常案例') return 'normal';
      if (value === '边界案例') return 'boundary';
      return 'review';
    }

    function chainMarkup(calls) {
      if (!calls?.length) return '<span class="environment-id">无</span>';
      return calls.map((call, index) => {
        const step = `<span class="chain-step">${escapeHtml(call.tool)}</span>`;
        return index === calls.length - 1 ? step : `${step}<span class="chain-arrow">→</span>`;
      }).join('');
    }

    function renderOverview() {
      const stats = overview.package;
      const items = [
        [stats.main_cases + stats.boundary_cases, '本包案例'],
        [overview.corpus.totals.environments_completed, '全部环境'],
        [overview.corpus.totals.tasks_passed, '通过任务'],
        [stats.average_reference_steps, '案例平均参考步数'],
        [stats.average_successful_tool_calls, '平均实际工具调用']
      ];
      dom.overview.innerHTML = items.map(([value, label]) =>
        `<div class="metric"><strong>${escapeHtml(value)}</strong><span>${escapeHtml(label)}</span></div>`
      ).join('');
    }

    function initializeCategories() {
      const categories = [...new Set(cases.map(item => item.category))];
      dom.category.innerHTML = '<option value="all">全部领域</option>' + categories.map(value =>
        `<option value="${escapeHtml(value)}">${escapeHtml(categoryName(value))}</option>`
      ).join('');
    }

    function renderList() {
      dom.status.textContent = `显示 ${state.filtered.length} / ${cases.length} 条`;
      if (!state.filtered.length) {
        dom.list.innerHTML = '<div class="no-results">没有匹配的案例。<br>可以清空搜索或调整筛选条件。</div>';
        dom.detail.innerHTML = '<div class="detail-empty">当前筛选条件下没有案例。</div>';
        return;
      }
      if (!state.filtered.some(item => item.case_id === state.selectedId)) {
        state.selectedId = state.filtered[0].case_id;
      }
      dom.list.innerHTML = state.filtered.map(item => {
        const active = item.case_id === state.selectedId ? ' active' : '';
        const quality = item.quality_review.label;
        return `<button class="case-item${active}" data-case-id="${escapeHtml(item.case_id)}">
          <div class="case-row">
            <span class="case-id">${escapeHtml(item.case_id)}</span>
            <span class="quality ${qualityClass(quality)}">${escapeHtml(quality)}</span>
          </div>
          <div class="case-env">${escapeHtml(item.environment.theme)}</div>
          <div class="case-request">${escapeHtml(item.task.request)}</div>
          <div class="case-meta">
            <span>参考 ${item.task.reference_steps} 步</span>
            <span>实际 ${item.successful_trajectory.tool_call_count} 次</span>
            <span>${escapeHtml(taskTypeName(item.task.task_type))}</span>
          </div>
        </button>`;
      }).join('');
      dom.list.querySelectorAll('.case-item').forEach(button => {
        button.addEventListener('click', () => selectCase(button.dataset.caseId));
      });
    }

    function renderCalls(calls) {
      return calls.map((call, index) => `<details class="call">
        <summary>
          <span class="call-number">${index + 1}</span>
          <span class="call-name">${escapeHtml(call.tool)}</span>
        </summary>
        <div class="call-body">
          <div><h4>Arguments</h4><pre>${escapeHtml(pretty(call.arguments))}</pre></div>
          <div><h4>Result</h4><pre>${escapeHtml(pretty(call.result))}</pre></div>
        </div>
      </details>`).join('');
    }

    function renderDetail(item) {
      const env = item.environment;
      const task = item.task;
      const trajectory = item.successful_trajectory;
      const review = item.quality_review;
      const index = state.filtered.findIndex(entry => entry.case_id === item.case_id);
      const sources = env.source_urls?.length
        ? `<ul class="source-list">${env.source_urls.map(url => `<li><a href="${escapeHtml(url)}" target="_blank" rel="noreferrer">${escapeHtml(url)}</a></li>`).join('')}</ul>`
        : '<p class="environment-id">未提取到可直接展示的来源 URL。</p>';
      const tools = item.available_tools.map(tool => `<div class="tool">
        <strong>${escapeHtml(tool.name)}</strong>
        <span>${escapeHtml(tool.description)}</span>
      </div>`).join('');
      dom.detail.innerHTML = `<article class="detail">
        <header class="detail-head">
          <div class="detail-kicker">${escapeHtml(item.case_id)} · ${escapeHtml(categoryName(item.category))}</div>
          <h2>${escapeHtml(env.theme)}</h2>
          <div class="environment-id">${escapeHtml(env.environment_id)} · ${escapeHtml(env.batch)} · ${escapeHtml(env.source_name || '未标注来源名')}</div>
          <div class="badges">
            <span class="quality ${qualityClass(review.label)}">${escapeHtml(review.label)}</span>
            <span class="badge">${escapeHtml(taskTypeName(task.task_type))}</span>
            <span class="badge">参考链 ${task.reference_steps} 步</span>
            <span class="badge">实际调用 ${trajectory.tool_call_count} 次</span>
            <span class="badge">5-run 已通过</span>
          </div>
        </header>

        <section class="section">
          <h3>用户任务</h3>
          <p class="request">${escapeHtml(task.request)}</p>
        </section>

        <section class="section">
          <h3>质量说明</h3>
          <div class="review-box ${qualityClass(review.label)}"><strong>${escapeHtml(review.label)}</strong><br>${escapeHtml(review.note)}</div>
        </section>

        <section class="section">
          <h3>两条工具链怎么走</h3>
          <div class="chains">
            <div><div class="chain-label">隐藏参考链</div><div class="chain">${chainMarkup(item.reference_calls)}</div></div>
            <div><div class="chain-label">Luna 实际成功链</div><div class="chain">${chainMarkup(trajectory.calls)}</div></div>
          </div>
        </section>

        <section class="section">
          <h3>最终答案（原始输出）</h3>
          <pre class="answer">${escapeHtml(pretty(trajectory.final_answer))}</pre>
        </section>

        <section class="section">
          <h3>实际工具调用</h3>
          ${renderCalls(trajectory.calls)}
        </section>

        <section class="section">
          <h3>数据来源</h3>
          ${sources}
        </section>

        <details class="section">
          <summary><strong>查看可用工具（${item.available_tools.length} 个）</strong></summary>
          <div class="tool-list" style="margin-top: 14px">${tools}</div>
        </details>

        <details class="section">
          <summary><strong>查看隐藏参考答案</strong></summary>
          <pre class="answer" style="margin-top: 14px">${escapeHtml(pretty(item.reference_answer))}</pre>
        </details>

        <div class="nav-buttons">
          <button id="previous-case" title="上一条" aria-label="上一条" ${index <= 0 ? 'disabled' : ''}>←</button>
          <button id="next-case" title="下一条" aria-label="下一条" ${index >= state.filtered.length - 1 ? 'disabled' : ''}>→</button>
        </div>
      </article>`;
      document.getElementById('previous-case')?.addEventListener('click', () => {
        if (index > 0) selectCase(state.filtered[index - 1].case_id, true);
      });
      document.getElementById('next-case')?.addEventListener('click', () => {
        if (index < state.filtered.length - 1) selectCase(state.filtered[index + 1].case_id, true);
      });
    }

    function selectCase(caseId, scrollTop = false) {
      state.selectedId = caseId;
      renderList();
      const item = cases.find(entry => entry.case_id === caseId);
      if (item) renderDetail(item);
      if (scrollTop) dom.detail.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function applyFilters() {
      const query = dom.search.value.trim().toLowerCase();
      const category = dom.category.value;
      const quality = dom.quality.value;
      const type = dom.type.value;
      state.filtered = cases.filter(item => {
        const haystack = [
          item.case_id,
          item.category,
          item.environment.environment_id,
          item.environment.theme,
          item.task.request,
          item.quality_review.label
        ].join(' ').toLowerCase();
        return (!query || haystack.includes(query))
          && (category === 'all' || item.category === category)
          && (quality === 'all' || item.quality_review.label === quality)
          && (type === 'all' || item.task.task_type === type);
      });
      renderList();
      const selected = state.filtered.find(item => item.case_id === state.selectedId);
      if (selected) renderDetail(selected);
    }

    [dom.search, dom.category, dom.quality, dom.type].forEach(control => {
      control.addEventListener('input', applyFilters);
      control.addEventListener('change', applyFilters);
    });

    renderOverview();
    initializeCategories();
    renderList();
    if (cases[0]) renderDetail(cases[0]);
  </script>
</body>
</html>
